<!-- ORTHOFI INSIGHTS (21/11/2026, SANDBOX DEMO). Cory: "Let's do #1 the TC scorecards ... Also number 2 ... Lets just build it
     in sandbox for now" and "I like how patients pay too, we should build it in demo version to see if they like it" and "where
     patients come from ... would be good for marketing page too". Four tabs, all office TOTALS from OrthoFi (never a patient):
       TC scorecards  - /patient-exams by exam date, split by TC: kept, new-patient kept, treatment recommended, started,
                        pending, declined, no-shows/cancels. Checked on live 21/11: every October exam has its TC (374 kept,
                        12 TCs) while the TC Tracker had 11 consults logged - OrthoFi is the complete record.
       Late payments  - /delinquent (TODAY's list), by days past due; OrthoFi's own stages (flag 45-53, dismissal letter
                        91-98, maintenance 121-129, dismissal 180+); the trend from a daily snapshot (ph_orthofi_late).
       How patients pay - the business health dashboard: pay in full, down payment, same-day cash, plan length, extensions.
       Where they come from - /referrals by exam date, split by referral SOURCE only (the "option" can name a patient).
     Sandbox: made-up numbers. Live: admins only, and the page isn't in the menu there yet. -->
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber:#F2A03D; --amber-soft:#FDF1E1; --amber-ink:#8a5208;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06); --radius:14px; --maxw:1100px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}

  @media (prefers-reduced-motion:reduce){ .tip{animation:none} }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin:2px 0 6px}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stp{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#FBFCFD;display:flex;flex-direction:column;gap:2px}
  .stp .ic{font-size:20px} .stp b{font-size:24px;color:var(--navy);line-height:1.1} .stp span{font-weight:700;color:var(--navy);font-size:13.5px} .stp small{color:var(--soft);font-size:12px}
  .m{display:grid;grid-template-columns:108px 1fr 52px;gap:8px;align-items:center;font-size:12.5px;color:var(--soft)}
  .m .t{position:relative;height:9px;border-radius:5px;background:#EEF2F6}
  .m .t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal)}
  .m .t u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy);border-radius:1px}

  .src{display:grid;grid-template-columns:200px 1fr 130px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid #F0F3F7}

  .hb{height:14px;border-radius:7px}
  .hb i{border-radius:7px}
  @media(max-width:640px){ .lrow,.src{grid-template-columns:1fr;gap:6px} .l90,.sv{text-align:left;align-items:flex-start} .stack{width:100% !important} }
  @media(max-width:640px){ .wrap{padding:16px 12px 140px} h1{font-size:21px} }

<body>
<div class="ribbon" id="ribbon">SANDBOX — made-up numbers, to see how it would look.</div>
<header class="hdr"><div class="hdr-in"><span class="mark"><img src="../assets/logo-mark.png?v=2" alt="" width="34" height="34"></span><span class="brand">Home-<i>Brace</i><small>OrthoFi insights</small></span></div></header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>
<div class="wrap" id="wrap">
  <h1>OrthoFi insights</h1>
  <p class="lede">Straight from OrthoFi, office by office — nobody types or logs anything. Totals only, never a patient.</p>
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <span style="flex:1"></span>
    <button id="per" aria-label="Period"></button>
    <select id="off" aria-label="Office"></select>
  </div>
  <div id="view"></div>
</div>
<script>
(function(){
  'use strict';
  const LIVE=!!(window.PH && PH.isLive && PH.isLive()), O=window.PH_ORTHOFI;
  const el=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const p2=n=>String(n).padStart(2,'0'), r1=x=>Math.round(x*10)/10;
  const pct=(a,b)=>b ? Math.round(a/b*1000)/10 : null, fp=v=>v==null ? '—' : v+'%';
  const money=v=>v==null ? '—' : (v<0?'−':'')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');
  const TABS=[['tc','TC scorecards'],['late','Late payments'],['pay','How patients pay'],['ref','Where patients come from']];
  let TAB='tc'; try{ TAB=localStorage.getItem('ph_insights_tab')||'tc'; }catch(_){}
  if(!TABS.some(t=>t[0]===TAB)) TAB='tc';
  const now=new Date(), lm=new Date(now.getFullYear(), now.getMonth()-1, 1);
  /* THE PERIOD (21/11/2026, Cory: "we already built a date picker. Also what if they want to do this quarter, year to date,
     last year etc?") - periodpick.js: a month, a quarter, year to date or a year; every tab but Late payments (today) follows it */
  const PER=PH_PERIOD.attach(el('per'), {value:{kind:'month', y:lm.getFullYear(), m:lm.getMonth()+1}, onChange:()=>render()});
  const offices=()=>(PH.officeNames && PH.officeNames().length) ? PH.officeNames() : ['Carlsbad','Clovis','Hobbs','San Angelo','Lubbock','Mansfield','Cruces LCO','Cruces FFO'];
  function drawOff(){ const v=el('off').value||'__all'; el('off').innerHTML='<option value="__all">All offices</option>'+offices().map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join(''); }
  const period=()=>PER.range();
  const pickOffs=()=>{ const v=el('off').value; return v && v!=='__all' ? [v] : offices(); };

  /* ---------------- made-up numbers for the sandbox (seeded: everyone sees the same) ---------------- */
  function rng(seed){ let s=0; for(const c of String(seed)) s=(s*31+c.charCodeAt(0))%2147483647; return ()=>{ s=(s*1103515245+12345)%2147483648; return s/2147483648; }; }
  const DEMO_TCS={'Carlsbad':['Ava Moreno'],'Clovis':['Lena Ortiz'],'Hobbs':['Mia Duran','Kate Ruiz'],'San Angelo':['Rosa Vega'],'Lubbock':['Nina Park'],'Mansfield':['Tara Quinn'],'Cruces LCO':['Gina Salas','Ivy Cole'],'Cruces FFO':['Dana Reyes']};
  function demoTC(o, y, m){ const R=rng('tc'+o+y+m), out={};
    (DEMO_TCS[o]||['Sam Lee']).forEach((t,i)=>{ const keptNew=Math.round((i? 6:24)+R()*28), recall=Math.round(R()*8), rec=Math.round(keptNew*(0.62+R()*0.25)), started=Math.round(rec*(0.42+R()*0.33)),
      pending=Math.round((rec-started)*(0.4+R()*0.4)), declined=Math.max(0, rec-started-pending), ns=Math.round(keptNew*(0.08+R()*0.12));
      out[t]={keptNew, kept:keptNew+recall, rec, started, pending, declined, noshow:ns, cancel:Math.round(ns*0.8)}; }); return out; }
  function demoLate(o, day){ const R=rng('late'+o+day), base=24+Math.round(R()*40); const b=[base, Math.round(base*0.45), Math.round(base*0.25), Math.round(base*0.3), Math.round(base*0.12+R()*4)];
    const amt=b.map((n,i)=>n*(180+i*260)*(0.8+R()*0.4)); return {n:b, amt, flag:Math.round(b[1]*0.35), letter:Math.round(b[3]*0.18), maint:Math.round(b[3]*0.14), dismiss:b[4]}; }
  function demoPay(o, y, m){ const R=rng('pay'+o+y+m), starts=Math.round(18+R()*30), pif=Math.round(starts*(0.08+R()*0.15)), resp=starts*(5200+R()*900), nonPif=resp*(1-pif/starts);
    return {starts, pif, sameDayStarts:Math.round(starts*(0.15+R()*0.3)), dp:nonPif*(0.14+R()*0.12), nonPif, sdc:resp*(0.12+R()*0.15), resp, ext:Math.round(starts*(0.05+R()*0.2)), months:(starts-pif)*(20+R()*8)}; }
  function demoRef(o, y, m){ const R=rng('ref'+o+y+m), S=[['My Dentist',0.38,0.42],['Friend / Family',0.22,0.52],['Internet Search',0.15,0.38],['Social Media',0.07,0.3],['Other',0.15,0.4],['Advertisement',0.03,0.3]], tot=40+Math.round(R()*40), out={};
    S.forEach(([s,share,conv])=>{ const n=Math.max(0, Math.round(tot*share*(0.7+R()*0.6))), st=Math.round(n*conv*(0.7+R()*0.6)); out[s]={n, started:Math.min(n,st), prod:Math.min(n,st)*(5000+R()*1200)}; }); return out; }

  /* ---------------- the real numbers (live: admins; the same asks proven on live 21/11/2026) ---------------- */
  let MAP=null; const CACHE={};
  async function map(){ if(!MAP) MAP=O.cleanMap(await PH_STORE.get(O.KEY)); return MAP; }
  async function ask(key, fn){ if(CACHE[key]) return CACHE[key]; const v=await fn(); CACHE[key]=v; return v; }
  async function liveTC(o, R){ const b={first:R.first, last:R.last}, M=await map(), locs=O.locsOf(M,o); if(!locs.length) return {};
    const K='kept exam', a=await O.ask({ask:'sum', path:'/v1/practice-locations/patient-exams', locs, params:{'exam-date-start-date':b.first,'exam-date-end-date':b.last}, group:'treatmentCoordinatorName',
      count:[{name:'kept', eq:{keptExamFlag:[K]}}, {name:'keptNew', eq:{keptExamFlag:[K], examTypeName:['new']}}, {name:'rec', eq:{keptExamFlag:[K], patientExamResultName:['treatment recommended']}},
             {name:'started', eq:{patientExamTreatmentStatusName:['patient started']}}, {name:'pending', eq:{patientExamTreatmentStatusName:['pending financing selection','start / records']}},
             {name:'declined', eq:{patientExamTreatmentStatusName:['decline tx']}}, {name:'noshow', eq:{patientExamResultName:['patient did not show up']}}, {name:'cancel', eq:{patientExamResultName:['patient canceled']}}]});
    const r={}; Object.keys(a.by||{}).forEach(l=>{ const G=a.by[l].groups||{}; Object.keys(G).forEach(t=>{ const x=r[t]=r[t]||{}; ['kept','keptNew','rec','started','pending','declined','noshow','cancel'].forEach(k=>{ x[k]=(x[k]||0)+((G[t].cnt||{})[k]||0); }); }); }); return r; }
  const MINS=[1,31,45,54,61,91,99,121,130,181];
  async function liveLate(o){ const M=await map(), locs=O.locsOf(M,o); if(!locs.length) return null;
    const a=await O.ask({ask:'sum', path:'/v1/practice-locations/delinquent', locs, params:{}, count:MINS.map(d=>({name:'d'+d, min:{daysPastDue:d}}))});
    const c=k=>Object.keys(a.by||{}).reduce((s,l)=>s+((a.by[l].cnt||{})[k]||0),0), $=k=>Object.keys(a.by||{}).reduce((s,l)=>s+((((a.by[l].csum||{})[k]||{}).sum||{}).pastDueAmount||0),0);

    return {n, amt, flag:c('d45')-c('d54'), letter:c('d91')-c('d99'), maint:c('d121')-c('d130'), dismiss:c('d181')}; }
  async function livePay(o, R){ const lastM=R.months[R.months.length-1], b={first:R.first, last:O.monthBounds(lastM.y, lastM.m).last}, M=await map(), locs=O.locsOf(M,o); if(!locs.length) return null;   // business health is filed under each month's LAST day

  /* ---------------- the late-payment trend: one snapshot a day (live), the sandbox makes one up ---------------- */
  const LATE_KEY='ph_orthofi_late';
  async function lateTrend(today){
    if(!LIVE){ const ago=new Date(Date.now()-7*864e5).toISOString().slice(0,10), out={}; offices().forEach(o=>{ out[o]=demoLate(o, ago); }); return {day:ago, by:out}; }
    try{ const rec=(await PH_STORE.get(LATE_KEY))||{days:{}}, days=Object.keys(rec.days||{}).sort(), target=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
      const d=days.filter(x=>x<=target).pop() || days.filter(x=>x<today)[0]; return d ? {day:d, by:rec.days[d]} : null; }catch(_){ return null; }
  }
  async function lateSave(today, by){
    if(!LIVE) return;
    try{ await PH_STORE.update(LATE_KEY, cur=>{ const x=(cur && typeof cur==='object') ? cur : {v:1, days:{}}; x.days=x.days||{}; if(x.days[today]) return undefined;
      x.days[today]={}; Object.keys(by).forEach(o=>{ const v=by[o]; if(v) x.days[today][o]={n:v.n, amt:v.amt.map(a=>Math.round(a))}; });
      const keep=Object.keys(x.days).sort().slice(-60), y={}; keep.forEach(k=>{ y[k]=x.days[k]; }); x.days=y; return x; }); }catch(_){}
  }

  /* ---------------- drawing ---------------- */
  function tabs(){ el('tabs').innerHTML=TABS.map(t=>'<button role="tab" class="'+(TAB===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join(''); el('per').hidden=TAB==='late'; }
  const kpi=(k,v,s,d)=>'<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+(d?'<div class="d">'+d+'</div>':'')+'</div>';
  /* COMPARED WITH THE PERIOD BEFORE (21/11/2026, Cory: "if they are comparing a quarter or month there is a vs last month or
     vs last quarter ... good to show if ones increasing or decreasing" and "same with conversion for TC. Its always useful if
     you see a compared to"). PH_PERIOD.prev() picks the period before - and while this one is still going, the SAME number of
     days of it (Nov 1-21 vs Oct 1-21). A count shows its % change; a rate (conversion, paid in full)
     shows how far the rate itself moved, as a % (55% -> 75% = "↑ 20%"; Cory 21/11: "not pts percentages").
     Green = better, red = worse, grey = about the same; the tooltip shows both numbers. */
  let VS={short:'', long:''};
  const MS3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function vsOf(p){ const a=new Date(p.first+'T12:00:00'), b=new Date(p.last+'T12:00:00');
    const span=p.partial ? MS3[a.getMonth()]+' '+a.getDate()+' – '+(a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear() ? '' : MS3[b.getMonth()]+' ')+b.getDate()+', '+b.getFullYear()+' (the same days)' : p.label;
    return {short:p.short, long:span}; }
  function dlt(cur, was, o){ o=o||{}; if(cur==null || was==null || !isFinite(cur) || !isFinite(was)) return '';
    const u=o.unit||'%'; let d, txt;
    if(u==='%'){ if(!was) return ''; d=(cur-was)/was*100; txt=Math.round(Math.abs(d))+'%'; }
    else if(u==='rate'){ d=cur-was; txt=Math.round(Math.abs(d))+'%'; }
    else { d=cur-was; txt=r1(Math.abs(d))+' '+u; }
    const flat=Math.abs(d)<(u==='%' ? 3 : u==='rate' ? 1 : 0.5), good=o.down ? d<0 : d>0, cls=flat ? 'nt' : good ? 'gd' : 'bd';
    const f=o.fmt||(x=>Number(x).toLocaleString('en-US'));
    return '<span class="dl '+cls+'" data-tip="'+esc((o.name ? o.name+' · ' : '')+'compared with '+VS.long)+'" data-tip-b="'+esc('Now '+f(cur)+' · then '+f(was))+'" data-tip-c="'+(flat?'#94a3b8':good?'#2E9E6B':'#D7503A')+'">'+
      (flat ? (o.bare ? 'same' : '≈ same') : (d>0?'↑ ':'↓ ')+txt)+(o.bare ? '' : ' <small>'+esc(VS.short)+'</small>')+'</span>'; }
  const vsLine=()=>'<div class="vsline"><span><span class="dl gd">↑</span> <span class="dl bd">↓</span> compared with '+esc(VS.long)+'. Hover or tap one to see both numbers.</span></div>';
  const tone=(v,lo,hi)=>v==null ? '' : v>=hi ? 'good' : v<lo ? 'bad' : 'mid';
  const monthName=()=>period().label;

  async function tcHTML(offs, t, p){

  const BUCKETS=['1–30 days','31–60','61–90','91–180','180+ days'], HEAT=['#FBD9CF','#F5AE98','#EC7F63','#D7503A','#9E2E1C'];

  async function payHTML(offs, t, p){

      M.map(([k,lab,u,hb])=>{ const v=x[k], avg=P[k], d=(v==null||avg==null) ? 0 : v-avg, cls=Math.abs(d)<(u==='mo'?1.5:3) ? '' : ((d>0)===hb ? 'gd' : 'bd');
        return '<div class="m"><span>'+lab+'</span><span class="t"><i style="width:'+Math.min(100,(v||0)/top[k]*100)+'%"></i>'+(avg==null?'':'<u style="left:'+Math.min(100,avg/top[k]*100)+'%"></u>')+'</span><b class="'+cls+'">'+(v==null?'—':v+(u==='mo'?' mo':'%'))+'</b>'+
          (xw ? dlt(v, xw[k], {unit:u==='mo'?'mo':'rate', name:o+' · '+lab, down:!hb, bare:true, fmt:u==='mo' ? (z=>z+' months') : fp}).replace(/ mo</,'<') : '<span></span>')+'</div>'; }).join('')+
      '</div></div>'; });
    return h+'</div><div class="note">Extensions = payment plans that run past the end of treatment (they carry interest).</div>';
  }

  async function refHTML(offs, t, p){
    const [all, before]=await Promise.all([Promise.all(offs.map(o=>get.ref(o, t).then(r=>[o,r||{}]))), Promise.all(offs.map(o=>get.ref(o, p).then(r=>[o,r||{}])))]);
    const S={}; all.forEach(([o,r])=>Object.keys(r).forEach(s=>{ const x=S[s]=S[s]||{n:0,started:0,prod:0}; x.n+=r[s].n; x.started+=r[s].started; x.prod+=r[s].prod; }));
    const SW={}, OW={}; before.forEach(([o,r])=>{ OW[o]=Object.keys(r).reduce((a,s)=>a+r[s].n,0); Object.keys(r).forEach(s=>{ const x=SW[s]=SW[s]||{n:0,started:0}; x.n+=r[s].n; x.started+=r[s].started; }); });
    const totW=Object.keys(SW).reduce((a,s)=>a+SW[s].n,0), totStW=Object.keys(SW).reduce((a,s)=>a+SW[s].started,0);
    const list=Object.keys(S).sort((a,b)=>S[b].n-S[a].n), tot=list.reduce((a,s)=>a+S[s].n,0), totSt=list.reduce((a,s)=>a+S[s].started,0), max=Math.max(1,...list.map(s=>S[s].n));
    const IC={'My Dentist':'🦷','Friend / Family':'👨‍👩‍👧','Internet Search':'🔎','Social Media':'📱','Advertisement':'📣','Other':'✨'};
    let h='<div class="kpis">'+kpi('New-patient exams', tot.toLocaleString(), '', dlt(tot, totW, {name:'New-patient exams'}))+kpi('Started so far', totSt.toLocaleString(), fp(pct(totSt,tot))+' of them', dlt(totSt, totStW, {name:'Started'}))+
      (list[0] ? kpi('Biggest source', esc(list[0]), fp(pct(S[list[0]].n,tot))+' of exams') : '')+'</div>';
    h+='<div class="card"><h2>Where new patients came from · '+esc(monthName())+'</h2><div class="sub">What patients told the office brought them in (OrthoFi’s referral report). The dark part of each bar went on to start treatment.</div>'+vsLine()+
      list.map(s=>{ const x=S[s], c=pct(x.started,x.n);
        return '<div class="src"><div class="sn"><span class="ic">'+(IC[s]||'•')+'</span><span><b>'+esc(s)+'</b><small>'+x.n+' exams · '+x.started+' started</small><span class="dw">'+(SW[s] ? dlt(x.n, SW[s].n, {name:s+' exams'}) : '<span class="dl nt">new '+esc(VS.short.replace(/^vs /,'since '))+'</span>')+'</span></span></div>'+
          '<div class="hb" data-tip="'+esc(s)+'" data-tip-b="'+x.n+' exams · '+x.started+' started ('+fp(c)+')" data-tip-c="#149B96"><i style="width:'+(x.n/max*100)+'%"></i><i class="st" style="width:'+(x.started/max*100)+'%"></i></div>'+
          '<div class="sv"><span class="pill '+tone(c,30,45)+'">'+fp(c)+' start</span><small>'+money(x.prod)+'</small></div></div>'; }).join('')+
      (list.length ? '' : '<div class="state">No referral answers in OrthoFi for this month.</div>')+
      '<div class="note">A patient sent by another patient shows as Friend / Family — Home-Brace never reads who. This could sit on the Marketing page too.</div></div>';
    /* BY OFFICE (Cory 21/11: "We should be able to break down where they come from by office") - each office's mix */
    if(offs.length>1 && list.length){
      const SC={'My Dentist':'#149B96','Friend / Family':'#25456E','Internet Search':'#F2A03D','Social Media':'#8E6BD1','Advertisement':'#E07A9C','Other':'#AAB4C2'}, col=s=>SC[s]||'#CBD3DD';
      h+='<div class="card"><h2>Each office’s mix</h2><div class="sub">Share of each office’s new-patient exams by where they came from. Pick an office at the top to see its full detail.</div>'+
        '<div class="legend">'+list.map(s=>'<span><i style="background:'+col(s)+'"></i>'+esc(s)+'</span>').join('')+'</div>';
      all.map(([o,r])=>[o,r,Object.keys(r).reduce((a,s)=>a+r[s].n,0)]).sort((a,b)=>b[2]-a[2]).forEach(([o,r,n])=>{
        const st=Object.keys(r).reduce((a,s)=>a+r[s].started,0), lead=list.filter(s=>r[s] && r[s].n).sort((a,b)=>r[b].n-r[a].n)[0];
        h+='<div class="lrow"><div class="ln">'+offDot(o)+'<span><b>'+esc(o)+'</b><small>'+n+' exams · '+fp(pct(st,n))+' started</small>'+(OW[o] ? '<span class="dw">'+dlt(n, OW[o], {name:o+' exams'})+'</span>' : '')+'</span></div>'+
          '<div class="stack" style="width:100%">'+(n ? list.map(s=>r[s] && r[s].n ? seg(r[s].n, n, col(s), LIGHT_SRC.indexOf(s)>=0, s, r[s].n+' exams · '+fp(pct(r[s].n,n))+' of '+o+'’s · '+r[s].started+' started') : '').join('') : '')+'</div>'+
          '<div class="l90">'+(lead ? 'Most from <b>'+esc(lead)+'</b>' : '—')+'</div></div>'; });
      h+='</div>';
    }
    return h;
  }

  /* ---------------- the quick tooltip ---------------- */
  const TIP=document.createElement('div'); TIP.className='tip'; TIP.setAttribute('role','tooltip'); TIP.hidden=true; document.body.appendChild(TIP);
  let tipFor=null;
  function tipShow(t, x, y){
    if(tipFor!==t){ tipFor=t; TIP.innerHTML='<span class="tsw" style="background:'+esc(t.dataset.tipC||'var(--teal)')+'"></span><span><b>'+esc(t.dataset.tip)+'</b>'+(t.dataset.tipB ? '<span>'+esc(t.dataset.tipB)+'</span>' : '')+'</span>'; TIP.hidden=false; }
    const w=TIP.offsetWidth, h=TIP.offsetHeight; let l=x-w/2, top=y-h-14; if(top<8) top=y+18; l=Math.max(8, Math.min(window.innerWidth-w-8, l));
    TIP.style.left=l+'px'; TIP.style.top=top+'px';
  }
  function tipHide(){ tipFor=null; TIP.hidden=true; }
  document.addEventListener('mousemove', e=>{ const t=e.target.closest && e.target.closest('[data-tip]'); if(t) tipShow(t, e.clientX, e.clientY); else if(tipFor) tipHide(); }, {passive:true});
  document.addEventListener('touchstart', e=>{ const t=e.target.closest && e.target.closest('[data-tip]'), p=e.touches && e.touches[0]; if(t && p) tipShow(t, p.clientX, p.clientY); else tipHide(); }, {passive:true});
  window.addEventListener('scroll', tipHide, {passive:true, capture:true});

  /* ---------------- wiring ---------------- */
  function allowed(){ return !LIVE || (PH.isAdmin && PH.isAdmin(PH.realMe ? PH.realMe() : PH.me())); }
  document.addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b){ TAB=b.dataset.tab; try{ localStorage.setItem('ph_insights_tab', TAB); }catch(_){} render(); } });
  el('off').addEventListener('change', render);
  function boot(){ if(!allowed()){ el('wrap').innerHTML='<h1>OrthoFi insights</h1><p class="lede">This page is for Home-Brace admins.</p>'; return; } drawOff(); render(); }
  if(LIVE) el('ribbon').textContent='OrthoFi insights — real OrthoFi totals, admins only (preview).';
  if(!LIVE || window.PH_AUTH) boot(); else document.addEventListener('ph-signed-in', boot, {once:true});
  document.addEventListener('ph-identity', ()=>{ drawOff(); });
  window.INSIGHTS={render, _demo:{demoTC, demoLate, demoPay, demoRef}};
})();
</script>
<script>PH.nav('insights');PH.dechrome();document.addEventListener('ph-signed-in',function(){PH.mount();PH.dechrome();if(PH.reloadPeople)PH.reloadPeople();if(PH.reloadAccess)PH.reloadAccess();});</script>
