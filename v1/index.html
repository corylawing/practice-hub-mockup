<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Dashboard (V1) — Home-Brace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.png" type="image/png">
<meta name="theme-color" content="#0F2A4A">
<meta name="description" content="Home-Brace V1 — Production Dashboard: main & stretch goals, last-year comparison, and an all-office leaderboard.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Home-Brace">
<meta property="og:title" content="Production Dashboard (V1) · Home-Brace">
<meta property="og:description" content="Production vs main and stretch goals, last year, and a leaderboard across all offices.">
<meta property="og:image" content="https://corylawing.github.io/practice-hub-mockup/assets/og-image.png">
<meta property="og:url" content="https://corylawing.github.io/practice-hub-mockup/v1/index.html">
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber:#F2A03D; --amber-soft:#FFF3E2;
    --blue:#1f6f9e; --blue-soft:#E3F0FA; --ly:#b9c3d1;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.12); --radius:14px; --maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{color:var(--navy);margin:0}
  .ribbon{background:var(--amber);color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark{width:34px;height:34px;flex:none;display:block}
  .mark img{width:34px;height:34px;display:block;border-radius:9px}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:#9fb4d0}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:#cdd9ea;font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 20px 90px}
  /* viewing as */
  .viewas{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:18px;border-left:5px solid var(--teal)}
  .viewas .lab{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .viewas select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--navy);background:#fff;min-width:200px}
  .viewas .scope{font-size:12.5px;color:var(--teal-600);background:var(--teal-soft);border:1px solid #c4e6e3;padding:5px 11px;border-radius:999px;font-weight:600;margin-left:auto}
  .page-head h1{font-size:25px}
  .page-head p{margin:4px 0 0;color:var(--soft);font-size:14.5px}
  /* office tabs */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 20px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chip:hover{border-color:var(--teal);color:var(--teal-600)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip .br{font-size:10.5px;opacity:.65;margin-left:4px}
  /* kpi cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;border-top:4px solid var(--teal)}
  .kpi.g{border-top-color:var(--good)} .kpi.b{border-top-color:var(--bad)} .kpi.n{border-top-color:var(--blue)}
  .kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;margin-top:3px}
  .kpi .s{font-size:12.5px;color:var(--soft);margin-top:3px}
  .kpi .s b.g{color:var(--good)} .kpi .s b.b{color:var(--bad)}
  /* chart */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:18px}
  .card h2{margin:0 0 2px;font-size:16px;color:var(--navy)}
  .card .sub{font-size:12.5px;color:var(--soft);margin-bottom:14px}
  .legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-bottom:12px;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
  .swline{width:16px;height:0;border-top:2px dashed var(--navy);display:inline-block}
  .swdot{width:16px;height:0;border-top:2px dotted #8a5cf5;display:inline-block}
  .chartwrap{overflow-x:auto;padding-top:8px}
  .plot{position:relative;min-width:660px;padding:26px 0 0 46px}
  .grid{position:absolute;left:46px;right:0;top:26px;bottom:30px;pointer-events:none}
  .grid .gl{position:absolute;left:0;right:0;border-top:1px dashed #e7ebf0}
  .grid .gl b{position:absolute;left:-46px;top:-8px;width:40px;text-align:right;font-size:10px;font-weight:700;color:#9aa6b6}
  .grid .gl.base{border-top:1px solid #d7dde5}
  .chart{position:relative;display:flex;gap:12px;align-items:flex-end;height:210px;padding-bottom:30px}
  .mo{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
  .bars{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
  .bar{width:36%;border-radius:6px 6px 0 0;position:relative;transition:filter .15s,transform .15s;cursor:default}
  /* Overlay instead of filter:brightness() — consistent across Safari and the rest. */
  .bar:hover{box-shadow:inset 0 0 0 999px rgba(15,42,74,.075);transform:translateY(-2px)}
  .bval{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  .bar.lyb .bval{color:#8794a6}
  .bar.lyb{background:var(--ly)}
  .bar.ab{background:var(--teal)}
  .bar.ab.over{background:var(--good)} .bar.ab.under{background:var(--bad)} .bar.ab.mtd{background:var(--amber)}
  .gm{position:absolute;left:2%;right:2%;border-top:2px dashed var(--navy);pointer-events:none}
  .sm{position:absolute;left:2%;right:2%;border-top:2px dotted #8a5cf5;pointer-events:none}
  .molab{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--soft);font-weight:700;white-space:nowrap}
  .mo.best .molab{color:var(--good)}
  .tip{position:fixed;background:var(--navy);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50;white-space:nowrap;box-shadow:var(--shadow-lg)}
  /* leaderboard */
  .lb-scroll{overflow-x:auto}
  table.lb{width:100%;border-collapse:collapse;min-width:680px}
  table.lb th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  table.lb td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px}
  table.lb td.num.big{font-weight:800;color:var(--navy)}   /* the figure leads, the % supports it */
  table.lb tr:last-child td{border-bottom:none}
  table.lb tbody tr{cursor:pointer}
  table.lb tbody tr:hover td{background:#f2fbfa}
  .rk{font-weight:800;color:var(--soft);width:34px}
  .rk.top{color:#b8860b}
  .onm{font-weight:700;color:var(--navy)}
  .onm .br{font-size:10.5px;color:var(--soft);font-weight:600;margin-left:5px}
  .pbar{height:8px;background:var(--canvas);border-radius:99px;overflow:hidden;min-width:80px;margin-top:4px}
  .pbar i{display:block;height:100%;border-radius:99px;background:var(--good)}
  .pbar i.b{background:var(--bad)} .pbar i.a{background:var(--amber)}
  .num{font-weight:700} .num.g{color:var(--good)} .num.b{color:var(--bad)}
  .dleft{font-weight:700;color:var(--navy)}
  .periodbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
  .pchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .pchip:hover{border-color:var(--teal);color:var(--teal-600)}
  .pchip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* Month picker — one button, opens a grid, pick a month. The trigger is a FIXED width
     and the grid is an overlay, so nothing on the page shifts when you open it or change
     month (an earlier stepper made the row jump every time the label changed length). */
  .mpick{position:relative;display:inline-block}
  .mpick > .trg{display:inline-flex;align-items:center;gap:8px;width:150px;height:38px;
    border:1px solid var(--line);background:#fff;border-radius:999px;box-shadow:var(--shadow);
    padding:0 14px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--soft);cursor:pointer}
  .mpick > .trg:hover{border-color:var(--teal);color:var(--teal-600)}
  .mpick > .trg .cal{font-size:14px;line-height:1}
  .mpick > .trg .txt{flex:1;text-align:left;white-space:nowrap;overflow:hidden}
  .mpick > .trg .car{font-size:10px;opacity:.7}
  .mpick.on > .trg{background:var(--teal);border-color:var(--teal);color:#fff}
  .mpick.open > .trg{border-color:var(--teal)}
  .mgrid{position:absolute;top:44px;left:0;z-index:60;background:#fff;border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow-lg);padding:12px;width:262px;display:none}
  .mpick.open .mgrid{display:block}
  .mgrid .gh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    color:var(--soft);padding:0 2px 9px}
  .mgrid .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .mgrid .g button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 0;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
  .mgrid .g button:hover:not(:disabled){border-color:var(--teal);color:var(--teal-600);background:var(--teal-soft)}
  .mgrid .g button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .mgrid .g button:disabled{color:#c3ccd8;background:#fafbfc;border-color:#eef1f5;cursor:default}
  .mgrid .clr.comb{border:1px dashed var(--line);border-radius:9px;margin-top:10px}
  .mgrid .clr.comb.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .mgrid .g button .tick{font-weight:800}
  .mgrid .g button.now{border-color:var(--teal);color:var(--teal-600)}
  .mgrid .g button .nowdot{display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--teal);margin-left:5px;vertical-align:middle}
  .mgrid .g button.on .nowdot{background:#fff}
  .mgrid .clr{width:100%;margin-top:9px;border:none;background:none;font-family:inherit;font-size:12.5px;
    font-weight:700;color:var(--teal-600);cursor:pointer;padding:7px}
  .mgrid .clr:hover{text-decoration:underline}
  /* On a phone a left-anchored 262px panel hangs off the screen edge, so centre it
     instead — a familiar picker sheet. Outside-tap and Esc still close it. */
  @media(max-width:520px){
    .mgrid{position:fixed;left:14px;right:14px;top:50%;transform:translateY(-50%);
      width:auto;padding:16px;box-shadow:0 20px 60px rgba(15,42,74,.4)}
    .mgrid .g button{padding:13px 0;font-size:14px}
    .mgrid .clr{padding:11px}
  }
  .chip .tick{font-weight:800;color:var(--teal-600)}
  .chip.on .tick{color:#fff}
  .chip.combtog{border-style:dashed;font-weight:700}
  .chip.combtog.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pchip.mini{padding:8px 14px;font-size:12.5px;box-shadow:none;min-height:36px}
  .phint{font-size:12.5px;color:var(--soft)}
  .ypick{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:999px;box-shadow:var(--shadow);padding:0 6px 0 13px;height:38px}
  .ypick label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
  .ypick select{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:700;
    color:var(--navy);height:36px;padding-right:4px;cursor:pointer}
  .gauge.flat{border-top-color:var(--soft)}
  .gauge.pend{border-top-color:var(--amber)}
  .g-pct.pend{color:var(--soft)}
  .g-verdict.pend{color:#7a4d0a}
  .g-nogoal{font-size:12px;font-weight:700;color:var(--soft);background:var(--canvas);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .g-verdict.flatv{color:var(--soft);font-weight:600}
  .charttog{display:flex;gap:6px;margin-bottom:12px}
  /* the at-a-glance gauges — this is the bit people read first */
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  .gauge{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 16px;position:relative;overflow:hidden}
  .gauge::before{content:'';position:absolute;inset:0 0 auto 0;height:5px}
  .gauge.ok::before{background:var(--good)} .gauge.near::before{background:var(--amber)} .gauge.low::before{background:var(--bad)}
  .g-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .g-ttl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
  .g-big{font-size:40px;font-weight:800;color:var(--navy);line-height:1;margin:6px 0 2px}
  .g-pct{font-size:23px;font-weight:800;margin-left:auto}
  .g-pct.ok{color:var(--good)} .g-pct.near{color:var(--amber)} .g-pct.low{color:var(--bad)}
  .g-sub{font-size:13px;color:var(--soft);margin-bottom:14px}
  .track{position:relative;height:26px;background:#eef1f5;border-radius:999px;overflow:visible;margin:34px 0 9px}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .fill.ok{background:linear-gradient(90deg,#3fbf7f,var(--good))}
  .fill.near{background:linear-gradient(90deg,#f7bd6b,var(--amber))}
  .fill.low{background:linear-gradient(90deg,#e8836e,var(--bad))}
  .mk{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px}
  .mk.main{background:var(--navy)} .mk.str{background:#8a5cf5}
  .mklab{position:absolute;top:-20px;transform:translateX(-50%);font-size:10px;font-weight:800;
    letter-spacing:.05em;white-space:nowrap;pointer-events:none}
  .mklab.hi{top:-36px}
  .mklab.main{color:var(--navy)} .mklab.str{color:#8a5cf5}
  .mklab::after{content:'';position:absolute;left:50%;top:13px;width:1px;height:7px;background:currentColor;opacity:.45}
  .mklab.hi::after{height:23px}
  .overflag{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
  .g-foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin-top:14px}
  .g-foot b{color:var(--navy)}
  .g-verdict{font-size:14.5px;font-weight:700;margin-top:4px}
  .g-verdict.ok{color:var(--good)} .g-verdict.near{color:var(--amber)} .g-verdict.low{color:var(--bad)}
  /* celebration */
  .party{background:linear-gradient(100deg,#0F827E,#149B96 55%,#2BC0B8);color:#fff;border-radius:16px;
    padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow-lg)}
  .party .em{font-size:30px;line-height:1}
  .party b{font-size:17px;display:block}
  .party span{font-size:13.5px;opacity:.92}
  .party button{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
  .party button:hover{background:rgba(255,255,255,.3)}
  @media(max-width:760px){ .gauges{grid-template-columns:1fr} .g-big{font-size:33px} }
  .daycard{padding:16px 20px}
  .dayrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .dayn{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  .dayn b{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
  .dayn span{font-size:13px;color:var(--soft)}
  .daybar{flex:1;min-width:160px;height:16px;background:#eef1f5;border-radius:999px;overflow:hidden}
  .daybar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .daypct{font-size:19px;font-weight:800;color:var(--teal-600)}
  .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
  .pips i{width:13px;height:13px;border-radius:4px;background:#e3e8ef;display:block}
  .pips i.on{background:var(--teal)}
  .daysub{font-size:13px;color:var(--soft);margin-top:10px}
  .secttl{font-size:19px;color:var(--navy);margin:26px 0 2px}
  .secttl:first-of-type{margin-top:8px}
  .secsub{font-size:13.5px;color:var(--soft);margin:0 0 14px}
  .noacc{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--soft)}
  .noacc b{color:var(--navy)}
  .foot{font-size:12px;color:var(--soft);margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;line-height:1.55}
  .foot b{color:var(--navy)}
  @media(max-width:620px){ .kpi .v{font-size:22px} }
</style>

<script src="celebrate.js?v=hb50"></script>

<body>
<div class="ribbon">PROTOTYPE — real numbers from the 2026 Production Dashboard workbook. You only see the offices you have access to.</div>
<header class="hdr">
  <div class="hdr-in">
    <span class="mark" aria-label="Home-Brace"><img src="../assets/logo-mark.png" alt="" width="34" height="34"></span>
    <span class="brand">Home-<i>Brace</i><small>Production Dashboard</small></span>
    <span class="v1">V1 preview</span>
  </div>
</header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>

<div class="wrap">
  <div class="viewas">
    <span class="lab">👤 Viewing as</span>
    <select id="persona" onchange="DASH.set(this.value)"></select>
    <span class="scope" id="scope"></span>
  </div>
  <div class="page-head">
    <h1>Production Dashboard</h1>
    <p id="sub">Where production stands against the main goal and the stretch goal.</p>
  </div>
  <div id="chips" class="chips"></div>
  <div id="view"></div>
</div>
<div class="tip" id="tip"></div>

<script>
/* Identity only. Every figure is read from the practice's live workbook at run time by
   workbook.js -- see hydrate() below. Deliberately NO real numbers in this file: it is
   served from a public URL, and a sign-in gate hides the page, not the file. */

(function applyEdits(){

    const p=k.split('|'), o=OFFICES.find(x=>x.n===p[0]), m=+p[1], v=e[k];

    // others. Say which one it is, every time.

    // part-month must never read as "goal hit".
    const goalLab = (period==='mtd'||isMonth()) ? 'Monthly goal' : 'Goal';
    // With no days logged we can't say whether they're behind — comparing a part month to a
    // whole month's goal produced a red 9% and "$205,505 behind goal" that simply wasn't true.
    const pending = inProgress(o) && c0>=0 && !o.done[c0];
    const sVerdict = o.noGoals
      ? (o.hasStarts===false ? 'Starts aren\u2019t on file for '+year
         : 'Worked out from '+year+'\u2019s production and average case fee.')
      : pending ? '\u23f3 Enter days worked to see whether this is on pace.'
      : paced ? ((st.vpace>=0?'\u2705 ':'\u26a0\ufe0f ')+Math.abs(Math.round(st.vpace))+
                 ' starts '+(st.vpace>=0?'ahead of':'behind')+' pace')
      : (st.v>=0 ? '\u2705 '+Math.abs(Math.round(st.v))+' starts over goal'
                 : '\u26a0\ufe0f '+Math.abs(Math.round(st.v))+' starts to go');
    const pVerdict = o.noGoals
      ? year+' actuals from the workbook \u2014 no goals were recorded for that year.'
      : pending ? '\u23f3 Enter days worked to see whether this is on pace.'
      : paced ? ((t.vpace>=0?'\u2705 ':'\u26a0\ufe0f ')+full(Math.abs(t.vpace))+
                 (t.vpace>=0?' ahead of':' behind')+' pace for '+o.done[c0]+' of '+o.days[c0]+' days')
      : (t.vgoal>=0 ? '\u2705 '+full(Math.abs(t.vgoal))+' over goal'
                    : '\u26a0\ufe0f '+full(Math.abs(t.vgoal))+' to go');
    const dayNote = inProgress(o) ? (()=>{const c=partial(o);
      return o.done[c] ? ' \u00b7 '+o.done[c]+' of '+o.days[c]+' days'
                       : ' \u00b7 days not logged yet';})() : '';

    // Production LEFT, Starts RIGHT — production is the number they lead with.
    // No stretch on starts: their workbook has no starts stretch goal, and the derived one
    // was dropped on request (2026-08-17). Stretch stays on production only.
    return '<div class="gauges">'+
      gauge({icon:'\ud83d\udcb0',title:'Production',big:money(t.a),noGoal:!!o.noGoals,
        sub:(period==='mtd'?monthName(o)+' so far'+dayNote:(isMonth()?MOFULL[period]:'Year so far'))+' \u00b7 vs last year '+pc(t.yoy),
        pct:t.pct,stretchPct:(t.g?t.s/t.g:0),verdict:pVerdict,
        pending:pending,
        footer:'<span>'+goalLab+' <b>'+money(t.g)+'</b></span><span>Stretch <b>'+money(t.s)+'</b> ('+pc(t.spct)+' there)</span>'+
                 '<span>Per day <b>'+money(t.perDay)+'</b> vs <b>'+money(t.needPerDay)+'</b> needed</span>'+
                 (paced?'<span style="color:var(--teal-600)">'+o.done[c0]+' of '+o.days[c0]+
                        ' days done \u2014 pace target '+money(t.gPace)+'</span>'
                   :(pending?'<span style="color:var(--amber)">no days logged yet \u2014 shown against the whole month</span>':''))})+
      gauge({icon:'\ud83e\uddb7',title:'Starts',
        big:(o.noGoals&&o.hasStarts===false)?'\u2014':Math.round(st.a)+' starts',noGoal:!!o.noGoals,
        sub:(period==='mtd'?monthName(o)+' so far'+dayNote:(isMonth()?MOFULL[period]:'Year so far'))+' \u00b7 '+st.perDay.toFixed(1)+' a day',
        pct:st.pct,verdict:sVerdict,
        pending:pending,
        footer:'<span>'+goalLab+' <b>'+Math.round(st.g)+'</b></span>'+
          '<span>Per day <b>'+st.perDay.toFixed(1)+'</b> vs <b>'+st.needPerDay.toFixed(1)+'</b> needed</span>'+
          '<span>'+st.days+' days worked</span>'})+
    '</div>';
  }

  /* ---------- celebrations ---------- */
  const partied=new Set();
  function goalState(o){ const t=stats(o); return {main:t.pct>=1, stretch:t.s>0&&t.a>=t.s, t}; }
  function partyBanner(o,who){
    const g=goalState(o); if(!g.main&&!g.stretch) return '';
    const msg = g.main&&g.stretch ? 'smashed the main goal AND the stretch goal!'
              : g.main ? 'hit the main goal!' : 'reached the stretch goal!';
    const em = g.main&&g.stretch ? '\ud83c\udf86\ud83c\udf89' : g.main ? '\ud83c\udf86' : '\ud83c\udf89';
    const when = period==='mtd' ? ' this month' : (isMonth()? ' in '+MOFULL[period] : ' this year');
    return '<div class="party"><span class="em">'+em+'</span><div><b>'+who+' '+msg+'</b>'+
      '<span>'+pc(g.t.pct)+' of goal \u00b7 '+full(g.t.a)+' produced'+when+'</span></div>'+
      '<button onclick="DASH.party()">Celebrate again \ud83c\udf8a</button></div>';
  }
  function maybeParty(o,key){
    const g=goalState(o); if(!g.main&&!g.stretch) return;
    if(partied.has(key)) return; partied.add(key);
    setTimeout(()=>{ if(window.Celebrate) Celebrate.fire({fireworks:g.main,confetti:g.stretch}); },420);
  }
  function partyNow(){
    const o=curOffice(); if(!o||!window.Celebrate) return;
    const g=goalState(o); Celebrate.fire({fireworks:g.main||!g.stretch,confetti:g.stretch});
  }

  function periodBar(o){
    // The "This month" pill must always name the CURRENT month. monthName() returns the
    // selected one, so looking back at July used to relabel the pill "This month · Jul".
    const ci=curIdx(o); const nm = ci>=0 ? MO[ci] : '';
    const b=(v,lab)=>'<button class="pchip'+(period===v?' on':'')+'" onclick="DASH.period(\''+v+'\')">'+lab+'</button>';
    const done=live(o), cur=partial(o);
    const avail=done.filter(i=>i!==cur);                 // finished months you can look back at
    const picked=pickedMonths();
    // ONE month control. It defaults to this month, so there's no separate "This month"
    // button — the current month sits in the grid marked "now", finished months are
    // pickable, and Combine ticks several together.
    const cells=MOFULL.map((m,i)=>{
      const isNow = i===cur;
      const ok = avail.indexOf(i)>=0 || isNow;
      const on = isNow ? (period==='mtd' || picked.indexOf(i)>=0) : picked.indexOf(i)>=0;
      return '<button'+(ok?'':' disabled')+(on?' class="on"':(isNow?' class="now"':''))+
        (ok?' onclick="DASH.month('+i+')"':'')+' title="'+m+(isNow?' (this month so far)':'')+'">'+
        (combineM&&ok?'<span class="tick">'+(on?'✓':'+')+'</span> ':'')+MO[i]+
        (isNow?'<i class="nowdot" title="this month"></i>':'')+'</button>';
    }).join('');
    const mlabel = period==='mtd' ? 'This month · '+(nm||MO[cur]||'')
      : picked.length===0 ? 'Pick a month'
      : picked.length===1 ? MOFULL[picked[0]] : picked.length+' months';
    const back='<div class="mpick on'+(pickOpen?' open':'')+'">'+
      '<button class="trg" onclick="DASH.pickOpen()" aria-haspopup="true" aria-expanded="'+(pickOpen?'true':'false')+'">'+
        '<span class="cal">📅</span><span class="txt">'+mlabel+'</span><span class="car">▼</span></button>'+
      '<div class="mgrid" onclick="event.stopPropagation()">'+
        '<div class="gh">'+(combineM?'Tick the months to add together':'Pick a month — ● is this month so far')+'</div>'+
        '<div class="g">'+cells+'</div>'+
        '<button class="clr comb'+(combineM?' on':'')+'" onclick="DASH.combineMonths()">'+
          (combineM?'✕ Stop combining months':'➕ Combine months')+'</button>'+
      '</div></div>';
    const hint = year!==LIVE_YEAR
      ? year+' as recorded in the workbook \u2014 production'+(o.hasStarts!==false?', starts':'')+
        (o.hasDays?' and production days':'')+'. No goals were kept for that year.'
      : isMonths() ? picked.map(i=>MOFULL[i]).join(' + ')+' added together.'
      : isMonth() ? MOFULL[period]+' — a finished month, judged against its full goal.'
      : period==='mtd' ? 'Showing '+(nm||'the latest month')+' only — goals scaled to the days worked so far.'
      : 'Every month so far this year, through today — ' + (nm?nm+' is counted up to the days worked.':'live.');
    // Keep the month suffix ALWAYS — it used to appear only while MTD was selected, which
    // changed the pill's width and shoved the month picker sideways on every switch.
    const ys=allYears();
    const ysel = ys.length<2 ? '' :
      '<div class="ypick"><label for="yearsel">Year</label><select id="yearsel" onchange="DASH.year(this.value)">'+
        ys.map(y=>'<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+(y===LIVE_YEAR?'':' \u00b7 actuals only')+'</option>').join('')+
      '</select></div>';
    // A past year is closed out — This month / month picker make no sense there.
    const cur2 = year===LIVE_YEAR ? back+b('ytd','Year to date') : b('ytd','Whole of '+year);
    return '<div class="periodbar">'+ysel+cur2+
      '<span class="phint">'+hint+'</span></div>';
  }
  function daysTiles(o){
    const t=stats(o), pct=t.sched?t.done/t.sched:0;
    const pips=t.sched<=31 ? '<div class="pips">'+Array.from({length:t.sched},(_,i)=>
        '<i class="'+(i<t.done?'on':'')+'"></i>').join('')+'</div>' : '';
    return '<div class="card daycard"><div class="dayrow">'+
        '<div class="dayn"><b>'+t.done+'</b><span>of '+t.sched+' days worked</span></div>'+
        '<div class="daybar"><div style="width:'+Math.min(100,pct*100)+'%"></div></div>'+
        '<div class="daypct">'+pc(pct)+'</div>'+
      '</div>'+pips+
    '</div>';
  }
  // Months to plot: finished ones plus the month in progress, so the chart doesn't stop
  // a month behind the rest of the dashboard.
  function plotMonths(o){
    const L=live(o), p=partial(o);
    return (p>=0 && o.act[p]>0 && L.indexOf(p)<0) ? L.concat([p]) : L;
  }
  function startsChart(o){
    const L=plotMonths(o); if(!L.length) return '';
    const sa=o.sAct||[], sg=o.sGoal||[], sl=o.lyStarts||[];
    // No stretch on starts anywhere (dropped 2026-08-17) — their workbook has no starts
    // stretch row and the derived one was more confusing than useful.
    let max=0; L.forEach(i=>{max=Math.max(max,sa[i]||0,sg[i]||0,sl[i]||0);});
    max=niceMax(max);
    const best=o.noGoals ? L.reduce((b,i)=>((sa[i]||0)>(sa[b]||0)?i:b),L[0])
      : L.reduce((b,i)=>((sg[i]?sa[i]/sg[i]:0)>(sg[b]?sa[b]/sg[b]:0)?i:b),L[0]);
    const cols=L.map(i=>{
      const a=sa[i]||0, g=sg[i]||0, l=sl[i]||0, h=v=>Math.max(1.5,(v/max)*100);
      return '<div class="mo'+(i===best?' best':'')+'"><div class="bars">'+
        '<div class="gm" style="bottom:'+h(g)+'%"></div>'+
        '<div class="bar lyb" style="height:'+h(l)+'%" data-t="'+MO[i]+' last year: about '+Math.round(l)+' starts"></div>'+
        '<div class="bar ab '+(a>=g?'over':'under')+'" style="height:'+h(a)+'%" data-t="'+MO[i]+' 2026: '+Math.round(a)+' starts \u00b7 goal '+Math.round(g)+'">'+
          '<span class="bval">'+Math.round(a)+'</span></div>'+
        '</div><div class="molab">'+MO[i]+(i===best?' \u2605':'')+'</div></div>';
    }).join('');
    return '<div class="card" id="bottomchart"><h2>Starts month by month</h2>'+
      '<div class="sub">Last year beside this year. <b>Dashed</b> = starts goal. \u2605 marks the best month.</div>'+
      chartToggle()+
      '<div class="legend"><span><i class="sw" style="background:var(--ly)"></i> Last year (2025)</span>'+
        '<span><i class="sw" style="background:var(--good)"></i> 2026 at/above goal</span>'+
        '<span><i class="sw" style="background:var(--bad)"></i> 2026 under goal</span>'+
        '<span><i class="swline"></i> Starts goal</span>'+
        '<span style="margin-left:auto;font-style:italic">last year\u2019s starts are worked out from the production figures</span></div>'+
      '<div class="chartwrap"><div class="plot">'+axis(max,false)+'<div class="chart">'+cols+'</div></div></div></div>';
  }
  function chart(o){
    const L=plotMonths(o); if(!L.length) return '';
    let max=0; L.forEach(i=>{max=Math.max(max,o.act[i],o.goal[i],o.stretch[i],o.ly[i]);});
    max=niceMax(max);
    const best=o.noGoals ? L.reduce((b,i)=>(o.act[i]>o.act[b]?i:b),L[0])
      : L.reduce((b,i)=>((o.goal[i]?o.act[i]/o.goal[i]:0)>(o.goal[b]?o.act[b]/o.goal[b]:0)?i:b),L[0]);
    const cols=L.map(i=>{
      const inProg=o.done[i]>0&&o.done[i]<o.days[i];
      const cls=inProg?'mtd':(o.act[i]>=o.goal[i]?'over':'under');
      const h=v=>Math.max(1.5,(v/max)*100);
      return '<div class="mo'+(i===best?' best':'')+'"><div class="bars">'+
        '<div class="gm" style="bottom:'+h(o.goal[i])+'%"></div>'+
        '<div class="sm" style="bottom:'+h(o.stretch[i])+'%"></div>'+
        '<div class="bar lyb" style="height:'+h(o.ly[i])+'%" data-t="'+MO[i]+' last year: '+full(o.ly[i])+'"></div>'+
        '<div class="bar ab '+cls+'" style="height:'+h(o.act[i])+'%" data-t="'+MO[i]+' 2026: '+full(o.act[i])+' \u00b7 main goal '+full(o.goal[i])+' \u00b7 stretch '+full(o.stretch[i])+'">'+
          '<span class="bval">'+money(o.act[i])+'</span></div>'+
        '</div><div class="molab">'+MO[i]+(i===best?' \u2605':'')+'</div></div>';
    }).join('');
    return '<div class="card" id="bottomchart"><h2>Month by month</h2>'+
      '<div class="sub">Last year beside this year. <b>Dashed</b> = main goal, <b>dotted</b> = stretch. Hover any bar for exact figures. \u2605 = best month.</div>'+
      chartToggle()+
      '<div class="legend"><span><i class="sw" style="background:var(--ly)"></i> Last year (2025)</span>'+
        '<span><i class="sw" style="background:var(--good)"></i> 2026 at/above goal</span>'+
        '<span><i class="sw" style="background:var(--bad)"></i> 2026 under goal</span>'+
        '<span><i class="swline"></i> Main goal</span><span><i class="swdot"></i> Stretch goal</span></div>'+
      '<div class="chartwrap"><div class="plot">'+axis(max,true)+'<div class="chart">'+cols+'</div></div></div></div>';
  }
  function axis(max,money$){
    const steps=4, lines=[];
    for(let i=steps;i>=0;i--){
      const v=max*(i/steps), pct=(i/steps)*100;
      lines.push('<div class="gl'+(i===0?' base':'')+'" style="bottom:'+pct+'%"><b>'+(money$?money(v):Math.round(v))+'</b></div>');
    }
    return '<div class="grid">'+lines.join('')+'</div>';
  }
  function chartToggle(){
    const b=(v,lab)=>'<button class="pchip mini'+(chartMode===v?' on':'')+'" onclick="DASH.chart(\''+v+'\')">'+lab+'</button>';
    return '<div class="charttog">'+b('production','\ud83d\udcb0 Production')+b('starts','\ud83e\uddb7 Starts')+'</div>';
  }
  function leaderboard(list){
    // Production leads and ranks the table — it's the number they run the business on.
    const rows=list.map(src=>{const o=yearOf(src); return {o,t:stats(o),s:sStats(o)};})
      .sort((x,y)=> x.o.noGoals ? y.t.a-x.t.a : y.t.pct-x.t.pct);   // no goals => rank by production
    const body=rows.map((r,i)=>{
      const t=r.t, pctw=Math.min(100,t.pct*100), cls=t.pct>=1?'':(t.pct>=.9?'a':'b');
      return '<tr onclick="DASH.pick(\''+r.o.n+'\')">'+
        '<td class="rk'+(i===0?' top':'')+'">'+(i===0?'🏆':i+1)+'</td>'+
        '<td><div class="onm">'+r.o.n+'<span class="br">'+r.o.brand+'</span></div>'+
          '<div class="pbar"><i class="'+cls+'" style="width:'+pctw+'%"></i></div></td>'+
        '<td class="num big">'+full(t.a)+'</td>'+
        '<td class="num">'+(r.o.noGoals?'\u2014':pc(t.pct))+'</td>'+
        '<td class="num '+(t.yoy>=1?'g':'b')+'">'+(t.l?pc(t.yoy):'\u2014')+'</td>'+
        '<td class="num big">'+Math.round(r.s.a)+'</td>'+
        '<td class="num">'+(r.o.noGoals||!r.s.g?'\u2014':pc(r.s.pct))+'</td>'+
        '<td class="dleft">'+(t.daysLeft||'\u2014')+'</td></tr>';
    }).join('');
    return '<div class="card"><h2>Leaderboard</h2>'+
      '<div class="sub">Ranked by <b>% of production goal</b> \u2014 top of the table is the leader. '+
        '\u201cDays left\u201d = production days scheduled minus days worked, for whatever period is selected above.</div>'+
      '<div class="lb-scroll"><table class="lb"><thead><tr><th></th><th>Office</th>'+
        '<th>Production</th><th>% of goal</th><th>vs last yr</th>'+
        '<th>Starts</th><th>% of goal</th><th>Days left</th></tr></thead>'+
      '<tbody>'+body+'</tbody></table></div></div>';
  }
  function render(){

    if(!allowed.length){
      el('chips').innerHTML=''; el('scope').textContent='No dashboard access';
      el('view').innerHTML='<div class="noacc"><b>This role doesn\'t have the Production Dashboard.</b><br>An admin grants access per team in <b>Admin → Teams &amp; Access</b>.</div>';
      el('sub').textContent='Access is set by team; the offices you see are set by your location.';
      return;
    }
    const multi=allowed.length>1;
    el('scope').textContent = cur.offices==='all' ? 'All 8 offices' : (allowed.length+' office'+(allowed.length>1?'s':'')+': '+allowed.map(o=>o.n).join(', '));
    el('sub').textContent = multi ? 'Where production stands against the main goal and the stretch goal.'
                                  : 'Your office\'s production against the main goal and the stretch goal.';
    if(!multi) sel=allowed[0].n;
    else if(sel!=='ALL' && !allowed.some(o=>o.n===sel)) sel='ALL';
    el('chips').innerHTML = multi
      ? ('<button class="chip'+((sel==='ALL'&&!combine)?' on':'')+'" onclick="DASH.pick(\'ALL\')">All Offices</button>'+
         allowed.map(o=>{ const on = combine ? combined.has(o.n) : (sel!=='ALL' && sel===o.n);
           return '<button class="chip'+(on?' on':'')+'" onclick="DASH.pick(\''+o.n+'\')">'+
             (combine?'<span class="tick">'+(on?'\u2713':'+')+'</span> ':'')+o.n+'<span class="br">'+o.brand+'</span></button>';}).join('')+
         '<button class="chip combtog'+(combine?' on':'')+'" onclick="DASH.combine()" title="Add offices together and see one set of numbers">'+
           (combine?'\u2715 Stop combining':'\u2795 Combine offices')+'</button>')
      : '';
    const isAll = multi && sel==='ALL' && !combine;
    const picked = combine ? allowed.filter(x=>combined.has(x.n)) : [];
    const isCombo = combine && picked.length>0;
    if(combine && !picked.length){
      el('view').innerHTML='<div class="noacc"><b>Pick the offices you want to add together.</b><br>'+
        'Tap them above \u2014 the numbers below will combine as you go.</div>';
      return;
    }
    // Swap in the selected year before anything is computed.
    const src = isAll ? allowed : isCombo ? picked : [allowed.find(x=>x.n===sel)];
    const scoped = src.map(yearOf);
    const o = (isAll||isCombo) ? group(scoped) : scoped[0];
    if(isCombo) o.n = picked.length+' offices combined';
    shown=o;
    const who = isAll ? 'The group' : isCombo ? picked.map(x=>x.n).join(' + ') : o.n;
    const noFigures = o.noGoals && !o.act.some(v=>v>0);
    let html = partyBanner(o,who) + periodBar(o) +
      (noFigures
        ? '<div class="noacc" style="margin-top:14px"><b>No '+year+' figures for '+who+'.</b><br>'+
          'The workbook doesn\u2019t have that year for this office \u2014 pick another year above.</div>'
        : gauges(o)) +
      (o.days.some(d=>d>0)
        ? '<h2 class="secttl">\ud83d\udcc6 Production days</h2><p class="secsub">How much of the '+(period==='mtd'?'month':'year')+' has actually been worked.</p>'+daysTiles(o)
        : '') +
      (noFigures ? '' : (chartMode==='starts'? startsChart(o) : chart(o)));
    if(isAll && !noFigures) html += leaderboard(allowed);
    html += '<div class="foot"><b>Where these numbers come from:</b> the practice\u2019s 2026 Production '+
      'Dashboard workbook on SharePoint \u2014 the hub reads it live, so there is no second copy to keep in '+
      'sync. A month counts once it has <b>both</b> an actual and a goal (Mansfield has production from '+
      'January but goals from April), and the month in progress is kept separate from the year figure.<br><br>'+
      '<b>One to check in the workbook:</b> on the \u201cDashboard\u201d tab, January to June add up exactly '+
      'to the eight office tabs, but <b>July is $16,273 low</b> and <b>August is $26,638 high</b> \u2014 most '+
      'likely a total that hasn\u2019t been stretched across the two Cruces columns yet. The hub always adds '+
      'every office.</div>';
    el('view').innerHTML = html;
    wireTips();
    maybeParty(o,(isAll?'ALL':sel)+'|'+period);
  }
  function wireTips(){
    const tip=el('tip');
    document.querySelectorAll('.bar[data-t]').forEach(b=>{
      b.onmousemove=e=>{tip.textContent=b.dataset.t;tip.style.opacity='1';
        tip.style.left=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-10)+'px';tip.style.top=(e.clientY-34)+'px';};
      b.onmouseleave=()=>{tip.style.opacity='0';};
    });
  }
  function pick(n){
    if(combine && n!=='ALL'){ combined.has(n)?combined.delete(n):combined.add(n); render(); return; }
    if(n==='ALL'){ combine=false; combined.clear(); }
    sel=n; render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function toggleCombine(){
    combine=!combine;
    if(combine){ combined.clear(); if(sel!=='ALL') combined.add(sel); }
    render();
  }
  function set(id){
    cur=PERSONAS.find(p=>p.id===id)||PERSONAS[0];
    try{ localStorage.setItem('ph_viewas',cur.id); }catch(_){}
    el('persona').value=cur.id;
    allowed = cur.offices==='all' ? OFFICES.slice() : OFFICES.filter(o=>cur.offices.indexOf(o.n)>=0);
    sel = allowed.length>1 ? 'ALL' : (allowed[0]?allowed[0].n:'ALL');
    render();
  }
  el('persona').innerHTML=PERSONAS.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('');
  window.DASH={set,pick,party:partyNow,combine:toggleCombine,
    period:v=>{period=v;pickOpen=false;combineM=false;render();},
    year:v=>{ year=Number(v); period='ytd'; pickOpen=false; combineM=false; render(); },
    month:v=>{ if(v===''||v==null)return; const i=Number(v);
      if(combineM){
        // 'mtd' means the current month — carry it into the set instead of losing it.
        const now=partial(shown||OFFICES[0]);
        const cur = isMonths() ? period.slice()
                  : isMonth() ? [period]
                  : (period==='mtd' && now>=0) ? [now] : [];
        const k=cur.indexOf(i); if(k>=0)cur.splice(k,1); else cur.push(i);
        period = cur.length? cur : 'mtd';               // untick the last one and you're back to this month
        render(); return;                               // keep the popover open while ticking
      }
      // The current month in the grid IS "this month" — pro-rated to the days worked.
      period = (i===partial(shown||OFFICES[0])) ? 'mtd' : i;
      pickOpen=false; render(); },
    combineMonths:()=>{
      combineM=!combineM;
      if(combineM){
        const now=partial(shown||OFFICES[0]);
        if(isMonth()) period=[period];
        else if(period==='mtd' && now>=0) period=[now];   // start from this month
      }
      else if(isMonths()){
        const now=partial(shown||OFFICES[0]);
        const last=period.length? period[period.length-1] : null;
        period = (last===null) ? 'mtd' : (last===now ? 'mtd' : last);
      }
      render();
    },
    pickOpen:()=>{ pickOpen=!pickOpen; render(); },
    chart:v=>{chartMode=v;render();}};
  document.addEventListener('click',e=>{
    if(pickOpen && !e.target.closest('.mpick')){ pickOpen=false; render(); }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&pickOpen){ pickOpen=false; render(); } });
  let saved='admin'; try{ saved=localStorage.getItem('ph_viewas')||'admin'; }catch(_){}
  if(!PERSONAS.some(p=>p.id===saved)) saved='admin';

  /* The practice's live workbook, by its permanent address. These IDs identify the file but
     grant nothing on their own -- reading it still requires a signed-in person who already
     has access to it. */
  const WB_DRIVE='b!_iYahf-6ukmoAAj5kJvRerfxyG2Vel1DjXWUHR3Q-rM_xdgQyKrjQJEx8aAKAvQ-';
  const WB_ITEM ='0153I7MX4WXYRN4DKUJFEZPTWOZ4GBQMIV';

  function banner(html, bad){
    let n=document.getElementById('wbstate');
    if(!n){ n=document.createElement('div'); n.id='wbstate';
      n.style.cssText='max-width:var(--maxw);margin:0 auto 14px;padding:9px 14px;border-radius:10px;'+
        'font-size:12.5px;font-weight:600;border:1px solid;display:flex;align-items:center;gap:8px';
      document.querySelector('.wrap').prepend(n); }
    n.style.background = bad ? '#FCEBE8' : '#E5F4F3';
    n.style.color      = bad ? '#93301f' : '#0F827E';
    n.style.borderColor= bad ? '#f0c3b9' : '#bfe3d0';
    n.innerHTML=html;
  }

  async function hydrate(){
    if(typeof PH_WB==='undefined' || !window.PH_AUTH){
      banner('<b>Not signed in.</b> The dashboard shows live figures from the practice\'s workbook '+
             'and needs a Microsoft sign-in to read it.', true);
      return false;
    }
    banner('Reading the live workbook…');
    let res;
    try{ res = await PH_WB.load(PH_AUTH.graph, WB_DRIVE, WB_ITEM); }
    catch(e){ banner('<b>Could not read the workbook.</b> '+(e&&e.message||e), true); return false; }
    let filled=0;
    OFFICES.forEach(o=>{
      const live=res.offices[o.n];
      if(!live) return;
      Object.keys(live).forEach(k=>{ o[k]=live[k]; });
      filled++;
    });
    if(!filled){ banner('<b>No office data came back.</b> '+(res.errors.join('; ')||''), true); return false; }
    const stamp=res.savedAt ? new Date(res.savedAt).toLocaleString() : '';
    banner('<span>\u25CF</span><span>Live from the practice\'s workbook'+
           (stamp?' &mdash; last saved '+stamp:'')+
           (res.cached?' (cached)':'')+
           (res.errors.length?' <b>&mdash; '+res.errors.length+' tab(s) unread</b>':'')+'</span>',
           res.errors.length>0);
    return true;
  }

  // Wait for the workbook before the first paint, so nobody ever sees a screen of zeros.
  function boot(){ hydrate().then(()=>set(saved)); }
  if(window.PH_AUTH) boot();
  else document.addEventListener('ph-signed-in', boot, {once:true});
})();
</script>
