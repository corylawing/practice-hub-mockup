<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber:#F2A03D; --amber-soft:#FFF3E2;
    --blue:#1f6f9e; --blue-soft:#E3F0FA; --ly:#b9c3d1;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.12); --radius:14px; --maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{color:var(--navy);margin:0}
  .ribbon{background:var(--amber);color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand small{display:block;font-weight:500;font-size:12px;color:#9fb4d0}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:#cdd9ea;font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 20px 90px}
  /* viewing as */
  .viewas{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:18px;border-left:5px solid var(--teal)}
  .viewas .lab{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .viewas select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--navy);background:#fff;min-width:200px}
  .viewas .scope{font-size:12.5px;color:var(--teal-600);background:var(--teal-soft);border:1px solid #c4e6e3;padding:5px 11px;border-radius:999px;font-weight:600;margin-left:auto}
  .page-head h1{font-size:25px}
  .page-head p{margin:4px 0 0;color:var(--soft);font-size:14.5px}
  /* office tabs */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 20px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chip:hover{border-color:var(--teal);color:var(--teal-600)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip .br{font-size:10.5px;opacity:.65;margin-left:4px}
  /* kpi cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;border-top:4px solid var(--teal)}
  .kpi.g{border-top-color:var(--good)} .kpi.b{border-top-color:var(--bad)} .kpi.n{border-top-color:var(--blue)}
  .kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;margin-top:3px}
  .kpi .s{font-size:12.5px;color:var(--soft);margin-top:3px}
  .kpi .s b.g{color:var(--good)} .kpi .s b.b{color:var(--bad)}
  /* chart */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:18px}
  .card h2{margin:0 0 2px;font-size:16px;color:var(--navy)}
  .card .sub{font-size:12.5px;color:var(--soft);margin-bottom:14px}
  .legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-bottom:12px;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
  .swline{width:16px;height:0;border-top:2px dashed var(--navy);display:inline-block}
  .swdot{width:16px;height:0;border-top:2px dotted #8a5cf5;display:inline-block}
  .chartwrap{overflow-x:auto;padding-top:8px}
  .plot{position:relative;min-width:660px;padding:26px 0 0 46px}
  .grid{position:absolute;left:46px;right:0;top:26px;bottom:30px;pointer-events:none}
  .grid .gl{position:absolute;left:0;right:0;border-top:1px dashed #e7ebf0}
  .grid .gl b{position:absolute;left:-46px;top:-8px;width:40px;text-align:right;font-size:10px;font-weight:700;color:#9aa6b6}
  .grid .gl.base{border-top:1px solid #d7dde5}
  .chart{position:relative;display:flex;gap:12px;align-items:flex-end;height:210px;padding-bottom:30px}
  .mo{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
  .bars{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
  .bar{width:36%;border-radius:6px 6px 0 0;position:relative;transition:filter .15s,transform .15s;cursor:default}
  .bar:hover{filter:brightness(.94);transform:translateY(-2px)}
  .bval{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  .bar.lyb .bval{color:#8794a6}
  .bar.lyb{background:var(--ly)}
  .bar.ab{background:var(--teal)}
  .bar.ab.over{background:var(--good)} .bar.ab.under{background:var(--bad)} .bar.ab.mtd{background:var(--amber)}
  .gm{position:absolute;left:2%;right:2%;border-top:2px dashed var(--navy);pointer-events:none}
  .sm{position:absolute;left:2%;right:2%;border-top:2px dotted #8a5cf5;pointer-events:none}
  .molab{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--soft);font-weight:700;white-space:nowrap}
  .mo.best .molab{color:var(--good)}
  .tip{position:fixed;background:var(--navy);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50;white-space:nowrap;box-shadow:var(--shadow-lg)}
  /* leaderboard */
  .lb-scroll{overflow-x:auto}
  table.lb{width:100%;border-collapse:collapse;min-width:680px}
  table.lb th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  table.lb td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px}
  table.lb tr:last-child td{border-bottom:none}
  table.lb tbody tr{cursor:pointer}
  table.lb tbody tr:hover td{background:#f2fbfa}
  .rk{font-weight:800;color:var(--soft);width:34px}
  .rk.top{color:#b8860b}
  .onm{font-weight:700;color:var(--navy)}
  .onm .br{font-size:10.5px;color:var(--soft);font-weight:600;margin-left:5px}
  .pbar{height:8px;background:var(--canvas);border-radius:99px;overflow:hidden;min-width:80px;margin-top:4px}
  .pbar i{display:block;height:100%;border-radius:99px;background:var(--good)}
  .pbar i.b{background:var(--bad)} .pbar i.a{background:var(--amber)}
  .num{font-weight:700} .num.g{color:var(--good)} .num.b{color:var(--bad)}
  .dleft{font-weight:700;color:var(--navy)}
  .periodbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}

  .pchip:hover{border-color:var(--teal);color:var(--teal-600)}
  .pchip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .mback{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;
    color:var(--navy);font-family:inherit;cursor:pointer;box-shadow:var(--shadow)}
  .chip .tick{font-weight:800;color:var(--teal-600)}
  .chip.on .tick{color:#fff}
  .chip.combtog{border-style:dashed;font-weight:700}
  .chip.combtog.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pchip.mini{padding:6px 12px;font-size:12.5px;box-shadow:none}
  .phint{font-size:12.5px;color:var(--soft)}
  .charttog{display:flex;gap:6px;margin-bottom:12px}
  /* the at-a-glance gauges — this is the bit people read first */
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  .gauge{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 16px;position:relative;overflow:hidden}
  .gauge::before{content:'';position:absolute;inset:0 0 auto 0;height:5px}
  .gauge.ok::before{background:var(--good)} .gauge.near::before{background:var(--amber)} .gauge.low::before{background:var(--bad)}
  .g-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .g-ttl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
  .g-big{font-size:40px;font-weight:800;color:var(--navy);line-height:1;margin:6px 0 2px}
  .g-pct{font-size:23px;font-weight:800;margin-left:auto}
  .g-pct.ok{color:var(--good)} .g-pct.near{color:var(--amber)} .g-pct.low{color:var(--bad)}
  .g-sub{font-size:13px;color:var(--soft);margin-bottom:14px}
  .track{position:relative;height:26px;background:#eef1f5;border-radius:999px;overflow:visible;margin:34px 0 9px}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .fill.ok{background:linear-gradient(90deg,#3fbf7f,var(--good))}
  .fill.near{background:linear-gradient(90deg,#f7bd6b,var(--amber))}
  .fill.low{background:linear-gradient(90deg,#e8836e,var(--bad))}
  .mk{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px}
  .mk.main{background:var(--navy)} .mk.str{background:#8a5cf5}
  .mklab{position:absolute;top:-20px;transform:translateX(-50%);font-size:10px;font-weight:800;
    letter-spacing:.05em;white-space:nowrap;pointer-events:none}
  .mklab.hi{top:-36px}
  .mklab.main{color:var(--navy)} .mklab.str{color:#8a5cf5}
  .mklab::after{content:'';position:absolute;left:50%;top:13px;width:1px;height:7px;background:currentColor;opacity:.45}
  .mklab.hi::after{height:23px}
  .overflag{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
  .g-foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin-top:14px}
  .g-foot b{color:var(--navy)}
  .g-verdict{font-size:14.5px;font-weight:700;margin-top:4px}
  .g-verdict.ok{color:var(--good)} .g-verdict.near{color:var(--amber)} .g-verdict.low{color:var(--bad)}
  /* celebration */
  .party{background:linear-gradient(100deg,#0F827E,#149B96 55%,#2BC0B8);color:#fff;border-radius:16px;

  .party b{font-size:17px;display:block}
  .party span{font-size:13.5px;opacity:.92}
  .party button{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
  .party button:hover{background:rgba(255,255,255,.3)}
  @media(max-width:760px){ .gauges{grid-template-columns:1fr} .g-big{font-size:33px} }
  .daycard{padding:16px 20px}
  .dayrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .dayn{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  .dayn b{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
  .dayn span{font-size:13px;color:var(--soft)}
  .daybar{flex:1;min-width:160px;height:16px;background:#eef1f5;border-radius:999px;overflow:hidden}
  .daybar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .daypct{font-size:19px;font-weight:800;color:var(--teal-600)}
  .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
  .pips i{width:13px;height:13px;border-radius:4px;background:#e3e8ef;display:block}
  .pips i.on{background:var(--teal)}
  .daysub{font-size:13px;color:var(--soft);margin-top:10px}
  .secttl{font-size:19px;color:var(--navy);margin:26px 0 2px}
  .secttl:first-of-type{margin-top:8px}
  .secsub{font-size:13.5px;color:var(--soft);margin:0 0 14px}
  .noacc{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--soft)}
  .noacc b{color:var(--navy)}
  .foot{font-size:12px;color:var(--soft);margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;line-height:1.55}
  .foot b{color:var(--navy)}
  @media(max-width:620px){ .kpi .v{font-size:22px} }
</style>
<script src="user.js"></script>
<script src="celebrate.js"></script>

      const cls=inProg?'mtd':(o.act[i]>=o.goal[i]?'over':'under');
      const h=v=>Math.max(1.5,(v/max)*100);
      return '<div class="mo'+(i===best?' best':'')+'"><div class="bars">'+
        '<div class="gm" style="bottom:'+h(o.goal[i])+'%"></div>'+
        '<div class="sm" style="bottom:'+h(o.stretch[i])+'%"></div>'+
        '<div class="bar lyb" style="height:'+h(o.ly[i])+'%" data-t="'+MO[i]+' last year: '+full(o.ly[i])+'"></div>'+
        '<div class="bar ab '+cls+'" style="height:'+h(o.act[i])+'%" data-t="'+MO[i]+' 2026: '+full(o.act[i])+' \u00b7 main goal '+full(o.goal[i])+' \u00b7 stretch '+full(o.stretch[i])+'">'+
          '<span class="bval">'+money(o.act[i])+'</span></div>'+
        '</div><div class="molab">'+MO[i]+(i===best?' \u2605':'')+'</div></div>';
    }).join('');
    return '<div class="card" id="bottomchart"><h2>Month by month</h2>'+
      '<div class="sub">Last year beside this year. <b>Dashed</b> = main goal, <b>dotted</b> = stretch. Hover any bar for exact figures. \u2605 = best month.</div>'+
      chartToggle()+
      '<div class="legend"><span><i class="sw" style="background:var(--ly)"></i> Last year (2025)</span>'+
        '<span><i class="sw" style="background:var(--good)"></i> 2026 at/above goal</span>'+
        '<span><i class="sw" style="background:var(--bad)"></i> 2026 under goal</span>'+
        '<span><i class="swline"></i> Main goal</span><span><i class="swdot"></i> Stretch goal</span></div>'+
      '<div class="chartwrap"><div class="plot">'+axis(max,true)+'<div class="chart">'+cols+'</div></div></div></div>';
  }
  function axis(max,money$){
    const steps=4, lines=[];
    for(let i=steps;i>=0;i--){
      const v=max*(i/steps), pct=(i/steps)*100;
      lines.push('<div class="gl'+(i===0?' base':'')+'" style="bottom:'+pct+'%"><b>'+(money$?money(v):Math.round(v))+'</b></div>');
    }
    return '<div class="grid">'+lines.join('')+'</div>';
  }
  function chartToggle(){
    const b=(v,lab)=>'<button class="pchip mini'+(chartMode===v?' on':'')+'" onclick="DASH.chart(\''+v+'\')">'+lab+'</button>';
    return '<div class="charttog">'+b('starts','\ud83e\uddb7 Starts')+b('production','\ud83d\udcb0 Production')+'</div>';
  }
  function leaderboard(list){
    const rows=list.map(o=>({o,t:stats(o),s:sStats(o)})).sort((x,y)=>y.s.pct-x.s.pct);
    const body=rows.map((r,i)=>{
      const t=r.t, pctw=Math.min(100,r.s.pct*100), cls=r.s.pct>=1?'':(r.s.pct>=.9?'a':'b');
      return '<tr onclick="DASH.pick(\''+r.o.n+'\')">'+
        '<td class="rk'+(i===0?' top':'')+'">'+(i===0?'🏆':i+1)+'</td>'+
        '<td><div class="onm">'+r.o.n+'<span class="br">'+r.o.brand+'</span></div>'+
          '<div class="pbar"><i class="'+cls+'" style="width:'+pctw+'%"></i></div></td>'+
        '<td class="num">'+pc(r.s.pct)+'</td>'+
        '<td class="num '+(r.s.v>=0?'g':'b')+'">'+(r.s.v>=0?'+':'')+Math.round(r.s.v)+'</td>'+
        '<td class="num">'+pc(t.pct)+'</td>'+
        '<td class="num '+(t.vgoal>=0?'g':'b')+'">'+(t.vgoal>=0?'+':'')+full(t.vgoal)+'</td>'+
        '<td class="num '+(t.yoy>=1?'g':'b')+'">'+pc(t.yoy)+'</td>'+
        '<td class="dleft">'+t.daysLeft+'</td></tr>';
    }).join('');
    return '<div class="card"><h2>Leaderboard</h2>'+
      '<div class="sub">Best performance on top, ranked by <b>% of starts goal</b>. “Days left” = production days remaining this year.</div>'+
      '<div class="lb-scroll"><table class="lb"><thead><tr><th></th><th>Office</th><th>Starts %</th><th>Starts ±</th><th>Prod %</th><th>Prod vs goal</th><th>vs last yr</th><th>Days left</th></tr></thead>'+
      '<tbody>'+body+'</tbody></table></div></div>';
  }
  function render(){

    if(!allowed.length){
      el('chips').innerHTML=''; el('scope').textContent='No dashboard access';
      el('view').innerHTML='<div class="noacc"><b>This role doesn\'t have the Production Dashboard.</b><br>An admin grants access per team in <b>Admin → Teams &amp; Access</b>.</div>';
      el('sub').textContent='Access is set by team; the offices you see are set by your location.';
      return;
    }
    const multi=allowed.length>1;
    el('scope').textContent = cur.offices==='all' ? 'All 8 offices' : (allowed.length+' office'+(allowed.length>1?'s':'')+': '+allowed.map(o=>o.n).join(', '));
    el('sub').textContent = multi ? 'Where production stands against the main goal and the stretch goal.'
                                  : 'Your office\'s production against the main goal and the stretch goal.';
    if(!multi) sel=allowed[0].n;
    else if(sel!=='ALL' && !allowed.some(o=>o.n===sel)) sel='ALL';
    el('chips').innerHTML = multi
      ? ('<button class="chip'+(sel==='ALL'?' on':'')+'" onclick="DASH.pick(\'ALL\')">All Offices</button>'+
         allowed.map(o=>{ const on = sel==='ALL'? false : (combine? combined.has(o.n) : sel===o.n);
           return '<button class="chip'+(on?' on':'')+'" onclick="DASH.pick(\''+o.n+'\')">'+
             (combine?'<span class="tick">'+(on?'\u2713':'+')+'</span> ':'')+o.n+'<span class="br">'+o.brand+'</span></button>';}).join('')+
         '<button class="chip combtog'+(combine?' on':'')+'" onclick="DASH.combine()" title="Add offices together and see one set of numbers">'+
           (combine?'\u2715 Stop combining':'\u2795 Combine offices')+'</button>')
      : '';
    const isAll = multi && sel==='ALL';
    const picked = combine ? allowed.filter(x=>combined.has(x.n)) : [];
    const isCombo = combine && picked.length>0;
    const o = isAll ? group(allowed) : isCombo ? group(picked) : allowed.find(x=>x.n===sel);
    if(isCombo) o.n = picked.length+' offices combined';
    shown=o;
    const who = isAll ? 'The group' : isCombo ? picked.map(x=>x.n).join(' + ') : o.n;
    let html = partyBanner(o,who) + periodBar(o) + gauges(o) +
      '<h2 class="secttl">\ud83d\udcc6 Production days</h2><p class="secsub">How much of the '+(period==='mtd'?'month':'year')+' has actually been worked.</p>'+
      daysTiles(o) +
      (chartMode==='starts'? startsChart(o) : chart(o));
    if(isAll) html += leaderboard(allowed);
    html += '<div class="foot"><b>Where these numbers come from:</b> the practice\'s 2026 Production Dashboard workbook on SharePoint — the hub reads it live, so there is no second copy to keep in sync. A month counts once it has <b>both</b> an actual and a goal (Mansfield has production from January but goals from April).<br><br><b>Heads up on the workbook:</b> the “Dashboard” tab\'s 2026 total shows <b>+$449,954</b> vs goal, but adding the eight offices gives <b>+$406,663</b> — the total formula skips Mansfield (−$43,935). The hub adds every office every time.</div>';
    el('view').innerHTML = html;
    wireTips();
    maybeParty(o,(isAll?'ALL':sel)+'|'+period);
  }
  function wireTips(){
    const tip=el('tip');
    document.querySelectorAll('.bar[data-t]').forEach(b=>{
      b.onmousemove=e=>{tip.textContent=b.dataset.t;tip.style.opacity='1';
        tip.style.left=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-10)+'px';tip.style.top=(e.clientY-34)+'px';};
      b.onmouseleave=()=>{tip.style.opacity='0';};
    });
  }
  function pick(n){
    if(combine && n!=='ALL'){ combined.has(n)?combined.delete(n):combined.add(n); render(); return; }
    if(n==='ALL'){ combine=false; combined.clear(); }
    sel=n; render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function toggleCombine(){
    combine=!combine;
    if(combine){ combined.clear(); if(sel!=='ALL') combined.add(sel); }
    render();
  }
  function set(id){
    cur=PERSONAS.find(p=>p.id===id)||PERSONAS[0];
    try{ localStorage.setItem('ph_viewas',cur.id); }catch(_){}
    el('persona').value=cur.id;
    allowed = cur.offices==='all' ? OFFICES.slice() : OFFICES.filter(o=>cur.offices.indexOf(o.n)>=0);
    sel = allowed.length>1 ? 'ALL' : (allowed[0]?allowed[0].n:'ALL');
    render();
  }
  el('persona').innerHTML=PERSONAS.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('');
  window.DASH={set,pick,party:partyNow,combine:toggleCombine,
    period:v=>{period=v;render();},
    month:v=>{ if(v==='')return; period=Number(v); render(); },
    chart:v=>{chartMode=v;render();}};
  let saved='admin'; try{ saved=localStorage.getItem('ph_viewas')||'admin'; }catch(_){}
  if(!PERSONAS.some(p=>p.id===saved)) saved='admin';
  set(saved);
})();
</script>
<script>PH.nav('dashboard');</script>

  {sel:'.kpis', title:'The four numbers', body:'Production so far \u00b7 how far <b>ahead or behind the main goal</b> \u00b7 <b>% of the main goal</b> with the <b>stretch goal</b> underneath \u00b7 and how it compares to <b>last year</b>.'},
  {sel:'#chips', title:'Group, or one office', body:'<b>All Offices</b> is the group view. Tap any office name to open just that office. A manager with one office skips straight to hers.'},
  {sel:'.chart', title:'This year vs last year', body:'Each month shows <b>last year in grey</b> beside this year. The <b>dashed line</b> is the main goal; the <b>dotted line</b> is the stretch goal. Green means the main goal was beaten.'},
  {sel:'table.lb', title:'The leaderboard', body:'Every office ranked <b>best on top</b> by % of goal, with <b>production days left</b> in the year. Tap any row to open that office.'},

], {key:'dash', title:'Production Dashboard', next:{label:'entering the numbers', href:'production.html'}});
</script>
