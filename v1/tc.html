<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-Brace · TC Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.png?v=2" type="image/png">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-title" content="Home-Brace">
<link rel="apple-touch-icon" href="../assets/logo-mark.png">
<meta name="robots" content="noindex">
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber:#F2A03D; --amber-soft:#FFF4E2;
    --blue:#1f6f9e; --blue-soft:#E3F0FA; --plum:#6b3fd0; --plum-soft:#F0EAFB;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.12); --radius:14px; --maxw:1080px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{color:var(--navy);margin:0}
  button{font-family:inherit}
  .ribbon{background:var(--amber);color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark{width:34px;height:34px;flex:none;display:block}
  .mark img{width:34px;height:34px;display:block;border-radius:50%}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:#9fb4d0}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:#cdd9ea;font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 20px 90px}
  .viewas{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:16px;border-left:5px solid var(--teal)}
  .viewas .lab{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .viewas select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--navy);background:#fff;max-width:100%;min-width:0}
  .viewas .demo{margin-left:auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .page-head h1{font-size:25px}
  .page-head p{margin:4px 0 0;color:var(--soft);font-size:14.5px;max-width:60ch}

  /* Office first - the same rule as Enter Production. */
  .offbar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
  .ochip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer}
  .ochip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .ochip.fixed{cursor:default;background:var(--teal-soft);border-color:#c4e6e3;color:#0c5b57}
  .tabs{display:flex;gap:4px;margin:16px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:11px 14px;font-size:14.5px;font-weight:700;color:var(--soft);cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--navy);border-bottom-color:var(--teal)}
  .tab .n{display:inline-block;min-width:20px;padding:1px 7px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
  .tab .n.z{background:var(--line);color:var(--soft)}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h2{margin:0 0 3px;font-size:16px;color:var(--navy)}
  .card .sub{font-size:12.5px;color:var(--soft);margin:0 0 12px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .muted{color:var(--soft)}
  .small{font-size:12.5px}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .btn:hover{background:var(--teal-600)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.big{padding:14px 22px;font-size:16px}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600}
  .btn.ghost:hover{border-color:var(--teal);background:var(--teal-soft)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid #f0c7bf}
  .btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
  .link{background:none;border:none;color:var(--teal-600);font-weight:700;cursor:pointer;padding:0;font-size:inherit}
  .note{border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5}
  .note.warn{background:var(--amber-soft);border:1px solid #f3d7a6;color:#7a4b00}
  .note.info{background:var(--blue-soft);border:1px solid #c3ddf2;color:#14496c}
  .note.good{background:var(--good-soft);border:1px solid #bfe3cf;color:#1d6b47}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--soft)}

  /* Outcome colours - the same six everywhere. */
  .oc{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .oc-Started{background:var(--good-soft);color:#1d6b47}
  .oc-Pending{background:var(--amber-soft);color:#7a4b00}
  .oc-Observation{background:var(--plum-soft);color:#4b2a9a}
  .oc-NoShow{background:var(--bad-soft);color:#9a2f1e}
  .oc-Refused{background:#EEF1F5;color:#46546b}
  .oc-Rescheduled{background:var(--blue-soft);color:#14496c}
  .oc-none{background:#fff;color:var(--soft);border:1px dashed #c9d1dc}
  .oc-Hold{background:#E4F4EF;color:#1b6b57}
  .oc-Medicaid{background:#ECEDFC;color:#3b3f9e}
  .pay{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;background:#ECEDFC;color:#3b3f9e;margin-left:6px;vertical-align:1px}

  /* Today */
  .todayhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .todayhead h2{font-size:19px;margin:0;color:var(--navy)}
  .capline{font-size:13.5px;color:var(--soft)}
  .capline b{color:var(--navy)}
  .clist{display:flex;flex-direction:column}
  .crow{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
  .crow:last-child{border-bottom:none}
  .crow .tm{font-weight:800;color:var(--navy);font-size:14px;font-variant-numeric:tabular-nums}
  .crow .who{min-width:0}
  .crow .nm{font-weight:700;color:var(--ink);background:none;border:none;padding:0;cursor:pointer;text-align:left;font-size:15px}
  .crow .nm:hover{color:var(--teal-600);text-decoration:underline}
  .crow .meta{font-size:12.5px;color:var(--soft)}
  .quick{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .qb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer}
  .qb:hover{border-color:var(--teal);background:var(--teal-soft)}
  .duecard{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .duecard .big{font-size:30px;font-weight:800;color:var(--navy);line-height:1}

  /* Call list */
  .sect{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:4px 0 8px}
  .fu{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;box-shadow:var(--shadow)}
  .fu + .fu{margin-top:10px}
  .fu .act{display:inline-block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:3px 8px;margin-bottom:5px}
  .act-due{background:var(--bad-soft);color:#9a2f1e}
  .act-recall{background:var(--good-soft);color:#1d6b47}
  .act-set{background:var(--amber-soft);color:#7a4b00}
  .act-later{background:#EEF1F5;color:#46546b}
  .fu .nm{font-weight:800;font-size:15.5px;color:var(--ink);background:none;border:none;padding:0;cursor:pointer;text-align:left}
  .fu .nm:hover{color:var(--teal-600);text-decoration:underline}
  .fu .facts{font-size:13px;color:var(--soft);display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:3px}
  .fu .facts b{color:var(--ink);font-weight:600}
  .fu .notes{font-size:12.5px;color:var(--soft);margin-top:4px;font-style:italic}
  .fu .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-content:flex-start;max-width:330px}
  .fu.called{opacity:.72}
  .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--good);margin-left:6px}
  a.tel{color:var(--teal-600);font-weight:700;text-decoration:none}
  details.later > summary{cursor:pointer;font-weight:700;color:var(--navy);list-style:none;padding:8px 0}
  details.later > summary::-webkit-details-marker{display:none}

  /* Consults */
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .mpick{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .mpick button{background:none;border:none;padding:9px 12px;font-size:15px;font-weight:800;color:var(--navy);cursor:pointer}
  .mpick button:hover{background:var(--teal-soft)}
  .mpick span{font-weight:800;color:var(--navy);padding:0 6px;min-width:128px;text-align:center;font-size:14.5px}
  .search{flex:1;min-width:180px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--navy);background:#fff}
  .tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  table.t th{background:#F7F9FB;color:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t tr:last-child td{border-bottom:none}
  table.t td.n, table.t th.n{text-align:right}
  table.t td:first-child{white-space:nowrap}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:#FAFCFD}
  table.t tr.mine td{background:var(--teal-soft)}
  table.t tr.total td{font-weight:800;color:var(--navy);background:#F7F9FB}
  table.t tr.closed td{color:#9aa6b6}

  /* Numbers */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
  .kpi .v{font-size:24px;font-weight:800;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--soft)}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .mt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  .mt td{padding:7px 0;border-bottom:1px solid var(--line)}
  .mt tr:last-child td{border-bottom:none}
  .mt td.v{text-align:right;font-weight:800;color:var(--navy);padding-left:10px}
  .mt td.r{text-align:right;color:var(--soft);width:56px}
  .mt td.c{color:var(--soft);font-size:12px;padding-left:10px}
  .mt tr.sub td:first-child{padding-left:14px;color:var(--soft)}
  details.card > summary{cursor:pointer;font-weight:800;color:var(--navy);font-size:16px}
  details.card[open] > summary{margin-bottom:12px}

  /* Slots */
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cal .dow{font-size:11.5px;font-weight:800;color:var(--soft);text-transform:uppercase;text-align:center;padding:4px 0}
  .day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 8px;min-height:74px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .day:hover{border-color:var(--teal)}
  .day[disabled]{cursor:default}
  .day .d{font-size:12px;font-weight:700;color:var(--soft)}
  .day .s{font-size:20px;font-weight:800;color:var(--navy);line-height:1.1}
  .day .b{font-size:11.5px;color:var(--soft)}
  .day.closed{background:#F7F9FB}
  .day.closed .s{font-size:12.5px;color:#9aa6b6;font-weight:700}
  .day.changed{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
  .day.today{outline:2px solid var(--navy);outline-offset:1px}
  .day.blank{visibility:hidden}

  /* Dialog */
  .dm{position:fixed;inset:0;background:rgba(15,42,74,.45);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:60;overflow-y:auto}
  .dm.open{display:flex}
  .dmc{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;display:flex;flex-direction:column}
  .dmc.narrow{max-width:440px}
  .dm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dm-top h3{margin:0;font-size:17px;color:var(--navy)}
  .dm-top .x{background:none;border:none;font-size:24px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px}
  .dm-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .dm-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .dm-foot .left{margin-right:auto}
  .grp{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .grp > .gl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:8px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fld.full{grid-column:1/-1}
  .fld > label,.lab2{font-size:12.5px;font-weight:700;color:var(--ink)}
  .fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
  .fld textarea{min-height:64px;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  .fld input[readonly]{background:#fafbfc;color:var(--soft)}
  .req{color:var(--bad)}
  /* Notes: talk to type (17/10) */
  .lab-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
  .lab-row > label{font-size:12.5px;font-weight:700;color:var(--ink)}
  .talk{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer;line-height:1.45;white-space:nowrap}
  .talk:hover{border-color:var(--teal);background:var(--teal-soft)}
  .talk.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .talk-st{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--bad)}
  .talk-st:empty{display:none}
  .rec-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;animation:recpulse 1.2s ease-in-out infinite}
  @keyframes recpulse{50%{opacity:.25}}
  .fld textarea.listening{border-color:var(--bad);outline:2px solid var(--bad-soft)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .chip.oc-pick.on.o-Started{background:var(--good);border-color:var(--good)}
  .chip.oc-pick.on.o-Pending{background:#c07a12;border-color:#c07a12}
  .chip.oc-pick.on.o-Observation{background:var(--plum);border-color:var(--plum)}
  .chip.oc-pick.on.o-NoShow{background:var(--bad);border-color:var(--bad)}
  .chip.oc-pick.on.o-Refused{background:#5b687d;border-color:#5b687d}
  .chip.oc-pick.on.o-Rescheduled{background:var(--blue);border-color:var(--blue)}
  .chip.oc-pick.on.o-Hold{background:#2a8a70;border-color:#2a8a70}
  .chip.oc-pick.on.o-Medicaid{background:#4a4fc0;border-color:#4a4fc0}
  .chk{display:flex;gap:8px 14px;flex-wrap:wrap}
  .chk label{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
  .then{background:#F7F9FB;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .then .q{font-size:13.5px;font-weight:700;color:var(--navy)}
  .err{background:var(--bad-soft);color:#9a2f1e;border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600}
  details.more > summary{cursor:pointer;font-weight:700;color:var(--teal-600);font-size:13.5px;padding:4px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:calc(100vw - 32px)}
  .toast.on{opacity:1}
  .toast.bad{background:var(--bad)}

  @media(max-width:860px){ .three{grid-template-columns:1fr} }
  @media(max-width:640px){
    .wrap{padding:16px 14px 90px}
    .crow{grid-template-columns:52px 1fr}
    .crow .quick{grid-column:1/-1;justify-content:flex-start}
    .fu{grid-template-columns:1fr}
    .fu .btns{justify-content:flex-start;max-width:none}
    .fields{grid-template-columns:1fr}
    .talk{padding:8px 15px;font-size:14px}
    .dm{padding:0}
    .dmc{border-radius:0;min-height:100%}
    .day{min-height:58px;padding:5px}
    .day .s{font-size:16px}
    .day .b{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
<script src="user.js?v=hc99"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
  <script src="store.js?v=hc99"></script>
  <script src="gate.js?v=hc99"></script>
  <script src="_staff.js?v=hc99"></script>
  <script src="tc.js?v=hc99"></script>
  <script src="tcstore.js?v=hc99"></script>
</head>
<body>
<div class="ribbon">SANDBOX — made-up patients. Use “Try it as” to see it as a TC, an office manager or Selene.</div>
<header class="hdr">
  <div class="hdr-in">
    <span class="mark" aria-label="Home-Brace"><img src="../assets/logo-mark.png?v=2" alt="" width="34" height="34"></span>
    <span class="brand">Home-<i>Brace</i><small>TC Tracker</small></span>
    <span class="v1">V1 preview</span>
  </div>
</header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>

<div class="wrap">
  <div class="viewas">
    <span class="lab">👤 Try it as</span>
    <select id="persona" aria-label="Try it as"></select>
    <button class="btn ghost sm demo" data-act="demo-reset" title="Put the made-up consults back to how they started">↺ Reset sample data</button>
  </div>
  <div class="page-head">
    <div>
      <h1>TC Tracker</h1>
      <p>Every new-patient consult in one place. The call list and the month’s numbers build themselves &mdash; nothing to email.</p>
    </div>
  </div>
  <div id="offbar" class="offbar"></div>
  <div id="tabs" class="tabs" role="tablist"></div>
  <div id="view"><div class="empty">Loading…</div></div>
</div>

<div class="dm" id="dlg" aria-modal="true" role="dialog"><div class="dmc" id="dlgcard"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  const el=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const attr=(k,v)=>' data-'+k+'="'+esc(v)+'"';
  const LIVE=()=>!!(window.PH && PH.isLive && PH.isLive());
  const RANK={none:0,view:1,add:2,edit:3,manage:4};
  /* SANDBOX: try it as a TC, an office manager or Selene, whoever is signed in. Everyone
     on the sandbox is signed in as themselves, so the hub's own "Viewing as" never applies
     there - and Selene's real access may not be set up on it. Live: the real person. */
  const ROLES={
    tc:{label:'A TC (Elizabeth Reyes, Hobbs)', level:'edit', offices:['Hobbs'], name:'Elizabeth Reyes', mail:'liz@farnsworthorthodontics.com', tc:true},
    om:{label:'An office manager (Lily Rico, Carlsbad) — view only', level:'view', offices:['Carlsbad'], name:'Lily Rico', mail:'lily@farnsworthorthodontics.com'},
    lead:{label:'Selene / leadership — every office', level:'manage', offices:'all', name:'Selene Brown', mail:''}
  };
  let tryAs=null;
  if(!LIVE()){ try{ tryAs=localStorage.getItem('ph_tc_as'); }catch(_){} if(!ROLES[tryAs]) tryAs='lead'; }
  const role=()=>tryAs?ROLES[tryAs]:null;
  // Admins run the hub - they always have the whole tracker. Everyone else: Teams & Access.
  const level=()=>role() ? role().level : !window.PH ? 'none' : (PH.isAdmin && PH.isAdmin(PH.me())) ? 'manage' : (PH.can ? PH.can('tc') : 'none');
  const canEdit=()=>RANK[level()]>=RANK.edit;
  const canManage=()=>level()==='manage';
  const today=()=>TC.iso();
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtD=s=>{ const d=TC.parse(s); return d?DOW[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate():''; };
  const fmtS=s=>{ const d=TC.parse(s); return d?MO[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():''):''; };
  const fmtM=ym=>MONTHS[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
  const fmtT=t=>{ if(!t) return ''; const [h,m]=t.split(':').map(Number); return ((h+11)%12+1)+':'+String(m).padStart(2,'0')+(h<12?'a':'p'); };
  const pct=x=>x==null?'—':Math.round(x*100)+'%';
  const ocClass=o=>'oc-'+(o==='No Show'?'NoShow':o==='Refused Treatment'?'Refused':o==='Rescheduled / Cancelled'?'Rescheduled':
    o==='Pre-TX Hold'?'Hold':o==='Submitted to Medicaid'?'Medicaid':(o||'none'));
  const ocShort=o=>o==='Refused Treatment'?'Refused':o==='Rescheduled / Cancelled'?'Rescheduled':o;
  const ocBadge=o=>'<span class="oc '+ocClass(o)+'">'+esc(o?ocShort(o):'No outcome yet')+'</span>';

  /* ---------------- who, and which offices ---------------- */
  function me(){ return (window.PH && PH.me) ? PH.me() : {}; }
  function myName(){ if(role()) return role().name; try{ return PH.name(me()); }catch(_){ return ''; } }
  function myMail(){ if(role()) return role().mail; const m=me(); return String(m.mail||m.email||'').toLowerCase(); }
  function allOffices(){ return (window.PH && PH.officeNames) ? PH.officeNames() : []; }
  /* The offices this person may see - the same rule as every other page: Admin,
     Executive and Leadership see every office; everyone else sees their own. */
  function myOffices(){
    const all=allOffices(), mine=role() ? role().offices : ((window.PH && PH.offices) ? PH.offices() : 'all');
    if(mine==='all') return all;
    const list=(Array.isArray(mine)?mine:[]).filter(o=>all.indexOf(o)>=0);
    return list.length?list:(Array.isArray(mine)?mine.slice():[]);
  }
  let office=null;                      // null = every office this person has
  const inView=()=>office?[office]:myOffices();
  /* TCs per office, for the TC box: the live roster, or the sandbox's shared list. */
  function tcsFor(o){
    const out=[];
    const add=(name,mail)=>{ if(name && !out.some(x=>x.name===name)) out.push({name, mail:(mail||'').toLowerCase()}); };
    if(LIVE() && PH.rosterView){
      PH.rosterView().forEach(r=>{
        const teams=(Array.isArray(r.teams)?r.teams:String(r.teams||'').split(/[;,]/)).map(t=>String(t).trim().toLowerCase());
        const offs=Array.isArray(r.offices)?r.offices:String(r.offices||r.loc||'').split(',').map(x=>x.trim());
        if((teams.indexOf('tcs')>=0 || /\bTC\b/.test(r.role||'')) && offs.indexOf(o)>=0) add(r.name||r.n, r.email||r.mail);
      });
    } else {
      (window.STAFF||[]).forEach(s=>{
        const where=s.loc==='Las Cruces' ? (s.brand==='LCO'?'Cruces LCO':'Cruces FFO') : s.loc;
        if(/\bTC\b/.test(s.role||'') && where===o) add(s.n, s.mail);
      });
    }
    return out;
  }
  const iAmTC=()=>role() ? !!role().tc : ((me().teams||[]).some(t=>String(t).toLowerCase()==='tcs') || /\bTC\b/.test(me().role||''));
  function defaultTC(o){
    if(iAmTC() || !tcsFor(o).length) return {name:myName(), mail:myMail()};
    return tcsFor(o)[0];
  }

  /* ---------------- data ---------------- */
  // ALL = this person's offices. EVERY = every office, used only for the all-TCs rates table.
  let ALL=[], EVERY=[], SLOTS={}, LISTS=Object.assign({}, TC.DEFAULT_LISTS), SCHED=null, loaded=false, loadErr='';
  const takesMed=o=>TC.takesMedicaid(LISTS, o);
  const payTag=r=>r.payer==='Medicaid'?'<span class="pay">Medicaid</span>':'';
  // "Submitted to Medicaid" only for a Medicaid patient at an office that takes Medicaid.
  const outcomesFor=r=>TC.OUTCOMES.filter(o=>o!=='Submitted to Medicaid' || (takesMed(r.office) && r.payer==='Medicaid'));
  const openFns={};
  function isOpenFn(o){
    if(!openFns[o]){ const loc=(PH.locations()||[]).find(l=>l.n===o)||{}; openFns[o]=TC.openFrom(o, loc.hours, SCHED); }
    return openFns[o];
  }
  // The usual number reaches a month once it has arrived (tc.js slotsOn).
  const until=()=>TC.lastDayOf(TC.monthOf(today()));
  const slotsOn=d=>inView().reduce((a,o)=>a+TC.slotsOn(SLOTS[o]||{}, d, isOpenFn(o), until()),0);
  const slotsMonth=ym=>inView().reduce((a,o)=>a+TC.slotsInMonth(SLOTS[o]||{}, ym, isOpenFn(o), until()),0);
  function localRecords(prefix){
    const out={};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.indexOf(prefix)===0 && k.indexOf('__')<0){ try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch(_){} }
      }
    }catch(_){}
    return out;
  }
  /* SANDBOX ONLY: two months of made-up consults so there is something to look at. */
  const DEMO_FLAG='ph_tc_demo';
  function seedDemo(force){
    if(LIVE()) return;
    try{ if(!force && localStorage.getItem(DEMO_FLAG)==='v3') return; }catch(_){ return; }
    let sched=null; try{ sched=JSON.parse(localStorage.getItem('ph_sched2')); }catch(_){}
    const offs=(PH.locations()||[]).map(l=>({n:l.n, isOpen:TC.openFrom(l.n, l.hours, sched)}));
    const from=TC.shiftMonth(TC.monthOf(today()),-1)+'-01';
    const recs=TC.demo({today:today(), from, offices:offs, medicaid:TC.DEFAULT_MEDICAID,
      tcFor:o=>tcsFor(o)[0]});
    const byKey={};
    recs.forEach(r=>{
      const ym=TC.monthOf(r.date), k=TC.logKey(r.office, ym);
      (byKey[k]=byKey[k]||{v:1, office:r.office, month:ym, consults:{}}).consults[r.id]=r;
    });
    try{
      Object.keys(localRecords(TC.LOG_PREFIX)).forEach(k=>localStorage.removeItem(k));
      Object.keys(byKey).forEach(k=>localStorage.setItem(k, JSON.stringify(byKey[k])));
      (PH.locations()||[]).forEach((l,i)=>{ const n=TC.SLOT_CHOICES[i%3];
        localStorage.setItem(TC.slotsKey(l.n), JSON.stringify({usual:n, hist:[{from, n}], days:{}})); });
      localStorage.removeItem(TC.LISTS_KEY);
      localStorage.setItem(DEMO_FLAG,'v3');
    }catch(_){}
  }
  function load(){
    const offs=myOffices();
    seedDemo(false);
    // Consults live in their own locked folder on the live site (tcstore.js), the browser on the sandbox.
    const logs=TCSTORE.getAll(TC.LOG_PREFIX);
    // Every office's slots (no patient details in them): TCs see every office in "By office".
    const slots=Promise.all([...new Set(allOffices().concat(offs))].map(o=>PH_STORE.get(TC.slotsKey(o)).then(v=>[o,v], ()=>[o,null])));
    return Promise.all([logs, slots, PH_STORE.get(TC.LISTS_KEY).catch(()=>null), PH_STORE.get('ph_sched2').catch(()=>null)])
      .then(([L,S,Li,Sc])=>{
        EVERY=TC.consultsFrom(L).filter(TC.live);
        ALL=EVERY.filter(r=>offs.indexOf(r.office)>=0);
        SLOTS={}; S.forEach(([o,v])=>{ SLOTS[o]=(v && typeof v==='object')?v:{}; });
        LISTS=Object.assign({}, TC.DEFAULT_LISTS, (Li && typeof Li==='object')?Li:{});
        SCHED=(Sc && typeof Sc==='object')?Sc:null;
        Object.keys(openFns).forEach(k=>delete openFns[k]);
        loaded=true; loadErr=''; render();
      }, e=>{ loaded=true; loadErr=(e && e.message)||'Could not read the tracker.'; render(); });
  }
  const strip=r=>{ const o=Object.assign({}, r); Object.keys(o).forEach(k=>{ if(o[k]===undefined) delete o[k]; }); return o; };
  /* One consult to its office-and-month record. A consult whose date or office changed
     leaves a "moved" marker in its old record (nothing is ever removed - see tc.js). */
  function persist(rec, oldKey){
    rec.upd=new Date().toISOString(); rec.updBy=myMail()||myName();
    const ym=TC.monthOf(rec.date), key=TC.logKey(rec.office, ym);
    const put=TCSTORE.update(key, cur=>{
      const v=(cur && typeof cur==='object') ? Object.assign({}, cur) : {v:1, office:rec.office, month:ym, consults:{}};
      v.consults=Object.assign({}, v.consults||{}); v.consults[rec.id]=strip(rec); return v;
    });
    const mv=(oldKey && oldKey!==key) ? TCSTORE.update(oldKey, cur=>{
      if(!cur || !cur.consults || !cur.consults[rec.id]) return undefined;
      const v=Object.assign({}, cur); v.consults=Object.assign({}, cur.consults);
      v.consults[rec.id]={moved:true, to:key, upd:rec.upd}; return v;
    }) : Promise.resolve({});
    return Promise.all([put, mv]).then(()=>{
      [ALL, EVERY].forEach(arr=>{
        const i=arr.findIndex(x=>x.id===rec.id);
        if(rec.deleted){ if(i>=0) arr.splice(i,1); }
        else if(i>=0) arr[i]=Object.assign({}, rec); else arr.push(Object.assign({}, rec));
      });
    });
  }
  const keyOf=r=>TC.logKey(r.office, TC.monthOf(r.date));
  function saveSlots(o, mutate){
    return PH_STORE.update(TC.slotsKey(o), cur=>{
      const v=(cur && typeof cur==='object') ? Object.assign({}, cur) : {};
      v.days=Object.assign({}, v.days||{}); mutate(v); return v;
    }).then(r=>{ if(r && (r.blocked || r.error)) throw new Error(r.why || r.error); SLOTS[o]=r && r.value ? r.value : SLOTS[o]; });
  }

  /* ---------------- toast ---------------- */
  let toastT=null;
  function toast(msg, bad){
    const t=el('toast'); t.textContent=msg; t.className='toast on'+(bad?' bad':'');
    clearTimeout(toastT); toastT=setTimeout(()=>{ t.className='toast'+(bad?' bad':''); }, bad?5200:2400);
  }

  /* ---------------- page ---------------- */
  let tab=null, month=TC.monthOf(today()), tcFilter='', q='', ocFilter='';
  const TABS=[
    {k:'today', n:'Today'},
    {k:'calls', n:'Call list'},
    {k:'log', n:'Consults'},
    {k:'numbers', n:'Numbers'},
    {k:'slots', n:'Slots'}
  ];
  // TCs open on Today; Selene, Heather and office managers on the numbers.
  function defaultTab(){ return canEdit() && !canManage() ? 'today' : 'numbers'; }
  const scoped=()=>ALL.filter(r=>inView().indexOf(r.office)>=0);
  const scopedTC=()=>scoped().filter(r=>!tcFilter || r.tc===tcFilter);

  function renderOffices(){
    const offs=myOffices(), bar=el('offbar');
    if(offs.length<=1){ bar.innerHTML=offs.length?'<span class="ochip fixed">📍 '+esc(offs[0])+'</span>':''; office=offs[0]||null; return; }
    bar.innerHTML='<button class="ochip'+(office?'':' on')+'"'+attr('act','office')+attr('v','')+'>All '+(offs.length===allOffices().length?'offices':'my offices')+'</button>'+
      offs.map(o=>'<button class="ochip'+(office===o?' on':'')+'"'+attr('act','office')+attr('v',o)+'>'+esc(o)+'</button>').join('');
  }
  function renderTabs(){
    const due=TC.callList(scoped(), today()).filter(x=>TC.DUE.indexOf(x.a)>=0).length;
    el('tabs').innerHTML=TABS.map(t=>'<button role="tab" class="tab'+(tab===t.k?' on':'')+'"'+attr('act','tab')+attr('v',t.k)+'>'+t.n+
      (t.k==='calls'?'<span class="n'+(due?'':' z')+'">'+due+'</span>':'')+'</button>').join('');
  }
  function render(){
    if(RANK[level()]<RANK.view){ el('view').innerHTML='<div class="empty">You don’t have the TC Tracker. Ask your administrator.</div>'; el('tabs').innerHTML=''; el('offbar').innerHTML=''; return; }
    if(!tab) tab=defaultTab();
    renderOffices(); renderTabs();
    if(!loaded){ el('view').innerHTML='<div class="empty">Loading…</div>'; return; }
    if(loadErr){ el('view').innerHTML='<div class="note warn">'+esc(loadErr)+' <button class="link" data-act="reload">Try again</button></div>'; return; }
    const v=({today:viewToday, calls:viewCalls, log:viewLog, numbers:viewNumbers, slots:viewSlots})[tab]||viewToday;
    el('view').innerHTML=v();
  }

  /* ---------------- Today ---------------- */
  function viewToday(){
    const d=today(), list=scoped().filter(r=>r.date===d).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
    const slots=slotsOn(d), missing=scoped().filter(r=>!r.outcome && r.date<d);
    const due=TC.callList(scoped(), d).filter(x=>TC.DUE.indexOf(x.a)>=0);
    const needDate=TC.callList(scoped(), d).filter(x=>TC.NEEDS_DATE.indexOf(x.a)>=0).length;
    const multi=inView().length>1;
    let h='<div class="stack">';
    const noUsual=inView().some(o=>!TC.usualOn(SLOTS[o]||{}, d) && !((SLOTS[o]||{}).days||{})[d]);
    const closedToday=!slots && inView().every(o=>!isOpenFn(o)(d));
    h+='<div class="todayhead"><div><h2>'+esc(fmtD(d))+'</h2><div class="capline">'+
      (slots?'<b>'+list.length+'</b> of <b>'+slots+'</b> consult slots booked':'<b>'+list.length+'</b> consult'+(list.length===1?'':'s')+' today')+
      (slots?'':closedToday?' · closed today on the Schedule':noUsual?' · <button class="link" data-act="tab" data-v="slots">set your usual slots</button>':'')+'</div></div>'+
      (canEdit()?'<button class="btn big" data-act="new">＋ Log a consult</button>':'')+'</div>';
    if(missing.length) h+='<div class="note warn">⚠️ <b>'+missing.length+' earlier consult'+(missing.length===1?' has':'s have')+' no outcome.</b> '+
      missing.slice(0,4).map(r=>'<button class="link"'+attr('act','open')+attr('id',r.id)+'>'+esc(r.name)+' ('+esc(fmtS(r.date))+')</button>').join(', ')+(missing.length>4?' …':'')+'</div>';
    h+='<div class="card"><h2>Today’s consults</h2><p class="sub">'+(canEdit()?'Tap the outcome when the consult is done. Only the questions that fit that outcome come up.':'What’s been logged today.')+'</p>';
    if(!list.length) h+='<div class="empty">Nothing logged for today yet.'+(canEdit()?' Use <b>Log a consult</b> for each new patient on the schedule, no-shows included.':'')+'</div>';
    else h+='<div class="clist">'+list.map(r=>
      '<div class="crow"><div class="tm">'+esc(fmtT(r.time)||'—')+'</div>'+
      '<div class="who"><button class="nm"'+attr('act','open')+attr('id',r.id)+'>'+esc(r.name||'(no name)')+'</button>'+payTag(r)+
      '<div class="meta">'+[r.type, r.lead, multi?r.office:'', r.tc].filter(Boolean).map(esc).join(' · ')+'</div></div>'+
      '<div class="quick">'+(r.outcome||!canEdit() ? ocBadge(r.outcome) :
        outcomesFor(r).map(o=>'<button class="qb"'+attr('act','outcome')+attr('id',r.id)+attr('v',o)+'>'+esc(ocShort(o))+'</button>').join(''))+'</div></div>').join('')+'</div>';
    h+='</div>';
    h+='<div class="card duecard"><div class="big">'+due.length+'</div><div class="grow"><b>follow-up'+(due.length===1?'':'s')+' due</b>'+
      (needDate?'<div class="small muted">and '+needDate+' waiting for a date</div>':'<div class="small muted">pending, pre-TX hold, Medicaid, no-show, observation and recall patients</div>')+'</div>'+
      '<button class="btn ghost" data-act="tab" data-v="calls">Open the call list →</button></div>';
    h+='</div>';
    return h;
  }

  /* ---------------- Call list ---------------- */
  function actClass(a){ return a==='Scheduled to start' ? 'act-recall' : TC.DUE.indexOf(a)>=0 ? (a==='Recall ready'?'act-recall':'act-due') : TC.NEEDS_DATE.indexOf(a)>=0 ? 'act-set' : 'act-later'; }
  function fuCard(x){
    const r=x.r, a=x.a, d=today(), wait=TC.daysWaiting(r, d), calledToday=r.lastContact===d;
    const B=(act,label)=>canEdit()?'<button class="btn sm '+(act==='declined'?'danger':'ghost')+'"'+attr('act','fu')+attr('id',r.id)+attr('v',act)+'>'+label+'</button>':'';
    let btns='';
    if(a==='Pending follow-up due' || a==='Pending - future follow-up' || a==='Recall ready')
      btns=B('called','📞 Called')+B('scheduled','📅 Scheduled to start')+B('started','✅ Started')+B('declined','✖ Declined');
    else if(a==='Set pending follow-up date' || a==='Set observation review date')
      btns=B('setDate','📆 Set the date')+(a==='Set pending follow-up date'?B('started','✅ Started')+B('declined','✖ Declined'):B('ready','🟢 Ready now'));
    else if(a==='No-show follow-up')
      btns=B('called','📞 Called')+B('rebooked','🔁 Rebooked')+B('declined','✖ Not coming');
    else if(a==='Observation review due' || a==='Observation - future review')
      btns=B('reviewed','👁 Reviewed')+B('ready','🟢 Ready now')+B('declined','✖ Declined');
    else if(a==='Pre-TX hold due' || a==='Pre-TX hold - future')
      btns=B('called','📞 Called')+B('scheduled','✅ Cleared · scheduled')+B('started','✅ Started')+B('declined','✖ Declined');
    else if(a==='Set pre-TX hold date')
      btns=B('setDate','📆 Set the date')+B('scheduled','✅ Cleared · scheduled')+B('declined','✖ Declined');
    else if(a==='Medicaid decision due' || a==='Waiting on Medicaid')
      btns=B('called','📞 Checked')+B('approved','👍 Approved')+B('denied','👎 Denied')+B('declined','✖ Declined');
    else if(a==='Set Medicaid check date')
      btns=B('setDate','📆 Set the date')+B('approved','👍 Approved')+B('denied','👎 Denied');
    else if(a==='Scheduled to start')
      btns=B('started','✅ Started')+B('declined','✖ Not starting');
    const facts=[
      r.phone?'<span>📞 <a class="tel" href="tel:'+esc(String(r.phone).replace(/[^\d+]/g,''))+'">'+esc(r.phone)+'</a></span>':'',
      '<span>Consult <b>'+esc(fmtS(r.date))+'</b></span>',
      '<span>'+ocBadge(r.outcome)+(r.reason?' · '+esc(r.reason):'')+'</span>',
      r.nextFU && ['Pending','Pre-TX Hold','Submitted to Medicaid'].indexOf(r.outcome)>=0?'<span>'+(r.outcome==='Submitted to Medicaid'?'Check with Medicaid':'Next call')+' <b>'+esc(fmtS(r.nextFU))+'</b></span>':'',
      r.obsReview && r.outcome==='Observation'?'<span>Review <b>'+esc(fmtS(r.obsReview))+'</b></span>':'',
      r.lastContact?'<span>Last contact <b>'+esc(fmtS(r.lastContact))+'</b></span>':'',
      wait!=null?'<span>Waiting <b>'+wait+'</b> day'+(wait===1?'':'s')+'</span>':'',
      inView().length>1?'<span>📍 '+esc(r.office)+'</span>':'',
      r.tc?'<span>'+esc(r.tc)+'</span>':''
    ].filter(Boolean).join('');
    return '<div class="fu'+(calledToday?' called':'')+'"><div><span class="act '+actClass(a)+'">'+esc(a)+'</span>'+
      (calledToday?'<span class="tag">✓ contacted today</span>':'')+
      '<div><button class="nm"'+attr('act','open')+attr('id',r.id)+'>'+esc(r.name||'(no name)')+'</button>'+payTag(r)+'</div>'+
      '<div class="facts">'+facts+'</div>'+(r.notes?'<div class="notes">“'+esc(r.notes)+'”</div>':'')+'</div>'+
      '<div class="btns">'+btns+'</div></div>';
  }
  function viewCalls(){
    const d=today(), all=TC.callList(scoped(), d);
    // Already contacted today sinks to the bottom of its group - still listed, as in the sheet.
    const sinkCalled=a=>a.slice().sort((x,y)=>(x.r.lastContact===d)-(y.r.lastContact===d));
    const due=sinkCalled(all.filter(x=>TC.DUE.indexOf(x.a)>=0));
    const set=all.filter(x=>TC.NEEDS_DATE.indexOf(x.a)>=0);
    const later=all.filter(x=>TC.DUE.indexOf(x.a)<0 && TC.NEEDS_DATE.indexOf(x.a)<0);
    /* Scheduled to start: off the sheet's queue, but their start has to be recorded - the
       conversion counts starts by the month treatment begins (Selene, 16/10). */
    const sched=scoped().filter(r=>TC.live(r) && r.fuStatus==='Scheduled to start').map(r=>({r, a:'Scheduled to start'}));
    let h='<div class="stack">';
    h+='<div class="note info">The call list fills itself from the consults. The buttons fill in the follow-up columns (last contact, status, follow-up complete) for you.</div>';
    h+='<div><div class="sect">Due now · '+due.length+'</div>'+(due.length?due.map(fuCard).join(''):'<div class="empty">Nobody is due. 🎉</div>')+'</div>';
    if(set.length) h+='<div><div class="sect">Needs a date · '+set.length+'</div>'+set.map(fuCard).join('')+'</div>';
    if(sched.length) h+='<div><div class="sect">Scheduled to start · '+sched.length+' · tap Started on the day they start</div>'+sched.map(fuCard).join('')+'</div>';
    if(later.length) h+='<details class="later"><summary>▸ Coming up later · '+later.length+'</summary>'+later.map(fuCard).join('')+'</details>';
    h+='</div>';
    return h;
  }

      days.map(dt=>{ const n=TC.slotsOn(rec, dt, open, u), changed=rec.days && Object.prototype.hasOwnProperty.call(rec.days, dt), b=booked(dt);
        const label=n?n:(!changed && dt>u && open(dt))?'—':'Closed';
        return '<button class="day'+(n?'':' closed')+(changed?' changed':'')+(dt===d?' today':'')+'"'+(ed?attr('act','day')+attr('v',dt):' disabled')+' aria-label="'+esc(fmtD(dt)+': '+(n?n+' slots':label==='—'?'not set yet':'closed'))+'">'+
          '<span class="d">'+(+dt.slice(8))+'</span><span class="s">'+label+'</span>'+(b?'<span class="b">'+b+' booked</span>':'')+'</button>'; }).join('')+'</div>'+
      '<p class="small muted" style="margin:10px 0 0">A teal outline means the day was changed by hand. “—” is a month that hasn’t started: it gets the usual number on the 1st.'+(ed?' Tap a day to change it.':'')+'</p></div></div>';
    return h;
  }

  /* ---------------- dialogs ---------------- */
  let DLG=null;
  function openDlg(d){ DLG=d; drawDlg(); el('dlg').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeDlg(){ talkAbort(); DLG=null; el('dlg').classList.remove('open'); el('dlgcard').innerHTML=''; document.body.style.overflow=''; }
  const top=t=>'<div class="dm-top"><h3>'+t+'</h3><button class="x" data-act="close" aria-label="Close">×</button></div>';
  function chips(field, list, val, extraCls){
    return '<div class="chips">'+list.map(v=>'<button type="button" class="chip'+(extraCls?' '+extraCls+' o-'+ocClass(v).slice(3):'')+(val===v?' on':'')+'"'+attr('act','pick')+attr('f',field)+attr('v',v)+'>'+esc(extraCls?ocShort(v):v)+'</button>').join('')+'</div>';
  }
  function yesNo(field, val){ return chips(field, ['Yes','No'], val); }
  function quickDates(field, base, opts){
    return '<div class="chips">'+opts.map(o=>'<button type="button" class="chip'+(DLG.rec[field]===o[1]?' on':'')+'"'+attr('act','pick')+attr('f',field)+attr('v',o[1])+'>'+esc(o[0])+'</button>').join('')+
      '<input type="date" style="width:auto;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font:inherit"'+attr('in','rec')+attr('f',field)+' value="'+esc(DLG.rec[field]||'')+'" aria-label="Pick a date"></div>';
  }
  const fuDates=b=>[['In 2 days',TC.addDays(b,2)],['In 1 week',TC.addDays(b,7)],['In 2 weeks',TC.addDays(b,14)]];
  const obsDates=b=>[['3 months',TC.addMonths(b,3)],['6 months',TC.addMonths(b,6)],['12 months',TC.addMonths(b,12)]];
  const medDates=b=>[['In 1 week',TC.addDays(b,7)],['In 2 weeks',TC.addDays(b,14)],['In 30 days',TC.addDays(b,30)]];
  function field(label, f, type, opts){
    opts=opts||{}; const v=DLG.rec[f]||'', ro=DLG.ro?' readonly':'';
    const inp=type==='textarea' ? '<textarea'+attr('in','rec')+attr('f',f)+ro+'>'+esc(v)+'</textarea>'
      : '<input type="'+type+'"'+attr('in','rec')+attr('f',f)+' value="'+esc(v)+'"'+ro+(opts.ph?' placeholder="'+esc(opts.ph)+'"':'')+(opts.auto?' autocomplete="'+opts.auto+'"':'')+'>';
    return '<div class="fld'+(opts.full?' full':'')+'"><label>'+label+(opts.req?' <span class="req">*</span>':'')+'</label>'+inp+'</div>';
  }
  /* NOTES, WITH TALK (17/10). Cory: a button that uses their computer or phone to record - talk
     -> text. Tap Talk, talk, the words type themselves into Notes (TC.talkText / joinTalk); tap
     Stop, fix any word by typing. Only the words are kept, never audio. Chrome, Edge and Safari,
     computers and phones; where the browser can't (Firefox, some in-app browsers) a phone gets a
     tip about its keyboard's own microphone instead. */
  const SR=()=>window.SpeechRecognition||window.webkitSpeechRecognition||null;
  const touch=()=>('ontouchstart' in window)||navigator.maxTouchPoints>0;
  let TALK=null;
  const notesBox=()=>document.querySelector('#dlgcard [data-in="rec"][data-f="notes"]');
  function notesField(){
    const ro=DLG.ro, on=!!TALK, side=ro ? '' : SR()
      ? '<button type="button" class="talk'+(on?' on':'')+'" data-act="talk" aria-pressed="'+on+'">'+(on?'\u25a0 Stop':'\ud83c\udfa4 Talk')+'</button>'
      : (touch() ? '<span class="small muted">Tip: your keyboard\u2019s \ud83c\udfa4 works here</span>' : '');
    return '<div class="fld full"><div class="lab-row"><label for="f-notes">Notes</label>'+side+'</div>'+
      '<textarea id="f-notes"'+attr('in','rec')+attr('f','notes')+(ro||on?' readonly':'')+(on?' class="listening"':'')+'>'+esc(DLG.rec.notes||'')+'</textarea>'+
      '<div class="talk-st" id="talkst" aria-live="polite">'+(on?'<span class="rec-dot"></span>Listening\u2026 talk now, then tap Stop.':'')+'</div></div>';
  }
  function talkWrite(){
    const t=TALK; if(!t || !DLG) return;
    const txt=TC.joinTalk(t.base, t.fin+' '+t.int);
    DLG.rec.notes=txt;
    const box=notesBox(); if(box && box.value!==txt){ box.value=txt; box.scrollTop=box.scrollHeight; }
  }
  function talkPaint(){
    const on=!!TALK, b=document.querySelector('#dlgcard [data-act="talk"]'), st=el('talkst'), box=notesBox();
    if(b){ b.classList.toggle('on', on); b.textContent=on?'\u25a0 Stop':'\ud83c\udfa4 Talk'; b.setAttribute('aria-pressed', String(on)); }
    if(st) st.innerHTML=on?'<span class="rec-dot"></span>Listening\u2026 talk now, then tap Stop.':'';
    if(box){ box.classList.toggle('listening', on); box.readOnly=on || !!(DLG && DLG.ro); }
  }
  function talkStart(){
    const C=SR(); if(!C || !DLG || DLG.ro || TALK) return;
    let rec; try{ rec=new C(); }catch(_){ toast(TC.talkError(''), true); return; }
    rec.lang='en-US'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    const box=notesBox(), t={rec, base:box ? box.value : (DLG.rec.notes||''), fin:'', int:'', waits:[]};
    rec.onresult=e=>{
      if(TALK!==t) return;
      const list=[]; for(let i=0;i<e.results.length;i++){ const x=e.results[i]; if(x && x[0]) list.push({t:x[0].transcript, final:!!x.isFinal}); }
      const w=TC.talkText(list); t.fin=w.fin; t.int=w.int; talkWrite();
    };
    rec.onerror=e=>{ const c=e && e.error; if(c && c!=='aborted') toast(TC.talkError(c), true); };
    rec.onend=()=>{ if(TALK!==t) return; t.int=''; talkWrite(); TALK=null; talkPaint(); t.waits.splice(0).forEach(f=>f()); };
    TALK=t;
    try{ rec.start(); }catch(_){ TALK=null; toast(TC.talkError(''), true); return; }
    talkPaint();
  }
  function talkStop(){ if(TALK){ try{ TALK.rec.stop(); }catch(_){} } }
  // Closing the form while talking: stop listening, keep nothing that wasn't saved.
  function talkAbort(){
    const t=TALK; if(!t) return; TALK=null;
    try{ t.rec.onresult=null; t.rec.onend=null; t.rec.onerror=null; t.rec.abort(); }catch(_){}
    t.waits.splice(0).forEach(f=>f());
  }
  // Save while talking: stop, wait for the last words (2.5 s at most), then save.
  function talkFinish(){
    const t=TALK; if(!t) return Promise.resolve();
    return new Promise(res=>{ t.waits.push(res); talkStop(); setTimeout(res, 2500); });
  }
  function select(label, f, list, opts){
    opts=opts||{}; const v=DLG.rec[f]||'';

    h+='<div class="grp"><div class="gl">Outcome</div>'+(ro?ocBadge(r.outcome):

  function problems(r){
    if(!r.office) return 'Pick the office.';
    if(!String(r.name||'').trim()) return 'Type the patient’s full name.';
    if(!TC.parse(r.date)) return 'Pick the consult date.';
    if(r.outcome==='Started' && !r.sameDay) return 'Say whether the contract was signed today.';
    if(r.outcome==='Pending' && !r.reason) return 'Pick why it’s pending.';
    if(takesMed(r.office) && !r.payer) return 'Pick Medicaid or private pay.';
    if(r.outcome==='Submitted to Medicaid' && r.payer!=='Medicaid') return '“Submitted to Medicaid” is only for Medicaid patients.';
    if(r.outcome==='Pre-TX Hold' && !r.reason) return 'Pick what they’re waiting on.';
    return '';
  }

    return top('TC Tracker settings')+'<div class="dm-body">'+(d.err?'<div class="err">'+esc(d.err)+'</div>':'')+
      '<div class="grp"><div class="gl">Offices that take Medicaid</div><div class="chk">'+allOffices().map(o=>
        '<label><input type="checkbox"'+attr('act','med-toggle')+attr('v',o)+(d.medicaid.indexOf(o)>=0?' checked':'')+'> '+esc(o)+'</label>').join('')+'</div>'+
        '<div class="small muted" style="margin-top:6px">These offices ask “Medicaid or private pay?” on every consult, and their numbers show both.</div></div>'+
      '<div class="small muted">Outcomes and follow-up statuses are fixed &mdash; the numbers are worked out from them. These lists are just labels.</div>'+
      '<div class="fields">'+ta('types','Consult types')+ta('reasons','Pending reasons')+ta('holdReasons','Pre-TX hold reasons')+ta('leads','Lead sources')+'</div></div>'+
      '<div class="dm-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="lists-save">Save settings</button></div>';
  }
  function drawDlg(){
    if(!DLG) return;
    const card=el('dlgcard'), y=el('dlg').scrollTop;
    card.className='dmc'+(DLG.kind==='consult'?'':' narrow');
    card.innerHTML=({consult:consultForm, fu:fuDlg, slot:slotDlg, lists:listsDlg, usual:usualDlg})[DLG.kind]();
    el('dlg').scrollTop=y;
  }
  function newConsult(){
    const offs=myOffices(), o=office || (offs.length===1?offs[0]:''), t=o?defaultTC(o):{name:'',mail:''};
    openDlg({kind:'consult', isNew:true, rec:{id:TC.newId(), office:o, date:today(), time:'', name:'', dob:'', phone:'', chart:'',
      type:'', lead:'', outcome:'', payer:'', tc:t.name, tcMail:t.mail, notes:'', by:myMail()||myName(), at:new Date().toISOString()}});
    setTimeout(()=>{ const n=document.querySelector('[data-f="name"]'); if(n && o) n.focus(); }, 30);
  }
  function openConsult(id, outcome){
    const r=ALL.find(x=>x.id===id); if(!r) return;
    const rec=Object.assign({}, r);
    if(outcome){ TC.setOutcome(rec, outcome); if(outcome==='Started' && !rec.rpi) rec.rpi='No'; }
    openDlg({kind:'consult', isNew:false, ro:!canEdit(), rec, origKey:keyOf(r), origOutcome:r.outcome||''});
  }
  function saveConsult(){
    const d=DLG, r=d.rec;
    r.name=String(r.name||'').trim();
    const why=problems(r); if(why){ d.err=why; drawDlg(); return; }
    d.busy=true; d.err=''; drawDlg();
    const jobs=[persist(r, d.isNew?null:d.origKey)];
    if(r.outcome==='Rescheduled / Cancelled' && d.newDate) jobs.push(persist(copyFor(r, d.newDate, d.newTime, 'Rescheduled from '+fmtS(r.date)), null));
    Promise.all(jobs).then(()=>{ closeDlg(); render(); toast(d.isNew?'✓ Consult saved':'✓ Saved'); },
      e=>{ d.busy=false; d.err='It didn’t save: '+((e && e.message)||'try again')+'. Nothing was lost - your typing is still here.'; drawDlg(); });
  }
  function copyFor(r, date, time, note){
    const t=defaultTC(r.office);
    return {id:TC.newId(), office:r.office, date, time:time||'', name:r.name, dob:r.dob||'', phone:r.phone||'', chart:r.chart||'',
      type:r.type||'', lead:r.lead||'', outcome:'', payer:r.payer||'', tc:r.tc||t.name, tcMail:r.tcMail||t.mail, notes:note, by:myMail()||myName(), at:new Date().toISOString()};
  }
  function saveFu(){
    const d=DLG, r=Object.assign({}, ALL.find(x=>x.id===d.id)||{}); if(!r.id) return closeDlg();
    const t=today(), x=d.rec, jobs=[];
    if(d.what==='called') TC.DO.called(r, t, x.nextFU||x.obsReview||'');
    else if(d.what==='setDate'){ const v=x.nextFU||x.obsReview; if(!v){ d.err='Pick a date.'; return drawDlg(); } TC.DO.setDate(r, v); }
    else if(d.what==='reviewed'){ if(!x.obsReview){ d.err='Pick the next review date.'; return drawDlg(); } TC.DO.reviewed(r, t, x.obsReview); }
    else if(d.what==='started') TC.DO.started(r, t, x.startDate||t, x.rpi);
    else if(d.what==='rebooked'){ if(!TC.parse(x.newDate)){ d.err='Pick the new consult date.'; return drawDlg(); } TC.DO.rebooked(r, t); jobs.push(persist(copyFor(r, x.newDate, x.newTime, 'Rebooked after no-show on '+fmtS(r.date)), null)); }
    else if(d.what==='denied') TC.DO.denied(r, t, x.nextFU||'');
    else TC.DO[d.what](r, t);
    d.busy=true; d.err=''; drawDlg();
    Promise.all([persist(r, keyOf(r))].concat(jobs)).then(()=>{ closeDlg(); render(); toast('✓ '+r.name+' updated'); },
      e=>{ d.busy=false; d.err='It didn’t save: '+((e && e.message)||'try again'); drawDlg(); });
  }
  function download(){
    const rows=scopedTC().filter(r=>TC.inMonth(r.date, month));
    const blob=new Blob(['﻿'+TC.csv(rows, today())], {type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='TC Consults '+(office||'All offices')+' '+month+'.csv'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------------- one handler for every button ---------------- */
  document.addEventListener('click', e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.tagName==='DETAILS') return;                 // the details toggle reports itself below
    const act=b.dataset.act, v=b.dataset.v;
    if(act==='tab'){ tab=v; render(); window.scrollTo({top:0}); return; }
    if(act==='office'){ office=v||null; render(); return; }
    if(act==='month'){ month=TC.shiftMonth(month, Number(v)); render(); return; }
    if(act==='reload'){ loaded=false; render(); load(); return; }
    if(act==='new'){ newConsult(); return; }
    if(act==='open'){ openConsult(b.dataset.id); return; }
    if(act==='outcome'){ openConsult(b.dataset.id, v); return; }
    if(act==='fu'){
      const r=ALL.find(x=>x.id===b.dataset.id); if(!r) return;
      openDlg({kind:'fu', id:r.id, what:v, rec:{rpi:'', startDate:today()}}); return;
    }
    if(act==='close'){ closeDlg(); return; }
    if(act==='pick' && DLG){
      const f=b.dataset.f;
      if(DLG.kind==='consult' && f==='outcome'){
        TC.setOutcome(DLG.rec, v); if(v==='Started' && !DLG.rec.rpi) DLG.rec.rpi='No';
        // Pending and Pre-TX Hold have different reasons: keep one only if it belongs to the new outcome.
        const list=v==='Pre-TX Hold'?LISTS.holdReasons:v==='Pending'?LISTS.reasons:null;
        if(list && DLG.rec.reason && list.indexOf(DLG.rec.reason)<0) DLG.rec.reason='';
      }
      else if(DLG.kind==='consult' && f==='office'){ DLG.rec.office=v; const t=defaultTC(v); DLG.rec.tc=t.name; DLG.rec.tcMail=t.mail; }
      else if(DLG.kind==='consult' && f==='rpi'){ DLG.rec.rpi=v; if(v==='Yes' && !DLG.rec.rpiDate) DLG.rec.rpiDate=DLG.rec.date||today(); if(v==='No') DLG.rec.rpiDate=''; }
      else DLG.rec[f]=(DLG.rec[f]===v && f!=='outcome')?'':v;   // tap again to clear a choice
      DLG.err=''; drawDlg(); return;
    }
    if(act==='talk'){ if(TALK) talkStop(); else talkStart(); return; }
    if(act==='save'){ if(DLG.saving) return; DLG.saving=true; const d0=DLG;
      talkFinish().then(()=>{ d0.saving=false; if(DLG===d0) saveConsult(); }); return; }
    if(act==='del'){ DLG.confirmDel=true; drawDlg(); return; }
    if(act==='del-no'){ DLG.confirmDel=false; drawDlg(); return; }
    if(act==='del-yes'){
      const r=Object.assign({}, DLG.rec, {deleted:true});
      persist(r, DLG.origKey).then(()=>{ closeDlg(); render(); toast('Consult deleted'); }, e=>{ DLG.err='It didn’t delete: '+((e&&e.message)||'try again'); DLG.confirmDel=false; drawDlg(); });
      return;
    }
    if(act==='fu-save'){ saveFu(); return; }
    if(act==='usual'){ const o=inView()[0]; saveSlots(o, s=>{ TC.setUsual(s, Number(v), today()); }).then(()=>{ render(); toast('✓ '+v+' slots on an open day'); }, e=>toast('It didn’t save: '+e.message, true)); return; }
    if(act==='usual-other'){ const o=inView()[0]; openDlg({kind:'usual', office:o, other:String((SLOTS[o]||{}).usual||'')}); return; }
    if(act==='day'){ openDlg({kind:'slot', office:inView()[0], date:v}); return; }
    if(act==='slot-set'){ setDay(Number(v)); return; }
    if(act==='slot-other'){
      const n=Number(DLG.other); if(!(n>=0 && n<=40) || DLG.other===undefined || DLG.other===''){ DLG.err='Type a number from 0 to 40.'; drawDlg(); return; }
      if(DLG.kind==='usual'){ const d=DLG; saveSlots(d.office, s=>{ TC.setUsual(s, n, today()); }).then(()=>{ closeDlg(); render(); toast('✓ '+n+' slots on an open day'); }, e=>{ d.err=e.message; drawDlg(); }); return; }
      setDay(n); return;
    }
    if(act==='slot-reset'){ const d=DLG; saveSlots(d.office, s=>{ delete s.days[d.date]; }).then(()=>{ closeDlg(); render(); }, e=>{ d.err=e.message; drawDlg(); }); return; }
    if(act==='lists'){ openDlg({kind:'lists', types:LISTS.types.join('\n'), reasons:LISTS.reasons.join('\n'), holdReasons:LISTS.holdReasons.join('\n'),
      leads:LISTS.leads.join('\n'), medicaid:TC.medicaidOffices(LISTS).slice()}); return; }
    if(act==='med-toggle' && DLG && DLG.kind==='lists'){ const i=DLG.medicaid.indexOf(v); if(i>=0) DLG.medicaid.splice(i,1); else DLG.medicaid.push(v); return; }
    if(act==='lists-save'){
      const d=DLG, clean=t=>[...new Set(String(t||'').split('\n').map(x=>x.trim()).filter(Boolean))];
      const next={types:clean(d.types), reasons:clean(d.reasons), holdReasons:clean(d.holdReasons), leads:clean(d.leads), medicaid:d.medicaid.slice()};
      if(!next.types.length || !next.reasons.length || !next.holdReasons.length || !next.leads.length){ d.err='Each list needs at least one line.'; drawDlg(); return; }
      // Laid over the saved settings, so a field this page doesn't know about is kept.
      PH_STORE.update(TC.LISTS_KEY, cur=>Object.assign({}, (cur && typeof cur==='object')?cur:{}, next))
        .then(r=>{ if(r && (r.blocked||r.error)) throw new Error(r.why||r.error); LISTS=Object.assign({}, TC.DEFAULT_LISTS, (r && r.value) || next); closeDlg(); render(); toast('✓ Settings saved'); },
          e=>{ d.err='It didn’t save: '+e.message; drawDlg(); });
      return;
    }
    if(act==='csv'){ download(); return; }
    if(act==='demo-reset'){ if(LIVE()) return; seedDemo(true); loaded=false; render(); load().then(()=>toast('Sample data reset')); return; }
  });
  function usualDlg(){
    const d=DLG;
    return top('Usual slots · '+esc(d.office))+'<div class="dm-body">'+(d.err?'<div class="err">'+esc(d.err)+'</div>':'')+
      '<div class="fld"><label>Consult slots on an open day</label><input type="number" min="0" max="40"'+attr('in','dlg')+attr('f','other')+' value="'+esc(d.other||'')+'"></div></div>'+
      '<div class="dm-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="slot-other">Save</button></div>';
  }
  function setDay(n){
    const d=DLG, o=d.office;
    saveSlots(o, s=>{ s.days[d.date]=n; }).then(()=>{ closeDlg(); render(); toast('✓ '+fmtS(d.date)+': '+(n?n+' slots':'closed')); }, e=>{ d.err=e.message; drawDlg(); });
  }
  // Typing: kept in the dialog's state without redrawing, so the cursor stays put.
  document.addEventListener('input', e=>{
    const t=e.target, k=t.dataset && t.dataset.in; if(!k) return;
    if(k==='q'){ q=t.value; const pos=t.selectionStart; render(); const n=document.querySelector('[data-in="q"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } return; }
    if(!DLG) return;
    if(k==='rec') DLG.rec[t.dataset.f]=t.value;
    else if(k==='dlg') DLG[t.dataset.f]=t.value;
  });
  document.addEventListener('change', e=>{
    const t=e.target, k=t.dataset && t.dataset.in; if(!k) return;
    if(k==='tcf'){ tcFilter=t.value; render(); return; }
    if(k==='ocf'){ ocFilter=t.value; render(); return; }
    if(k==='rec' && DLG && t.tagName==='SELECT'){ DLG.rec[t.dataset.f]=t.value; if(t.dataset.f==='tc'){ const x=tcsFor(DLG.rec.office).find(y=>y.name===t.value); DLG.rec.tcMail=x?x.mail:''; } drawDlg(); }
  });
  document.addEventListener('toggle', e=>{ if(DLG && e.target.matches && e.target.matches('details.more')) DLG.moreOpen=e.target.open; }, true);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && DLG) closeDlg(); });
  el('dlg').addEventListener('click', e=>{ if(e.target===el('dlg')) closeDlg(); });

  /* ---------------- sandbox: try it as ---------------- */
  el('persona').innerHTML=Object.keys(ROLES).map(k=>'<option value="'+k+'"'+(k===tryAs?' selected':'')+'>'+esc(ROLES[k].label)+'</option>').join('');
  el('persona').addEventListener('change', function(){
    if(LIVE()) return;
    tryAs=this.value; try{ localStorage.setItem('ph_tc_as', tryAs); }catch(_){}
    tab=null; office=null; tcFilter=''; q=''; ocFilter=''; loaded=false; render(); load();
  });

  /* ---------------- start ---------------- */
  function boot(){ render(); load(); }
  window.TCPAGE={render, reload:load, identity:()=>{ tab=null; office=null; render(); }};
  if(!LIVE() || window.PH_AUTH) boot();
  else document.addEventListener('ph-signed-in', boot, {once:true});
})();
</script>
<script>PH.nav('tc');PH.dechrome();document.addEventListener('ph-signed-in',function(){PH.mount();PH.dechrome();if(PH.reloadPeople)PH.reloadPeople();if(PH.reloadAccess)PH.reloadAccess();if(window.TCPAGE)TCPAGE.identity();});document.addEventListener('ph-identity',function(){if(window.TCPAGE)TCPAGE.identity();});</script>
