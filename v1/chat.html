<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-Brace · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.png?v=2" type="image/png">
<meta name="theme-color" content="#0F2A4A">

<!-- CHAT - A MOCK-UP for Heather and Dr. Jae (22/10/2026), sandbox only (user.js NAV: the header's chat button and
     the page are off on the live site). It opens from the chat button beside the bell, not a tab. The chat gets the
     whole screen: no page title, alerts inside the chat list, no Tour & Feedback button (Cory, 22/10). Dr. Jae asked for "communications in Home-Brace" with videos; Cory: they want "the whole
     thing in Home-Brace" - replying to messages, sending and viewing videos, alerts. The plan it shows: Microsoft
     Teams as the engine underneath (free with their Microsoft 365, messages and videos kept in their own Microsoft
     365), everything done inside Home-Brace, phone alerts sent by Home-Brace itself, live calls opening Teams.
     Made-up people, messages, videos and photo (chat-demo/). Nothing is sent anywhere; a video you record stays
     in this browser tab. -->
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff; --bad:#D7503A; --amber-soft:#FFF4E2;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.16); --maxw:1180px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .ribbon{background:#F2A03D;color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark img{width:34px;height:34px;display:block;border-radius:50%}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:#9fb4d0}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:#cdd9ea;font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:16px 20px 0}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--teal-600)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600}
  .btn.ghost:hover{border-color:var(--teal);background:var(--teal-soft)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* the "turn on alerts" strip */
  /* alerts, in the chat list itself (Cory: "can't the turn on alerts be on the chat itself?") */
  .alertbar{display:flex;align-items:center;gap:8px;background:var(--teal-soft);border-radius:10px;padding:6px 6px 6px 10px;font-size:13px;color:var(--navy)}
  .alertbar .grow{flex:1;min-width:0}
  .alertbar .btn.sm{padding:5px 10px;font-size:12.5px}
  .alertbar.on{background:#E7F6EE}

  /* the chat app: the list beside the conversation (a phone shows one at a time) */
  .chatapp{display:grid;grid-template-columns:330px minmax(0,1fr);height:max(300px, calc(100vh - 182px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#FBFCFD}
  .list-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:#fff}
  .list-top .row{display:flex;align-items:center;gap:8px}
  .list-top h1{margin:0;font-size:18px;color:var(--navy);flex:1}
  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#F7F9FB}
  .search:focus{outline:2px solid var(--teal2);background:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .items{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
  .ci{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #EEF1F5;padding:11px 14px;cursor:pointer;font:inherit;color:inherit}
  .ci:hover{background:#F2F6F9}
  .ci.on{background:var(--teal-soft)}
  .ci .mid{flex:1;min-width:0}
  .ci .nm,.ci .pv{display:block}
  .ci .nm{font-weight:700;color:var(--navy);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci .pv{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci.unread .pv{color:var(--ink);font-weight:600}
  .ci .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
  .ci .tm{font-size:11.5px;color:var(--soft)}
  .badge{background:var(--teal);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
  .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex:none}
  .av.sm{width:30px;height:30px;font-size:11.5px}
  .av svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .conv{display:flex;flex-direction:column;min-height:0;min-width:0}
  .conv-top{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
  .conv-top .who{flex:1;min-width:0}
  .conv-top .who b{display:block;color:var(--navy);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-top .who span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{display:none;background:none;border:none;font-size:24px;line-height:1;color:var(--navy);cursor:pointer;padding:2px 6px}
  .msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:#F4F7FA}
  .day{align-self:center;font-size:11.5px;font-weight:700;color:var(--soft);background:#E7EDF3;border-radius:999px;padding:3px 10px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .m{display:flex;gap:8px;align-items:flex-end;max-width:78%}
  .m.me{align-self:flex-end;flex-direction:row-reverse}
  .m .col{display:flex;flex-direction:column;gap:3px;min-width:0}
  .m.me .col{align-items:flex-end}
  .m .from{font-size:12px;font-weight:700;color:var(--soft);margin:4px 0 0 2px}
  .bub{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:8px 12px;font-size:14.5px;color:var(--ink);white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(15,42,74,.04)}
  .m.me .bub{background:var(--teal);border-color:var(--teal);color:#fff;border-radius:16px 16px 5px 16px}
  .m .meta{font-size:11px;color:var(--soft);margin:0 4px}
  .media{position:relative;border-radius:14px;overflow:hidden;background:#0F2A4A;border:1px solid var(--line);max-width:260px;box-shadow:0 1px 2px rgba(15,42,74,.08)}
  .media.wide{max-width:340px}
  .media video,.media img{display:block;width:100%;height:auto;max-height:min(320px,45vh);object-fit:cover;background:#0F2A4A}
  .media.tall{width:fit-content}
  .media.tall video{width:auto;height:min(320px,45vh)}
  .media .play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;border:none;background:rgba(15,42,74,.62);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-left:4px}
  .media .play:hover{background:rgba(20,155,150,.9)}
  .media .dur{position:absolute;left:8px;bottom:8px;background:rgba(15,42,74,.72);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;display:flex;gap:5px;align-items:center}
  .media.playing .play,.media.playing .dur{display:none}

  .composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
  .composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px;max-height:120px;min-height:40px;background:#F7F9FB}
  .composer textarea:focus{outline:2px solid var(--teal2);background:#fff}
  .ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
  .ib:hover{border-color:var(--teal);background:var(--teal-soft)}
  .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ib.rec{color:#C2412D}
  .ib.send{background:var(--teal);border-color:var(--teal);color:#fff}
  .ib.send:hover{background:var(--teal-600)}
  .empty{margin:auto;text-align:center;color:var(--soft);font-size:14px;max-width:320px}

  /* dialogs, the phone alert, the toast */
  .dm{position:fixed;inset:0;background:rgba(15,42,74,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:60;overflow-y:auto}
  .dm.open{display:flex}
  .dmc{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:520px}
  .dm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .dm-top h3{margin:0;font-size:17px;color:var(--navy)}
  .x{background:none;border:none;font-size:24px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px}
  .dm-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14.5px}
  .dm-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
  .cam{position:relative;background:#0F2A4A;border-radius:12px;overflow:hidden;aspect-ratio:3/4;max-height:56vh;display:flex;align-items:center;justify-content:center}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .msg{color:#cdd9ea;text-align:center;padding:20px;font-size:14px}
  .cam .clock{position:absolute;top:10px;left:10px;background:rgba(194,65,45,.92);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;display:none}
  .cam.recording .clock{display:block}
  .tabs{display:flex;gap:6px}
  .steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding-left:34px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .ui{display:inline-block;border:1px solid #cbd5e1;border-radius:7px;padding:0 7px;font-size:13px;font-weight:700;background:#fff;white-space:nowrap}
  .note{background:var(--teal-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;color:#0c5b57}
  .pick{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
  .pick button{display:flex;align-items:center;gap:10px;background:#fff;border:none;border-bottom:1px solid #EEF1F5;padding:9px 12px;cursor:pointer;text-align:left;font:inherit}
  .pick button:hover{background:var(--teal-soft)}
  .pick small{display:block;color:var(--soft);font-size:12px}
  .pick .grp{font-size:11.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 4px;background:#F7F9FB}
  /* a phone's alert, as Home-Brace would send it */
  .notif{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);width:min(380px,calc(100% - 24px));background:rgba(250,251,252,.97);backdrop-filter:blur(8px);border-radius:18px;box-shadow:0 12px 34px rgba(15,42,74,.28);padding:11px 14px;display:flex;gap:11px;align-items:flex-start;z-index:90;transition:transform .35s ease;cursor:pointer}
  .notif.on{transform:translate(-50%,0)}
  .notif img{width:36px;height:36px;border-radius:9px;flex:none}
  .notif .t{font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:8px}
  .notif b{display:block;font-size:14px;color:#111}
  .notif .x2{font-size:13.5px;color:#222}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1}

  @media(max-width:760px){
    .wrap{padding:10px 10px 0}
    html body{padding-bottom:0 !important}   /* the chat stops above the tab bar itself (fit) */
    .chatapp{grid-template-columns:minmax(0,1fr);height:max(280px, calc(100vh - 220px))}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}   /* above the phone tab bar */
    .chatapp .conv{display:none}
    .chatapp.open .list{display:none}
    .chatapp.open .conv{display:flex}
    .back{display:block}
    .m{max-width:88%}
  }
</style>
<script src="user.js?v=hc113"></script>

<body>
<div class="ribbon">MOCK-UP for Heather and Dr. Jae — made-up people, messages and videos. Nothing is sent anywhere.</div>
<header class="hdr">
  <div class="hdr-in">
    <span class="mark" aria-label="Home-Brace"><img src="../assets/logo-mark.png?v=2" alt="" width="34" height="34"></span>
    <span class="brand">Home-<i>Brace</i><small>Chat</small></span>
    <span class="v1">V1 preview</span>
  </div>
</header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>

<div class="wrap">
  <div class="chatapp" id="app">
    <aside class="list" aria-label="Your chats">
      <div class="list-top">
        <div class="row"><h1>Chats</h1><button class="btn sm" data-act="new">＋ New chat</button></div>
        <div class="alertbar" id="alertbar"></div>
        <input class="search" id="q" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
        <div class="chips" id="chips"></div>
      </div>
      <div class="items" id="items"></div>
    </aside>
    <section class="conv" id="conv" aria-label="Conversation"></section>
  </div>
</div>

<div class="dm" id="dlg" role="dialog" aria-modal="true"><div class="dmc" id="dlgcard"></div></div>
<div class="notif" id="notif" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*,video/*" hidden>

<script>
(function(){
  'use strict';
  const el=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ME='Priya Tatum';
  const COLORS=['#149B96','#6CB4F5','#F7A25E','#B49CFB','#F48C7F','#F27FC0','#6FD39A','#8FA2FF','#E0A800','#5B8DEF'];
  const colorOf=n=>{ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
  const initials=n=>n.replace(/^Dr\.\s*/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const ICON={office:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h6"/>',
              team:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 14.6c3 0 6 1.6 6 4.6"/>'};
  function avatar(c, sm){
    const cls='av'+(sm?' sm':'');
    if(c.type==='office' || c.type==='team') return '<span class="'+cls+'" style="background:'+(c.type==='office'?'#25456E':'#0F827E')+'"><svg viewBox="0 0 24 24">'+ICON[c.type]+'</svg></span>';
    return '<span class="'+cls+'" style="background:'+colorOf(c.name)+'">'+esc(initials(c.name))+'</span>';
  }
  const personAv=n=>'<span class="av sm" style="background:'+colorOf(n)+'">'+esc(initials(n))+'</span>';

  /* ---------- made-up chats. Times are "minutes ago" so the mock-up always looks current. ---------- */
  const now=Date.now(), ago=min=>now-min*60000;
  const CHATS=[
    {id:'c1', type:'office', name:'Carlsbad office', members:['Gabriela Garrison','Quinn Quill','Avery Brooks','Jordan Ellis','Sofia Navarro',ME], unread:2, msgs:[
      {from:'Jordan Ellis', at:ago(1500), text:'Is anyone grabbing lunch for the team on Friday?'},
      {from:ME, at:ago(1490), text:'I will - tacos again?'},
      {from:'Gabriela Garrison', at:ago(48), text:'Morning! Quick video on the new check-in steps before patients arrive 👇'},
      {from:'Gabriela Garrison', at:ago(47), video:'chat-demo/huddle.mp4', poster:'chat-demo/huddle.jpg', dur:'0:08', ar:'9/16'},
      {from:'Quinn Quill', at:ago(36), text:'Watched it. So the consent form comes first now?'},
      {from:'Gabriela Garrison', at:ago(31), text:'Yes - consent first, then the photos.'}]},
    {id:'c2', type:'person', name:'Dr. Clara Coleman', sub:'Doctor · Hobbs and Clovis', members:['Dr. Clara Coleman',ME], unread:1, msgs:[
      {from:ME, at:ago(1700), text:'Thanks for covering Clovis today.'},
      {from:'Dr. Clara Coleman', at:ago(62), text:'Here’s the new tray layout for Hobbs. What do you think?'},
      {from:'Dr. Clara Coleman', at:ago(61), photo:'chat-demo/trays.jpg', w:800, h:600}]},
    {id:'c3', type:'team', name:'Doctors', members:['Dr. Clara Coleman','Dr. Thornbury','Dr. Ashcombe','Dr. Fairbanks',ME], unread:0, msgs:[
      {from:ME, at:ago(1180), text:'November’s schedule is posted in Home-Brace.'},
      {from:'Dr. Thornbury', at:ago(1150), text:'Thanks! I’m off the 27th - already marked.'}]},
    {id:'c4', type:'office', name:'Cruces LCO office', members:['Logan Pratt','Ines Salazar','Hayden Moss','Carmen Ibarra','Dr. Ashcombe',ME], unread:0, msgs:[
      {from:'Hayden Moss', at:ago(2950), text:'Friday reminder for everyone 👇'},
      {from:'Hayden Moss', at:ago(2949), video:'chat-demo/reminder.mp4', poster:'chat-demo/reminder.jpg', dur:'0:06', wide:true, ar:'16/9'},
      {from:'Ines Salazar', at:ago(2900), text:'Got it 👍'}]},
    {id:'c5', type:'team', name:'Leadership Team', members:['Morgan Hale','Casey Webb','Skyler Bennett',ME], unread:0, msgs:[
      {from:'Casey Webb', at:ago(4300), text:'Payroll sheets are due Tuesday by 2 pm this week.'}]},
    {id:'c6', type:'person', name:'Quinn Quill', sub:'TC · Carlsbad', members:['Quinn Quill',ME], unread:0, msgs:[
      {from:ME, at:ago(4500), text:'Can you cover Clovis on Thursday?'},
      {from:'Quinn Quill', at:ago(4480), text:'Yes, I’ve got it.'}]}
  ];
  /* The header's chat button shows the same unread count, kept for this browser tab (user.js chatBadge). */
  try{ const s=sessionStorage.getItem('ph_chat_unread'); if(s){ const m=JSON.parse(s)||{}; CHATS.forEach(c=>{ c.unread=Number(m[c.id])||0; }); } }catch(_){}
  function saveUnread(){
    const m={}; CHATS.forEach(c=>{ if(c.unread) m[c.id]=c.unread; });
    try{ sessionStorage.setItem('ph_chat_unread', JSON.stringify(m)); }catch(_){}
    if(window.PH && PH.chatBadge) PH.chatBadge();
  }
  const REPLIES=['Got it, thanks!','👍','Perfect - see you there.','Watched it, makes sense.','On it.','Thank you!'];
  let open=null, filter='all', q='', alertsOn=false, recState=null, objectUrls=[], stick=true, ro=null;
  try{ alertsOn=localStorage.getItem('ph_chat_alerts')==='1'; }catch(_){}

  /* ---------- time, as a phone shows it ---------- */
  const dayKey=t=>{ const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
  const clock=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  function when(t){
    const d=new Date(t), today=new Date(), yest=new Date(); yest.setDate(today.getDate()-1);
    if(dayKey(t)===dayKey(today)) return clock(t);
    if(dayKey(t)===dayKey(yest)) return 'Yesterday';
    return d.toLocaleDateString('en-US',{weekday:'short'});
  }
  function dayLabel(t){
    const today=new Date(), yest=new Date(); yest.setDate(today.getDate()-1);
    if(dayKey(t)===dayKey(today)) return 'Today';
    if(dayKey(t)===dayKey(yest)) return 'Yesterday';
    return new Date(t).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
  }
  const last=c=>c.msgs[c.msgs.length-1];
  function preview(m, c){
    const short=n=>/^Dr\./.test(n) ? n : n.split(' ')[0];       // "Dr. Thornbury", "Gabriela"
    const who=m.from===ME ? 'You: ' : (c.type==='person' ? '' : short(m.from)+': ');
    return who+(m.video ? '🎥 Video' : m.photo ? '📷 Photo' : m.text);
  }

  /* ---------- the alerts strip ---------- */
  function renderAlertbar(){
    const b=el('alertbar');
    b.className='alertbar'+(alertsOn?' on':'');
    b.innerHTML = alertsOn
      ? '<span>🔔</span><span class="grow"><b>Alerts are on</b></span><button class="btn ghost sm" data-act="sample" title="When someone sends you a message or a video, your phone shows it - like a text.">See a sample</button>'
      : '<span>🔔</span><span class="grow"><b>Get alerts on your phone</b></span><button class="btn sm" data-act="alerts" title="When a message comes in, your phone shows it - like a text. It takes a minute, once.">Turn on</button>';
  }
  /* The chat runs to the bottom of the screen (on a phone, to just above the tab bar), so the message box and
     Send are always in view. A very short window keeps a minimum and lets the page scroll instead. */
  function fit(){
    const a=el('app'); if(!a || !a.offsetParent) return;
    const phone=!window.matchMedia('(min-width:761px)').matches;
    const bar=document.querySelector('.ph-tabbar'), b=bar && getComputedStyle(bar).display!=='none' ? bar.getBoundingClientRect() : null;
    const room=(b && b.height ? window.innerHeight-b.top : 0)+(phone?10:16);
    const want=window.innerHeight-(a.getBoundingClientRect().top+window.scrollY)-room, min=phone?280:300;
    a.style.height=Math.round(Math.max(min, want))+'px';
    document.querySelector('.wrap').style.paddingBottom=(want<min ? room : 0)+'px';
  }

  /* ---------- the list ---------- */
  function renderChips(){
    const F=[['all','All'],['unread','Unread'],['office','Offices & teams'],['person','People']];
    el('chips').innerHTML=F.map(f=>'<button class="chip'+(filter===f[0]?' on':'')+'" data-act="filter" data-v="'+f[0]+'">'+f[1]+'</button>').join('');
  }
  function renderList(){
    const qq=q.trim().toLowerCase();
    const list=CHATS.slice().sort((a,b)=>last(b).at-last(a).at).filter(c=>
      (filter==='all' || (filter==='unread' && c.unread) || (filter==='office' && c.type!=='person') || (filter==='person' && c.type==='person')) &&
      (!qq || c.name.toLowerCase().indexOf(qq)>=0 || c.members.some(m=>m.toLowerCase().indexOf(qq)>=0)));
    el('items').innerHTML = list.length ? list.map(c=>{
      const m=last(c);
      return '<button class="ci'+(open===c.id?' on':'')+(c.unread?' unread':'')+'" data-act="open" data-v="'+c.id+'">'+avatar(c)+
        '<span class="mid"><span class="nm">'+esc(c.name)+'</span><span class="pv">'+esc(preview(m,c))+'</span></span>'+
        '<span class="side"><span class="tm">'+esc(when(m.at))+'</span>'+(c.unread?'<span class="badge">'+c.unread+'</span>':'')+'</span></button>';
    }).join('') : '<div class="empty" style="padding:30px 16px">No chats match.</div>';
    saveUnread();
  }

  /* ---------- a conversation ---------- */
  function msgHTML(m, c, prev){
    const mine=m.from===ME, group=c.type!=='person';
    const showFrom=group && !mine && (!prev || prev.from!==m.from || dayKey(prev.at)!==dayKey(m.at));
    let body;
    if(m.video){
      const tall=m.ar && (r=>r[0]<r[1])(String(m.ar).split('/').map(Number));      // a phone video, upright
      body='<div class="media'+(m.wide?' wide':'')+(tall?' tall':'')+'"><video src="'+esc(m.video)+'"'+(m.poster?' poster="'+esc(m.poster)+'"':'')+(m.ar?' style="aspect-ratio:'+m.ar+'"':'')+' preload="metadata" playsinline></video>'+
        '<button class="play" data-act="play" aria-label="Play the video">▶</button><span class="dur">🎥 '+esc(m.dur||'')+'</span></div>';
    } else if(m.photo){
      body='<div class="media wide"><img src="'+esc(m.photo)+'"'+(m.w?' width="'+m.w+'" height="'+m.h+'"':'')+' alt="A photo from '+esc(m.from)+'"></div>';
    } else body='<div class="bub">'+esc(m.text)+'</div>';
    return '<div class="m'+(mine?' me':'')+'">'+(group && !mine ? (showFrom ? personAv(m.from) : '<span style="width:30px;flex:none"></span>') : '')+
      '<div class="col">'+(showFrom?'<div class="from">'+esc(m.from)+'</div>':'')+body+
      '<div class="meta">'+esc(clock(m.at))+(mine && m.seen!==false ? ' · Seen' : '')+'</div></div></div>';
  }
  function renderConv(){
    const c=CHATS.find(x=>x.id===open), box=el('conv');
    if(!c){ box.innerHTML='<div class="empty">Pick a chat on the left, or start a new one.</div>'; return; }
    const sub=c.type==='person' ? (c.sub||'') : c.members.length+' people · '+c.members.filter(n=>n!==ME).slice(0,4).join(', ')+(c.members.length>5?'…':'');
    let h='<div class="conv-top"><button class="back" data-act="back" aria-label="Back to chats">‹</button>'+avatar(c)+
      '<div class="who"><b>'+esc(c.name)+'</b><span>'+esc(sub)+'</span></div>'+
      '<button class="btn ghost sm" data-act="call" title="Calls open Microsoft Teams">📞 Call</button></div><div class="msgs" id="msgs">';
    let prev=null;
    c.msgs.forEach(m=>{ if(!prev || dayKey(prev.at)!==dayKey(m.at)) h+='<div class="day">'+esc(dayLabel(m.at))+'</div>'; h+=msgHTML(m,c,prev); prev=m; });
    h+='</div><div class="composer">'+
      '<button class="ib" data-act="attach" title="Send a photo or a video from your phone or computer" aria-label="Send a photo or video"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>'+
      '<button class="ib rec" data-act="record" title="Record a video (up to 5 minutes)" aria-label="Record a video"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg></button>'+
      '<textarea id="txt" rows="1" placeholder="Message'+(window.matchMedia('(min-width:761px)').matches?' '+esc(c.name):'')+'…" aria-label="Message"></textarea>'+
      '<button class="ib send" data-act="send" title="Send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></div>';
    box.innerHTML=h;
    const ms=el('msgs'); stick=true; ms.scrollTop=ms.scrollHeight;
    ms.addEventListener('scroll', ()=>{ stick=ms.scrollTop+ms.clientHeight>=ms.scrollHeight-40; }, {passive:true});
    /* Pictures and video frames arrive a moment later and push the newest message down, and the page can be
       shown only after sign-in (or the window resized): keep the newest message in view, unless they scrolled up. */
    const follow=()=>{ if(stick) ms.scrollTop=ms.scrollHeight; };
    ms.querySelectorAll('img,video').forEach(x=>{ if(x.tagName==='IMG' && x.complete) return;
      x.addEventListener(x.tagName==='IMG'?'load':'loadedmetadata', follow, {once:true}); });
    if(window.ResizeObserver){ if(ro) ro.disconnect(); ro=new ResizeObserver(follow); ro.observe(ms); }
  }
  /* show=false: select it without leaving the list (a phone shows one or the other) */
  function openChat(id, show){
    open=id; const c=CHATS.find(x=>x.id===id); if(c) c.unread=0;
    if(show!==false) el('app').classList.add('open');
    renderList(); renderConv(); fit();
  }

  /* ---------- sending, and a made-up reply a few seconds later ---------- */
  function addMsg(c, m){
    c.msgs.push(m);
    if(open===c.id){ renderConv(); } else { c.unread=(c.unread||0)+1; }
    renderList();
  }
  function send(m){
    const c=CHATS.find(x=>x.id===open); if(!c) return;
    addMsg(c, Object.assign({from:ME, at:Date.now()}, m));
    const others=c.members.filter(n=>n!==ME); if(!others.length) return;
    const who=others[Math.floor(Math.random()*others.length)];
    setTimeout(()=>{
      const r={from:who, at:Date.now(), text:REPLIES[Math.floor(Math.random()*REPLIES.length)]};
      addMsg(c, r);
      if(alertsOn) notify(c, r);
    }, 3800);
  }
  /* the alert a phone would show */
  let nt=null;
  function notify(c, m){
    const n=el('notif');
    n.innerHTML='<img src="../assets/logo-mark.png?v=2" alt=""><div style="flex:1;min-width:0"><div class="t"><span>HOME-BRACE</span><span>now</span></div>'+
      '<b>'+esc(c.type==='person' ? m.from : m.from+' · '+c.name)+'</b><div class="x2">'+esc(m.video?'🎥 Sent a video':m.photo?'📷 Sent a photo':m.text)+'</div></div>';
    n.dataset.chat=c.id; n.classList.add('on'); clearTimeout(nt); nt=setTimeout(()=>n.classList.remove('on'), 4200);
  }
  let tt=null; function toast(t){ const x=el('toast'); x.textContent=t; x.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>x.classList.remove('on'), 3000); }

  /* ---------- dialogs ---------- */
  function openDlg(html){ el('dlgcard').innerHTML=html; el('dlg').classList.add('open'); }
  function closeDlg(){ stopCamera(); el('dlg').classList.remove('open'); }
  const top=t=>'<div class="dm-top"><h3>'+t+'</h3><button class="x" data-act="close" aria-label="Close">×</button></div>';
  let alertTab='iphone';
  function alertsDlg(){
    const T={
      iphone:'<ol class="steps"><li>Open Home-Brace in Safari and tap <span class="ui">Share ⎙</span> at the bottom.</li><li>Tap <span class="ui">Add to Home Screen</span>, then <span class="ui">Add</span>.</li><li>Open Home-Brace from the new icon on your home screen and tap <span class="ui">Allow</span> when it asks about notifications.</li></ol><div class="note">Apple only lets web apps send alerts once they’re on the home screen. iPhones need iOS 16.4 or newer (from 2023 on).</div>',
      android:'<ol class="steps"><li>Open Home-Brace in Chrome.</li><li>Tap <span class="ui">Turn on alerts</span>, then <span class="ui">Allow</span>.</li></ol><div class="note">Optional: Chrome’s menu ⋮ → <b>Add to Home screen</b> gives Home-Brace its own icon.</div>',
      computer:'<ol class="steps"><li>Open Home-Brace in Chrome, Edge or Safari.</li><li>Click <span class="ui">Turn on alerts</span>, then <span class="ui">Allow</span>.</li></ol>'};
    openDlg(top('Turn on alerts')+'<div class="dm-body"><div>Once, on each phone or computer you use. Then a new message shows up like a text, even when Home-Brace is closed.</div>'+
      '<div class="tabs">'+[['iphone','iPhone'],['android','Android'],['computer','Computer']].map(x=>'<button class="chip'+(alertTab===x[0]?' on':'')+'" data-act="atab" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+
      T[alertTab]+'</div><div class="dm-foot"><button class="btn ghost" data-act="close">Not now</button><button class="btn" data-act="alertson">Allow alerts</button></div>');
  }
  function newChatDlg(){
    const staff=(window.STAFF||[]).map(p=>p.n).filter(n=>n && n!==ME && !/Lawing/i.test(n)).slice(0,40);
    const offices=['Carlsbad','Clovis','Hobbs','Lubbock','San Angelo','Mansfield','Cruces FFO','Cruces LCO'];
    const teams=['Doctors','TCs','Office Managers','Leadership Team','Marketing Team'];
    openDlg(top('New chat')+'<div class="dm-body"><input class="search" id="nq" placeholder="Search a person, an office or a team" autocomplete="off"><div class="pick" id="pick">'+
      '<div class="grp">Offices - everyone who works there</div>'+offices.map(o=>'<button data-act="mk" data-t="office" data-v="'+esc(o)+' office">'+avatar({type:'office',name:o},true)+'<span>'+esc(o)+' office</span></button>').join('')+
      '<div class="grp">Teams</div>'+teams.map(t=>'<button data-act="mk" data-t="team" data-v="'+esc(t)+'">'+avatar({type:'team',name:t},true)+'<span>'+esc(t)+'</span></button>').join('')+
      '<div class="grp">People</div>'+staff.map(n=>'<button data-act="mk" data-t="person" data-v="'+esc(n)+'">'+personAv(n)+'<span>'+esc(n)+'</span></button>').join('')+
      '</div></div>');
    setTimeout(()=>{ const i=el('nq'); if(i) i.focus(); }, 30);
  }

  /* ---------- recording a video: the camera, up to 5 minutes, kept in this browser ---------- */
  function stopCamera(){
    if(recState){ try{ recState.rec && recState.rec.state!=='inactive' && recState.rec.stop(); }catch(_){}
      if(recState.stream) recState.stream.getTracks().forEach(t=>t.stop()); clearInterval(recState.timer); recState=null; }
  }
  function recordDlg(){
    openDlg(top('Record a video')+'<div class="dm-body"><div class="cam" id="cam"><div class="msg">Starting your camera…</div><span class="clock" id="clk">0:00</span></div>'+
      '<div class="note" id="recnote">Up to 5 minutes. It’s sent to <b>'+esc((CHATS.find(x=>x.id===open)||{}).name||'')+'</b> and kept in your own Microsoft 365.</div></div>'+
      '<div class="dm-foot" id="recfoot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="recbtn" data-act="recgo" disabled>● Record</button></div>');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){
      el('cam').innerHTML='<div class="msg">This browser can’t use the camera here. In Home-Brace on a phone or a computer with a camera, this is where you record.</div>'; return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true}).then(stream=>{
      recState={stream, chunks:[], rec:null, started:0, timer:null};
      const cam=el('cam'); cam.innerHTML='<video id="live" autoplay muted playsinline></video><span class="clock" id="clk">0:00</span>';
      el('live').srcObject=stream; el('recbtn').disabled=false;
    }, ()=>{
      el('cam').innerHTML='<div class="msg">The camera wasn’t allowed. Allow the camera for this site and try again - or press 📎 to send a video you already have.</div>';
    });
  }
  function recGo(){
    if(!recState) return;
    const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm'];
    const type=types.find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t))||'';
    const rec=new MediaRecorder(recState.stream, type?{mimeType:type}:undefined);
    recState.rec=rec; recState.chunks=[]; recState.started=Date.now();
    rec.ondataavailable=e=>{ if(e.data && e.data.size) recState && recState.chunks.push(e.data); };
    rec.onstop=()=>{
      if(!recState) return;
      const blob=new Blob(recState.chunks,{type:rec.mimeType||'video/webm'}), url=URL.createObjectURL(blob); objectUrls.push(url);
      const secs=Math.max(1,Math.round((Date.now()-recState.started)/1000));
      recState.done={url, dur:Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')};
      recState.stream.getTracks().forEach(t=>t.stop());
      el('cam').classList.remove('recording');
      el('cam').innerHTML='<video src="'+url+'" controls playsinline></video>';
      el('recfoot').innerHTML='<button class="btn ghost" data-act="retake">Record again</button><button class="btn" data-act="recsend">Send video</button>';
    };
    rec.start(250);
    el('cam').classList.add('recording');
    el('recfoot').innerHTML='<button class="btn" data-act="recstop">■ Stop</button>';
    recState.timer=setInterval(()=>{
      const s=Math.floor((Date.now()-recState.started)/1000), c=el('clk'); if(c) c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' / 5:00';
      if(s>=300) recState.rec.stop();
    }, 250);
  }

  /* ---------- clicks, typing ---------- */
  document.addEventListener('click', e=>{
    const n=e.target.closest('#notif'); if(n && n.dataset.chat){ n.classList.remove('on'); openChat(n.dataset.chat); return; }
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.dataset.act, v=b.dataset.v;
    if(act==='open') return openChat(v);
    if(act==='back'){ el('app').classList.remove('open'); open=null; renderList(); fit(); return; }
    if(act==='filter'){ filter=v; renderChips(); renderList(); return; }
    if(act==='send'){ const t=el('txt'); const text=(t.value||'').trim(); if(!text) return; t.value=''; send({text}); return; }
    if(act==='attach'){ el('file').click(); return; }
    if(act==='record') return recordDlg();
    if(act==='recgo') return recGo();
    if(act==='recstop'){ if(recState && recState.rec) recState.rec.stop(); clearInterval(recState && recState.timer); return; }
    if(act==='retake'){ stopCamera(); recordDlg(); return; }
    if(act==='recsend'){ const d=recState && recState.done; closeDlg(); if(d) send({video:d.url, dur:d.dur}); toast('Video sent ✓'); return; }
    if(act==='play'){ const box=b.closest('.media'), vid=box.querySelector('video'); box.classList.add('playing'); vid.controls=true; vid.play().catch(()=>{}); return; }
    if(act==='call'){ toast('Calls open in Microsoft Teams - free. (Mock-up: nothing opens.)'); return; }
    if(act==='alerts') return alertsDlg();
    if(act==='atab'){ alertTab=v; alertsDlg(); return; }
    if(act==='alertson'){ alertsOn=true; try{ localStorage.setItem('ph_chat_alerts','1'); }catch(_){} closeDlg(); renderAlertbar(); toast('Alerts are on ✓');
      setTimeout(()=>notify(CHATS[0], {from:'Gabriela Garrison', video:true}), 1200); return; }
    if(act==='sample'){ notify(CHATS[0], {from:'Gabriela Garrison', video:true}); return; }
    if(act==='new') return newChatDlg();
    if(act==='mk'){
      const t=b.dataset.t; let c=CHATS.find(x=>x.name===v);
      if(!c){ c={id:'n'+Date.now(), type:t, name:v, sub:t==='person'?'':'', members:t==='person'?[v,ME]:[ME,'Gabriela Garrison','Quinn Quill','Avery Brooks'], unread:0, msgs:[]};
        CHATS.push(c); c.msgs.push({from:ME, at:Date.now(), text:'👋', seen:false}); }
      closeDlg(); openChat(c.id); return;
    }
    if(act==='close') return closeDlg();
  });
  el('dlg').addEventListener('click', e=>{ if(e.target===el('dlg')) closeDlg(); });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeDlg();
    if(e.key==='Enter' && !e.shiftKey && e.target && e.target.id==='txt'){ e.preventDefault(); const text=(e.target.value||'').trim(); if(text){ e.target.value=''; send({text}); } }
  });
  document.addEventListener('input', e=>{
    if(e.target.id==='q'){ q=e.target.value; renderList(); }
    if(e.target.id==='nq'){ const qq=e.target.value.trim().toLowerCase(); document.querySelectorAll('#pick button').forEach(x=>{ x.style.display=!qq||x.textContent.toLowerCase().indexOf(qq)>=0?'':'none'; }); }
    if(e.target.id==='txt'){ e.target.style.height='auto'; e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'; }
  });
  el('file').addEventListener('change', e=>{
    const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
    const url=URL.createObjectURL(f); objectUrls.push(url);
    if(/^video\//.test(f.type)) send({video:url, dur:'video'}); else send({photo:url});
    toast((/^video\//.test(f.type)?'Video':'Photo')+' sent ✓');
  });
  window.addEventListener('pagehide', ()=>{ stopCamera(); objectUrls.forEach(u=>URL.revokeObjectURL(u)); });

  renderAlertbar(); renderChips(); renderList(); renderConv();
  /* On a computer the newest chat is open beside the list; a phone starts at the list. */
  const wide=window.matchMedia('(min-width:761px)');
  const firstOpen=()=>{ if(wide.matches && !open) openChat(CHATS.slice().sort((a,b)=>last(b).at-last(a).at)[0].id, false); };
  firstOpen(); if(wide.addEventListener) wide.addEventListener('change', firstOpen);
  // again once the page is showing (after sign-in), or the window changes
  window.addEventListener('resize', fit); window.addEventListener('load', fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
})();
</script>
<script>PH.nav('chat');PH.dechrome();document.addEventListener('ph-signed-in',function(){PH.mount();PH.dechrome();if(PH.reloadPeople)PH.reloadPeople();if(PH.reloadAccess)PH.reloadAccess();});</script>
</body>
</html>
