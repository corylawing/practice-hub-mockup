<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-Brace · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.png?v=2" type="image/png">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-title" content="Home-Brace">
<link rel="apple-touch-icon" href="../assets/logo-mark.png">
<meta name="robots" content="noindex">
<!-- CHAT - A MOCK-UP for Heather and Dr. Jae (22/10/2026), sandbox only (user.js NAV: the header's chat button and
     the page are off on the live site). It opens from the chat button beside the bell, not a tab. The chat gets the
     whole screen: no page title, alerts inside the chat list, no Tour & Feedback button (Cory, 22/10). Dr. Jae asked for "communications in Home-Brace" with videos; Cory: they want "the whole
     thing in Home-Brace" - replying to messages, sending and viewing videos, alerts. The plan it shows: Microsoft
     Teams as the engine underneath (free with their Microsoft 365, messages and videos kept in their own Microsoft
     365), everything done inside Home-Brace, phone alerts sent by Home-Brace itself, live calls opening Teams.
     Made-up people, messages, videos and photo (chat-demo/). Nothing is sent anywhere; a video you record stays
     in this browser tab.
     THE REAL CHAT (12/11/2026, Cory: "very important that nobody sees it until I've confirmed it works ... also the
     ability to send videos"): the same page with Microsoft Teams underneath (chatgraph.js). Only an Admin on the
     SANDBOX who presses "Test the real chat" (this device only) gets it; everyone else keeps this mock-up, and the
     live site has neither (NAV + chatgraph CHAT_LIVE=false). While testing you can read your own Teams chats but
     only send to your testers. Videos go the way Teams sends them (OneDrive + shared with the chat). -->
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff; --bad:#D7503A; --amber-soft:#FFF4E2;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.16); --maxw:1180px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .ribbon{background:#F2A03D;color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark img{width:34px;height:34px;display:block;border-radius:50%}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:#9fb4d0}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:#cdd9ea;font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:16px 20px 0}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--teal-600)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600}
  .btn.ghost:hover{border-color:var(--teal);background:var(--teal-soft)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* the "turn on alerts" strip */
  /* alerts, in the chat list itself (Cory: "can't the turn on alerts be on the chat itself?") */
  .alertbar{display:flex;align-items:center;gap:8px;background:var(--teal-soft);border-radius:10px;padding:6px 4px 6px 10px;font-size:13px;color:var(--navy)}
  .alertbar[hidden]{display:none}
  .alertbar .grow{flex:1;min-width:0}
  .alertbar .btn.sm{padding:5px 10px;font-size:12.5px}
  .alertbar .x{font-size:19px;width:26px;height:26px;padding:0;border-radius:8px;flex:none}
  .alertbar .x:hover{background:rgba(15,42,74,.08)}
  /* the bell beside New chat: alerts on / off, any time (the strip above can be closed) */
  .ib.sm{width:34px;height:34px;border-radius:10px;position:relative}
  .ib.sm svg{width:18px;height:18px}
  .bellb.on{color:var(--teal-600);border-color:#9ED8D4}
  .bellb.on::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#2E9E6B;border:1.5px solid #fff}

  /* the chat app: the list beside the conversation (a phone shows one at a time) */
  .chatapp{display:grid;grid-template-columns:330px minmax(0,1fr);height:max(300px, calc(100vh - 182px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#FBFCFD}
  .list-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:#fff}
  .list-top .row{display:flex;align-items:center;gap:8px}
  .list-top h1{margin:0;font-size:18px;color:var(--navy);flex:1}
  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#F7F9FB}
  .search:focus{outline:2px solid var(--teal2);background:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .items{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
  .ci{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #EEF1F5;padding:11px 14px;cursor:pointer;font:inherit;color:inherit}
  .ci:hover{background:#F2F6F9}
  .ci.on{background:var(--teal-soft)}
  .ci .mid{flex:1;min-width:0}
  .ci .nm,.ci .pv{display:block}
  .ci .nm{font-weight:700;color:var(--navy);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci .pv{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci.unread .pv{color:var(--ink);font-weight:600}
  .ci .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
  .ci .tm{font-size:11.5px;color:var(--soft)}
  .badge{background:var(--teal);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
  .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex:none}
  .av.sm{width:30px;height:30px;font-size:11.5px}
  .av svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .conv{display:flex;flex-direction:column;min-height:0;min-width:0}
  .conv-top{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
  .conv-top .who{flex:1;min-width:0}
  .conv-top .who b{display:block;color:var(--navy);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-top .who span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{display:none;background:none;border:none;font-size:24px;line-height:1;color:var(--navy);cursor:pointer;padding:2px 6px}
  .msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:#F4F7FA}
  .day{align-self:center;font-size:11.5px;font-weight:700;color:var(--soft);background:#E7EDF3;border-radius:999px;padding:3px 10px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .m{display:flex;gap:8px;align-items:flex-end;max-width:78%}
  .m.me{align-self:flex-end;flex-direction:row-reverse}
  .m .col{display:flex;flex-direction:column;gap:3px;min-width:0}
  .m.me .col{align-items:flex-end}
  .m .from{font-size:12px;font-weight:700;color:var(--soft);margin:4px 0 0 2px}
  .bub{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:8px 12px;font-size:14.5px;color:var(--ink);white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(15,42,74,.04)}
  .m.me .bub{background:var(--teal);border-color:var(--teal);color:#fff;border-radius:16px 16px 5px 16px}
  .m .meta{font-size:11px;color:var(--soft);margin:0 4px}
  .media{position:relative;border-radius:14px;overflow:hidden;background:#0F2A4A;border:1px solid var(--line);max-width:260px;box-shadow:0 1px 2px rgba(15,42,74,.08)}
  .media.wide{max-width:340px}
  .media video,.media img{display:block;width:100%;height:auto;max-height:min(320px,45vh);object-fit:cover;background:#0F2A4A}
  .media.tall{width:fit-content}
  .media.tall video{width:auto;height:min(320px,45vh)}
  .media .play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;border:none;background:rgba(15,42,74,.62);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-left:4px}
  .media .play:hover{background:rgba(20,155,150,.9)}
  .media .dur{position:absolute;left:8px;bottom:8px;background:rgba(15,42,74,.72);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;display:flex;gap:5px;align-items:center}
  .media.playing .play,.media.playing .dur{display:none}

  .composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
  .composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px;max-height:120px;min-height:40px;background:#F7F9FB}
  .composer textarea:focus{outline:2px solid var(--teal2);background:#fff}
  .ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
  .ib:hover{border-color:var(--teal);background:var(--teal-soft)}
  .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ib.rec{color:#C2412D}
  .ib.send{background:var(--teal);border-color:var(--teal);color:#fff}
  .ib.send:hover{background:var(--teal-600)}
  .empty{margin:auto;text-align:center;color:var(--soft);font-size:14px;max-width:320px}

  /* dialogs, the phone alert, the toast */
  .dm{position:fixed;inset:0;background:rgba(15,42,74,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:60;overflow-y:auto}
  .dm.open{display:flex}
  .dmc{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:520px}
  .dm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .dm-top h3{margin:0;font-size:17px;color:var(--navy)}
  .x{background:none;border:none;font-size:24px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px}
  .dm-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14.5px}
  .dm-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
  .cam{position:relative;background:#0F2A4A;border-radius:12px;overflow:hidden;aspect-ratio:3/4;max-height:56vh;display:flex;align-items:center;justify-content:center}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .msg{color:#cdd9ea;text-align:center;padding:20px;font-size:14px}
  .cam .clock{position:absolute;top:10px;left:10px;background:rgba(194,65,45,.92);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;display:none}
  .cam.recording .clock{display:block}
  .tabs{display:flex;gap:6px}
  .steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding-left:34px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .ui{display:inline-block;border:1px solid #cbd5e1;border-radius:7px;padding:0 7px;font-size:13px;font-weight:700;background:#fff;white-space:nowrap}
  .note{background:var(--teal-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;color:#0c5b57}
  .lead{color:var(--ink);line-height:1.5}
  .other{font-size:12.5px;color:var(--soft)}
  .other button{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--teal-600);text-decoration:underline;cursor:pointer}
  .ui svg{width:13px;height:13px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* a picture of the question the browser / the phone asks, with Allow ringed */
  .bp{margin-top:9px;max-width:290px;background:#fff;border:1px solid #D5DCE4;border-radius:12px;box-shadow:0 6px 18px rgba(15,42,74,.14);padding:12px 12px 10px;font-size:13px;color:#1f2937;line-height:1.4}
  .bp-b{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .bp-b span{border:1px solid #cbd5e1;border-radius:8px;padding:4px 12px;font-weight:600;font-size:12.5px;color:#334155}
  .bp-b .go{background:#1a73e8;border-color:#1a73e8;color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--teal2)}
  .bp.ph{max-width:270px;background:#F2F2F7;border-radius:14px;padding:14px 0 0;text-align:center}
  .bp.ph .bp-t{padding:0 16px}
  .bp.ph .bp-b{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;border-top:1px solid #C6C6C8}
  .bp.ph .bp-b span{border:none;border-radius:0;color:#007AFF;padding:10px 0;font-size:14px;font-weight:500}
  .bp.ph .bp-b span+span{border-left:1px solid #C6C6C8}
  .bp.ph .bp-b .go{background:none;color:#007AFF;font-weight:700;box-shadow:inset 0 0 0 2px var(--teal2);border-radius:0 0 14px 0}
  .pick{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
  .pick button{display:flex;align-items:center;gap:10px;background:#fff;border:none;border-bottom:1px solid #EEF1F5;padding:9px 12px;cursor:pointer;text-align:left;font:inherit}
  .pick button:hover{background:var(--teal-soft)}
  .pick small{display:block;color:var(--soft);font-size:12px}
  .pick .grp{font-size:11.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 4px;background:#F7F9FB}
  /* a phone's alert, as Home-Brace would send it */
  .notif{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);width:min(380px,calc(100% - 24px));background:rgba(250,251,252,.97);backdrop-filter:blur(8px);border-radius:18px;box-shadow:0 12px 34px rgba(15,42,74,.28);padding:11px 14px;display:flex;gap:11px;align-items:flex-start;z-index:90;transition:transform .35s ease;cursor:pointer}
  .notif.on{transform:translate(-50%,0)}
  @media(min-width:761px){ .notif{left:auto;right:16px;transform:translateX(calc(100% + 30px))} .notif.on{transform:none} }
  .notif img{width:36px;height:36px;border-radius:9px;flex:none}
  .notif .t{font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:8px}
  .notif b{display:block;font-size:14px;color:#111}
  .notif .x2{font-size:13.5px;color:#222}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1}

  /* REAL CHAT (12/11/2026): the test bar, photos in avatars, files, sending state, the test lock */
  .ribbon button{margin-left:10px;background:rgba(58,36,0,.12);border:1px solid rgba(58,36,0,.28);color:#3a2400;border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .ribbon button:hover{background:rgba(58,36,0,.22)}
  .ribbon.real{background:#0F827E;color:#fff}
  .ribbon.real button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
  .ribbon.real button:hover{background:rgba(255,255,255,.28)}
  .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .file{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--navy);text-decoration:none;font-weight:600;max-width:260px;word-break:break-word}
  .file:hover{border-color:var(--teal)}
  .m .meta.bad{color:var(--bad);font-weight:700}
  .more{align-self:center;margin:2px 0 8px}
  .locked{padding:12px 14px;border-top:1px solid var(--line);background:#FFF8EC;color:#5b3d00;font-size:13.5px}
  .media .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cdd9ea;font-size:13px;pointer-events:none}
  .media.playing .wait{display:none}
  .trow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #EEF1F5;background:#fff}
  .trow small,.pick button small{display:block;color:var(--soft);font-size:12px}
  .trow .x{font-size:20px}

  @media(max-width:760px){
    .wrap{padding:10px 10px 0}
    html body{padding-bottom:0 !important}   /* the chat stops above the tab bar itself (fit) */
    .chatapp{grid-template-columns:minmax(0,1fr);height:max(280px, calc(100vh - 220px))}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}   /* above the phone tab bar */
    .chatapp .conv{display:none}
    .chatapp.open .list{display:none}
    .chatapp.open .conv{display:flex}
    .back{display:block}
    .m{max-width:88%}
  }
</style>
<script src="user.js?v=hc155"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
  <script src="store.js?v=hc155"></script>
  <script src="gate.js?v=hc155"></script>
  <script src="_staff.js?v=hc155"></script>

</head>
<body>
<div class="ribbon" id="ribbon">MOCK-UP for Heather and Dr. Jae — made-up people, messages and videos. Nothing is sent anywhere.</div>
<header class="hdr">
  <div class="hdr-in">
    <span class="mark" aria-label="Home-Brace"><img src="../assets/logo-mark.png?v=2" alt="" width="34" height="34"></span>
    <span class="brand">Home-<i>Brace</i><small>Chat</small></span>
    <span class="v1">V1 preview</span>
  </div>
</header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>

<div class="wrap">
  <div class="chatapp" id="app">
    <aside class="list" aria-label="Your chats">
      <div class="list-top">
        <div class="row"><h1>Chats</h1><button class="ib sm bellb" id="bellb" data-act="alerts" title="Turn on alerts" aria-label="Turn on alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 004 0"/></svg></button><button class="btn sm" data-act="new">＋ New chat</button></div>
        <div class="alertbar" id="alertbar"></div>
        <input class="search" id="q" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
        <div class="chips" id="chips"></div>
      </div>
      <div class="items" id="items"></div>
    </aside>
    <section class="conv" id="conv" aria-label="Conversation"></section>
  </div>
</div>

<script>
(function(){
  'use strict';
  const el=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let ME='Priya Tatum';
  /* REAL CHAT (12/11/2026): the same page, with Microsoft Teams underneath - see chatgraph.js for who gets it
     (an Admin on the sandbox who switched it on; never the live site until CHAT_LIVE). Everyone else: the mock-up. */
  const CG=window.PH_CHATG||null;
  let REALCHAT=false, MEID='';
  const COLORS=['#149B96','#6CB4F5','#F7A25E','#B49CFB','#F48C7F','#F27FC0','#6FD39A','#8FA2FF','#E0A800','#5B8DEF'];
  const colorOf=n=>{ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
  const initials=n=>n.replace(/^Dr\.\s*/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const ICON={office:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h6"/>',
              team:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 14.6c3 0 6 1.6 6 4.6"/>'};
  function avatar(c, sm){
    const cls='av'+(sm?' sm':'');
    if(c.type==='office' || c.type==='team' || c.type==='group') return '<span class="'+cls+'" style="background:'+(c.type==='office'?'#25456E':'#0F827E')+'"><svg viewBox="0 0 24 24">'+ICON[c.type==='office'?'office':'team']+'</svg></span>';
    if(c.photo) return '<span class="'+cls+'"><img src="'+esc(c.photo)+'" alt=""></span>';
    return '<span class="'+cls+'" style="background:'+colorOf(c.name)+'">'+esc(initials(c.name))+'</span>';
  }
  /* A person's Home-Brace profile photo when there is one (their own upload or one an admin set), else initials. */
  const personAv=(n, em)=>{ const ph=em && window.PH && PH.photoFor ? PH.photoFor(em) : '';
    return ph ? '<span class="av sm"><img src="'+esc(ph)+'" alt=""></span>' : '<span class="av sm" style="background:'+colorOf(n||'?')+'">'+esc(initials(n||'?'))+'</span>'; };

  /* ---------- made-up chats. Times are "minutes ago" so the mock-up always looks current. ---------- */
  const now=Date.now(), ago=min=>now-min*60000;
  let CHATS=[
    {id:'c1', type:'office', name:'Carlsbad office', members:['Gabriela Garrison','Quinn Quill','Avery Brooks','Jordan Ellis','Sofia Navarro',ME], unread:2, msgs:[
      {from:'Jordan Ellis', at:ago(1500), text:'Is anyone grabbing lunch for the team on Friday?'},
      {from:ME, at:ago(1490), text:'I will - tacos again?'},
      {from:'Gabriela Garrison', at:ago(48), text:'Morning! Quick video on the new check-in steps before patients arrive 👇'},
      {from:'Gabriela Garrison', at:ago(47), video:'chat-demo/huddle.mp4', poster:'chat-demo/huddle.jpg', dur:'0:08', ar:'9/16'},
      {from:'Quinn Quill', at:ago(36), text:'Watched it. So the consent form comes first now?'},
      {from:'Gabriela Garrison', at:ago(31), text:'Yes - consent first, then the photos.'}]},
    {id:'c2', type:'person', name:'Dr. Clara Coleman', sub:'Doctor · Hobbs and Clovis', members:['Dr. Clara Coleman',ME], unread:1, msgs:[
      {from:ME, at:ago(1700), text:'Thanks for covering Clovis today.'},
      {from:'Dr. Clara Coleman', at:ago(62), text:'Here’s the new tray layout for Hobbs. What do you think?'},
      {from:'Dr. Clara Coleman', at:ago(61), photo:'chat-demo/trays.jpg', w:800, h:600}]},
    {id:'c3', type:'team', name:'Doctors', members:['Dr. Clara Coleman','Dr. Thornbury','Dr. Ashcombe','Dr. Fairbanks',ME], unread:0, msgs:[
      {from:ME, at:ago(1180), text:'November’s schedule is posted in Home-Brace.'},
      {from:'Dr. Thornbury', at:ago(1150), text:'Thanks! I’m off the 27th - already marked.'}]},
    {id:'c4', type:'office', name:'Cruces LCO office', members:['Logan Pratt','Ines Salazar','Hayden Moss','Carmen Ibarra','Dr. Ashcombe',ME], unread:0, msgs:[
      {from:'Hayden Moss', at:ago(2950), text:'Friday reminder for everyone 👇'},
      {from:'Hayden Moss', at:ago(2949), video:'chat-demo/reminder.mp4', poster:'chat-demo/reminder.jpg', dur:'0:06', wide:true, ar:'16/9'},
      {from:'Ines Salazar', at:ago(2900), text:'Got it 👍'}]},
    {id:'c5', type:'team', name:'Leadership Team', members:['Morgan Hale','Casey Webb','Skyler Bennett',ME], unread:0, msgs:[
      {from:'Casey Webb', at:ago(4300), text:'Payroll sheets are due Tuesday by 2 pm this week.'}]},
    {id:'c6', type:'person', name:'Quinn Quill', sub:'TC · Carlsbad', members:['Quinn Quill',ME], unread:0, msgs:[
      {from:ME, at:ago(4500), text:'Can you cover Clovis on Thursday?'},
      {from:'Quinn Quill', at:ago(4480), text:'Yes, I’ve got it.'}]}
  ];
  /* The header's chat button shows the same unread count, kept for this browser tab (user.js chatBadge). */
  try{ const s=sessionStorage.getItem('ph_chat_unread'); if(s){ const m=JSON.parse(s)||{}; CHATS.forEach(c=>{ c.unread=Number(m[c.id])||0; }); } }catch(_){}
  function saveUnread(){
    const m={}; CHATS.forEach(c=>{ if(c.unread) m[c.id]=c.unread; });
    try{ sessionStorage.setItem('ph_chat_unread', JSON.stringify(m)); }catch(_){}
    if(window.PH && PH.chatBadge) PH.chatBadge();
  }
  const REPLIES=['Got it, thanks!','👍','Perfect - see you there.','Watched it, makes sense.','On it.','Thank you!'];
  let open=null, filter='all', q='', alertsOn=false, recState=null, objectUrls=[], stick=true, ro=null;
  /* REAL ALERTS (22/10/2026, Cory: "go"): alerts.js turns them on for this device and the alert sender sends them.
     Without it this falls back to the pretend version below. */
  const REAL=!!window.PH_ALERTS;
  if(REAL) alertsOn=PH_ALERTS.state()==='on';
  else try{ alertsOn=localStorage.getItem('ph_chat_alerts')==='1'; }catch(_){}
  const SAMPLE=()=>REALCHAT ? {title:'Home-Brace chat', body:'This is how a new message alert looks.', url:PH_ALERTS.here('chat.html'), tag:'hb-chat', delay:5}
    : {title:'Gabriela Garrison · Carlsbad office', body:'🎥 Sent a video', url:PH_ALERTS.here('chat.html'), tag:'hb-chat', delay:5};
  /* which device this is, so the alert steps are only the ones for it; and whether they closed the strip */
  const UA=navigator.userAgent||'';
  const DEVICE=(/iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1)) ? 'iphone' : /Android/.test(UA) ? 'android' : 'computer';
  const INSTALLED=navigator.standalone===true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  let alertsHidden=false; try{ alertsHidden=localStorage.getItem('ph_chat_alerts_hide')==='1'; }catch(_){}
  const setAlerts=on=>{ alertsOn=on; if(!REAL) try{ localStorage.setItem('ph_chat_alerts', on?'1':'0'); }catch(_){} renderAlertbar(); };

  /* ---------- time, as a phone shows it ---------- */
  const dayKey=t=>{ const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
  const clock=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  function when(t){
    const d=new Date(t), today=new Date(), yest=new Date(); yest.setDate(today.getDate()-1);
    if(dayKey(t)===dayKey(today)) return clock(t);
    if(dayKey(t)===dayKey(yest)) return 'Yesterday';
    return d.toLocaleDateString('en-US',{weekday:'short'});
  }
  function dayLabel(t){
    const today=new Date(), yest=new Date(); yest.setDate(today.getDate()-1);
    if(dayKey(t)===dayKey(today)) return 'Today';
    if(dayKey(t)===dayKey(yest)) return 'Yesterday';
    return new Date(t).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
  }
  /* The newest message: the loaded ones, or (real chat) Teams' own preview when that's newer. */
  const NONE={from:'', at:0, text:''};
  const last=c=>{ const m=c.msgs[c.msgs.length-1], l=c.lastMsg; return (l && (!m || l.at>m.at)) ? l : (m||l||NONE); };
  const mineOf=m=>m.mine!=null ? !!m.mine : m.from===ME;
  function preview(m, c){
    const short=n=>/^Dr\./.test(n) ? n : String(n||'').split(' ')[0];       // "Dr. Thornbury", "Gabriela"
    const who=mineOf(m) ? 'You: ' : (c.type==='person' || !m.from ? '' : short(m.from)+': ');
    const vid=m.video || m.localVideo || (m.files && m.files.some(f=>f.video));
    const pic=m.photo || m.localImg || (!m.text && m.images && m.images.length);
    return who+(vid ? '🎥 Video' : pic ? '📷 Photo' : (m.text || (m.files && m.files.length ? '📎 '+m.files[0].name : '')));
  }

  /* ---------- the alerts strip ---------- */
  /* The strip only shows while alerts are off, and it can be closed for good (Cory, 22/10: "they should have the
     ability to close that out and its not always there"). The bell beside New chat always works. */
  function renderAlertbar(){
    const b=el('alertbar');
    b.hidden=alertsOn || alertsHidden;
    b.innerHTML='<span>🔔</span><span class="grow"><b>Get message alerts</b></span>'+
      '<button class="btn sm" data-act="alerts">Turn on</button>'+
      '<button class="x" data-act="hidealerts" title="Close (the bell next to New chat turns alerts on any time)" aria-label="Close">×</button>';
    const bb=el('bellb'); if(bb){ bb.classList.toggle('on', alertsOn); bb.title=alertsOn?'Alerts are on':'Turn on alerts'; bb.setAttribute('aria-label', bb.title); }
  }
  /* The chat runs to the bottom of the screen (on a phone, to just above the tab bar), so the message box and
     Send are always in view. A very short window keeps a minimum and lets the page scroll instead. */
  function fit(){
    const a=el('app'); if(!a || !a.offsetParent) return;
    const phone=!window.matchMedia('(min-width:761px)').matches;
    const bar=document.querySelector('.ph-tabbar'), b=bar && getComputedStyle(bar).display!=='none' ? bar.getBoundingClientRect() : null;
    const room=(b && b.height ? window.innerHeight-b.top : 0)+(phone?10:16);
    const want=window.innerHeight-(a.getBoundingClientRect().top+window.scrollY)-room, min=phone?280:300;
    a.style.height=Math.round(Math.max(min, want))+'px';
    document.querySelector('.wrap').style.paddingBottom=(want<min ? room : 0)+'px';
  }

  /* ---------- the list ---------- */
  function renderChips(){
    const F=[['all','All'],['unread','Unread'],['office',REALCHAT?'Groups':'Offices & teams'],['person','People']];
    el('chips').innerHTML=F.map(f=>'<button class="chip'+(filter===f[0]?' on':'')+'" data-act="filter" data-v="'+f[0]+'">'+f[1]+'</button>').join('');
  }
  function renderList(){
    const qq=q.trim().toLowerCase();
    const list=CHATS.slice().sort((a,b)=>last(b).at-last(a).at).filter(c=>
      (filter==='all' || (filter==='unread' && c.unread) || (filter==='office' && c.type!=='person') || (filter==='person' && c.type==='person')) &&
      (!qq || c.name.toLowerCase().indexOf(qq)>=0 || c.members.some(m=>m.toLowerCase().indexOf(qq)>=0)));
    el('items').innerHTML = list.length ? list.map(c=>{
      const m=last(c);
      return '<button class="ci'+(open===c.id?' on':'')+(c.unread?' unread':'')+'" data-act="open" data-v="'+c.id+'">'+avatar(c)+
        '<span class="mid"><span class="nm">'+esc(c.name)+'</span><span class="pv">'+esc(preview(m,c))+'</span></span>'+
        '<span class="side"><span class="tm">'+esc(when(m.at))+'</span>'+(c.unread?'<span class="badge">'+c.unread+'</span>':'')+'</span></button>';
    }).join('') : '<div class="empty" style="padding:30px 16px">No chats match.</div>';
    saveUnread();
  }

  /* ---------- a conversation ---------- */
  function msgHTML(m, c, prev){
    const mine=mineOf(m), group=c.type!=='person';
    const showFrom=group && !mine && (!prev || prev.from!==m.from || dayKey(prev.at)!==dayKey(m.at));
    let body;
    if(REALCHAT) body=realBody(m);
    else
    if(m.video){
      const tall=m.ar && (r=>r[0]<r[1])(String(m.ar).split('/').map(Number));      // a phone video, upright
      body='<div class="media'+(m.wide?' wide':'')+(tall?' tall':'')+'"><video src="'+esc(m.video)+'"'+(m.poster?' poster="'+esc(m.poster)+'"':'')+(m.ar?' style="aspect-ratio:'+m.ar+'"':'')+' preload="metadata" playsinline></video>'+
        '<button class="play" data-act="play" aria-label="Play the video">▶</button><span class="dur">🎥 '+esc(m.dur||'')+'</span></div>';
    } else if(m.photo){
      body='<div class="media wide"><img src="'+esc(m.photo)+'"'+(m.w?' width="'+m.w+'" height="'+m.h+'"':'')+' alt="A photo from '+esc(m.from)+'"></div>';
    } else body='<div class="bub">'+esc(m.text)+'</div>';
    const meta=m.failed ? '<div class="meta bad">Not sent - '+esc(m.failed)+'</div>'
      : m.pending ? '<div class="meta">'+esc(m.progress!=null ? 'Uploading… '+Math.round(m.progress*100)+'%' : 'Sending…')+'</div>'
      : '<div class="meta">'+esc(clock(m.at))+(!REALCHAT && mine && m.seen!==false ? ' · Seen' : '')+(m.edited ? ' · Edited' : '')+'</div>';
    return '<div class="m'+(mine?' me':'')+'" data-mid="'+esc(m.id||'')+'">'+(group && !mine ? (showFrom ? personAv(m.from, m.fromEmail) : '<span style="width:30px;flex:none"></span>') : '')+
      '<div class="col">'+(showFrom?'<div class="from">'+esc(m.from)+'</div>':'')+body+meta+'</div></div>';
  }
  /* A real message: its words (plain text - Teams' HTML never goes into the page), pictures, videos and files.
     Pictures and videos are filled in a moment later (hydrate), with the sign-in. Only https addresses are used. */
  const httpsOnly=u=>/^https:\/\//i.test(String(u||''));
  function realBody(m){
    let h='';
    if(m.text) h+='<div class="bub">'+esc(m.text)+'</div>';
    if(m.localImg) h+='<div class="media wide"><img src="'+esc(m.localImg)+'" alt="Your photo"></div>';
    else (m.images||[]).forEach(u=>{ if(httpsOnly(u)) h+='<div class="media wide"><img data-hc="'+esc(u)+'" alt="A photo from '+esc(m.from)+'"></div>'; });
    if(m.localVideo) h+='<div class="media"><video src="'+esc(m.localVideo)+'" preload="metadata" playsinline></video><button class="play" data-act="play" aria-label="Play the video">▶</button><span class="dur">🎥 Video</span></div>';
    else (m.files||[]).forEach(f=>{
      if(!httpsOnly(f.url)) return;
      if(f.video) h+='<div class="media"><video data-ref="'+esc(f.url)+'" preload="metadata" playsinline></video><span class="wait">Loading video…</span><button class="play" data-act="play" aria-label="Play the video">▶</button><span class="dur">🎥 Video</span></div>';
      else if(f.image) h+='<div class="media wide"><img data-ref="'+esc(f.url)+'" alt="'+esc(f.name)+'"></div>';
      else h+='<a class="file" href="'+esc(f.url)+'" target="_blank" rel="noopener">📄 <span>'+esc(f.name)+'</span></a>';
    });
    return h || '<div class="bub">'+esc(m.deleted ? 'This message was deleted.' : '(nothing to show - open it in Teams)')+'</div>';
  }
  function renderConv(){
    const c=CHATS.find(x=>x.id===open), box=el('conv');
    if(!c){ box.innerHTML='<div class="empty">Pick a chat on the left, or start a new one.</div>'; return; }
    const sub=c.type==='person' ? (c.sub||'') : c.members.length+' people · '+c.members.filter(n=>n!==ME).slice(0,4).join(', ')+(c.members.length>5?'…':'');
    let h='<div class="conv-top"><button class="back" data-act="back" aria-label="Back to chats">‹</button>'+avatar(c)+
      '<div class="who"><b>'+esc(c.name)+'</b><span>'+esc(sub)+'</span></div>'+
      '<button class="btn ghost sm" data-act="call" title="Calls open Microsoft Teams">📞 Call</button></div><div class="msgs" id="msgs">';
    if(REALCHAT && c.next) h+='<button class="btn ghost sm more" data-act="more">Load earlier messages</button>';
    if(REALCHAT && !c.loaded) h+='<div class="empty">Loading…</div>';
    let prev=null;
    c.msgs.forEach(m=>{ if(!prev || dayKey(prev.at)!==dayKey(m.at)) h+='<div class="day">'+esc(dayLabel(m.at))+'</div>'; h+=msgHTML(m,c,prev); prev=m; });
    /* THE TEST LOCK: in a chat with anyone who isn't a tester there is no message box at all (chatgraph.js checks again). */
    if(REALCHAT && !CG.canSend(c, MEID)) h+='</div><div class="locked">🔒 <b>Test:</b> you can read this chat, but you can only send to your testers. Add them with <b>Testers</b> in the green bar.</div>';
    else h+='</div><div class="composer">'+
      '<button class="ib" data-act="attach" title="Send a photo or a video from your phone or computer" aria-label="Send a photo or video"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>'+
      '<button class="ib rec" data-act="record" title="Record a video (up to 5 minutes)" aria-label="Record a video"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg></button>'+
      '<textarea id="txt" rows="1" placeholder="Message'+(window.matchMedia('(min-width:761px)').matches?' '+esc(c.name):'')+'…" aria-label="Message"></textarea>'+
      '<button class="ib send" data-act="send" title="Send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></div>';
    box.innerHTML=h;
    if(REALCHAT) hydrate(box);
    const ms=el('msgs'); stick=true; ms.scrollTop=ms.scrollHeight;
    ms.addEventListener('scroll', ()=>{ stick=ms.scrollTop+ms.clientHeight>=ms.scrollHeight-40; }, {passive:true});
    /* Pictures and video frames arrive a moment later and push the newest message down, and the page can be
       shown only after sign-in (or the window resized): keep the newest message in view, unless they scrolled up. */
    const follow=()=>{ if(stick) ms.scrollTop=ms.scrollHeight; };
    ms.querySelectorAll('img,video').forEach(x=>{ if(x.tagName==='IMG' && x.complete) return;
      x.addEventListener(x.tagName==='IMG'?'load':'loadedmetadata', follow, {once:true}); });
    if(window.ResizeObserver){ if(ro) ro.disconnect(); ro=new ResizeObserver(follow); ro.observe(ms); }
  }
  /* show=false: select it without leaving the list (a phone shows one or the other) */
  function openChat(id, show){
    open=id; const c=CHATS.find(x=>x.id===id); const had=c && c.unread; if(c) c.unread=0;
    if(show!==false) el('app').classList.add('open');
    renderList(); renderConv(); fit();
    if(REALCHAT && c){
      if(!c.loaded) loadChat(c);
      if(had || show!==false) readIt(c, true);
    }
  }

  /* ---------- sending, and a made-up reply a few seconds later ---------- */
  function addMsg(c, m){
    c.msgs.push(m);
    if(open===c.id){ renderConv(); } else { c.unread=(c.unread||0)+1; }
    renderList();
  }
  function send(m){
    if(REALCHAT) return sendReal(m);
    const c=CHATS.find(x=>x.id===open); if(!c) return;
    addMsg(c, Object.assign({from:ME, at:Date.now()}, m));
    const others=c.members.filter(n=>n!==ME); if(!others.length) return;
    const who=others[Math.floor(Math.random()*others.length)];
    // the reply comes straight back (Cory, 22/10: "make the sandbox one instant too")
    setTimeout(()=>{
      const r={from:who, at:Date.now(), text:REPLIES[Math.floor(Math.random()*REPLIES.length)]};
      addMsg(c, r);
      if(alertsOn) notify(c, r);
    }, 500);
  }
  /* the alert a phone would show */
  let nt=null;
  function notify(c, m){
    const n=el('notif');
    n.innerHTML='<img src="../assets/logo-mark.png?v=2" alt=""><div style="flex:1;min-width:0"><div class="t"><span>HOME-BRACE</span><span>now</span></div>'+
      '<b>'+esc(c.type==='person' ? m.from : m.from+' · '+c.name)+'</b><div class="x2">'+esc(m.video?'🎥 Sent a video':m.photo?'📷 Sent a photo':m.text)+'</div></div>';
    n.dataset.chat=c.id; n.classList.add('on'); clearTimeout(nt); nt=setTimeout(()=>n.classList.remove('on'), 4200);
  }
  let tt=null; function toast(t){ const x=el('toast'); x.textContent=t; x.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>x.classList.remove('on'), 3000); }

  /* ---------- dialogs ---------- */
  function openDlg(html){ el('dlgcard').innerHTML=html; el('dlg').classList.add('open'); }
  function closeDlg(){ stopCamera(); el('dlg').classList.remove('open'); }
  const top=t=>'<div class="dm-top"><h3>'+t+'</h3><button class="x" data-act="close" aria-label="Close">×</button></div>';
  /* Turning alerts on (Cory, 22/10: "This isn't very clear"): only the steps for the device in your hand, in plain
     words, with a picture of the question the browser or phone asks. Another device's steps are a click away. */
  let alertTab=DEVICE;
  const SHARE='<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 11H5v10h14V11h-2"/></svg>';
  function alertsDlg(){
    if(alertsOn && alertTab===DEVICE) return alertsOnDlg();
    const st=REAL ? PH_ALERTS.state() : '';
    if(alertTab===DEVICE && (st==='blocked' || st==='unsupported')){
      return openDlg(top(st==='blocked'?'Alerts are blocked on this device':'This browser can’t get alerts')+'<div class="dm-body"><div class="lead">'+
        (st==='blocked' ? (DEVICE==='iphone' ? 'This iPhone said no before. Open <b>Settings → Notifications → Home-Brace → Allow Notifications</b>, then come back and turn them on.'
                                             : 'This browser said no before. Click the icon left of the web address → <b>Notifications → Allow</b>, then reload.')
                        : 'Try Safari on an iPhone (added to the home screen), or Chrome, Edge, Safari or Firefox on Android or a computer.')+
        '</div></div><div class="dm-foot"><button class="btn" data-act="close">Got it</button></div>');
    }
    const t=alertTab, mine=t===DEVICE, pc=t==='computer';

  /* ---------- recording a video: the camera, up to 5 minutes, kept in this browser ---------- */
  function stopCamera(){
    if(recState){ try{ recState.rec && recState.rec.state!=='inactive' && recState.rec.stop(); }catch(_){}
      if(recState.stream) recState.stream.getTracks().forEach(t=>t.stop()); clearInterval(recState.timer); recState=null; }
  }
  function recordDlg(){
    openDlg(top('Record a video')+'<div class="dm-body"><div class="cam" id="cam"><div class="msg">Starting your camera…</div><span class="clock" id="clk">0:00</span></div>'+
      '<div class="note" id="recnote">Up to 5 minutes. It’s sent to <b>'+esc((CHATS.find(x=>x.id===open)||{}).name||'')+'</b> and kept in your own Microsoft 365.</div></div>'+
      '<div class="dm-foot" id="recfoot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="recbtn" data-act="recgo" disabled>● Record</button></div>');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){
      el('cam').innerHTML='<div class="msg">This browser can’t use the camera here. In Home-Brace on a phone or a computer with a camera, this is where you record.</div>'; return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true}).then(stream=>{
      recState={stream, chunks:[], rec:null, started:0, timer:null};
      const cam=el('cam'); cam.innerHTML='<video id="live" autoplay muted playsinline></video><span class="clock" id="clk">0:00</span>';
      el('live').srcObject=stream; el('recbtn').disabled=false;
    }, ()=>{
      el('cam').innerHTML='<div class="msg">The camera wasn’t allowed. Allow the camera for this site and try again - or press 📎 to send a video you already have.</div>';
    });
  }
  function recGo(){
    if(!recState) return;
    const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm'];
    const type=types.find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t))||'';
    const rec=new MediaRecorder(recState.stream, type?{mimeType:type}:undefined);
    recState.rec=rec; recState.chunks=[]; recState.started=Date.now();
    rec.ondataavailable=e=>{ if(e.data && e.data.size) recState && recState.chunks.push(e.data); };
    rec.onstop=()=>{
      if(!recState) return;
      const blob=new Blob(recState.chunks,{type:rec.mimeType||'video/webm'}), url=URL.createObjectURL(blob); objectUrls.push(url);
      const secs=Math.max(1,Math.round((Date.now()-recState.started)/1000));
      const ext=/mp4/.test(rec.mimeType||'') ? 'mp4' : 'webm';
      recState.done={url, blob, dur:Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0'),
        name:'Home-Brace video '+new Date().toISOString().slice(0,16).replace('T',' ').replace(':','.')+'.'+ext};
      recState.stream.getTracks().forEach(t=>t.stop());
      el('cam').classList.remove('recording');
      el('cam').innerHTML='<video src="'+url+'" controls playsinline></video>';
      el('recfoot').innerHTML='<button class="btn ghost" data-act="retake">Record again</button><button class="btn" data-act="recsend">Send video</button>';
    };
    rec.start(250);
    el('cam').classList.add('recording');
    el('recfoot').innerHTML='<button class="btn" data-act="recstop">■ Stop</button>';
    recState.timer=setInterval(()=>{
      const s=Math.floor((Date.now()-recState.started)/1000), c=el('clk'); if(c) c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' / 5:00';
      if(s>=300) recState.rec.stop();
    }, 250);
  }

  /* ================= THE REAL CHAT (12/11/2026) =================
     Microsoft Teams underneath (chatgraph.js). The list refreshes every 20 seconds and the open chat every 5, only
     while the page is on screen. New messages are added to the bottom - nothing playing is interrupted. */
  const cur=()=>CHATS.find(x=>x.id===open)||null;
  const adminNow=()=>{ try{ return !!(window.PH && PH.isAdmin && PH.isAdmin()); }catch(_){ return false; } };
  const photoOf=em=>em && window.PH && PH.photoFor ? PH.photoFor(em) : '';
  function myEmail(){ const P=window.PH && PH.profileOf && PH.profileOf(); return String((P && (P.mail||P.userPrincipalName))||'').toLowerCase(); }
  function loading(){
    el('items').innerHTML='<div class="empty" style="padding:30px 16px">Loading your Teams chats…</div>';
    el('conv').innerHTML='<div class="empty">Loading…</div>';
  }
  function ribbon(){
    const r=el('ribbon'); if(!r || !CG) return;

      r.className='ribbon real';
      r.innerHTML='REAL CHAT TEST - only you see this. Your real Teams chats; you can only send to your testers.'+
        '<button data-act="testers">Testers ('+CG.testers().length+')</button><button data-act="mock">Back to the mock-up</button>';
    } else if(!(window.PH && PH.isLive && PH.isLive()) && CG.signedIn() && adminNow() && !r.querySelector('[data-act="tryreal"]')){
      r.insertAdjacentHTML('beforeend', '<button data-act="tryreal" title="Only you, on this device. Everyone else keeps seeing the mock-up.">Test the real chat</button>');
    }
  }
  const hashChat=()=>{ const m=/[#&]chat=([^&]+)/.exec(location.hash||''); try{ return m ? decodeURIComponent(m[1]) : ''; }catch(_){ return ''; } };
  /* who sent it, and their email for the photo */
  function dress(m, c){
    const p=(c.people||[]).find(x=>x.id===m.fromId);
    m.fromEmail=p ? p.email : '';
    if(m.mine) m.from=ME;
    return m;

  function startReal(){
    REALCHAT=true;
    const P=PH.profileOf ? PH.profileOf() : null;
    MEID=(P && P.id)||''; ME=(P && P.displayName)||'You';
    if(!MEID){ REALCHAT=false; return; }                 // never without knowing who this is (CG.mode checks too)
    CHATS=[]; open=null; el('app').classList.remove('open');
    ribbon(); renderChips(); loading();
    loadList(true);
    setInterval(()=>{ if(document.visibilityState!=='visible') return; tick++; pollOpen(); if(tick%4===0) loadList(false); }, 5000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ loadList(false); pollOpen(); } });
    window.addEventListener('hashchange', ()=>{ const w=hashChat(); if(w && CHATS.some(c=>c.id===w)) openChat(w); });
  }
  let tick=0, listP=null, loadedOnce=false, openBusy=false;
  function loadList(first){ if(listP) return listP; listP=doList(first).finally(()=>{ listP=null; }); return listP; }
  async function doList(first){
    let got;
    try{ got=await CG.listChats(MEID); }
    catch(e){ if(first || !CHATS.length) problem(e); return; }
    const before={}; CHATS.forEach(c=>{ before[c.id]=c; });
    CHATS=got.map(g=>{
      const was=before[g.id], c=was||{msgs:[], loaded:false, next:'', unread:0};
      const other=g.people.filter(p=>p.id!==MEID);
      Object.assign(c, {id:g.id, type:g.type, name:g.name, people:g.people, members:g.people.map(p=>p.name), webUrl:g.webUrl, read:g.read,
        sub:g.type==='person' ? ((other[0] && other[0].email)||'') : '',
        photo:g.type==='person' && other[0] ? photoOf(other[0].email) : '',
        lastMsg:{id:g.last.id, at:g.last.at, text:g.last.text, from:g.last.mine ? ME : g.last.from, mine:g.last.mine}});
      const moved=!!(was && was._lastId && was._lastId!==g.last.id);
      if(!g.unread) c.unread=0;
      else if(g.id===open && document.visibilityState==='visible') { /* the open chat is read as it arrives (pollOpen) */ }
      else c.unread=moved ? (c.unread||0)+1 : Math.max(1, c.unread||0);
      // a new message from someone else in another chat: the little banner (phones get the real alert)
      if(loadedOnce && moved && g.unread && g.id!==open) notify(c, {from:g.last.from, text:g.last.text});
      c._lastId=g.last.id;
      return c;
    });
    renderList();
    if(first && !loadedOnce){
      loadedOnce=true;
      const want=hashChat();
      if(want && CHATS.some(c=>c.id===want)) openChat(want);
      else if(CHATS.length) firstOpen();
      else el('conv').innerHTML='<div class="empty">No Teams chats yet. Start one with ＋ New chat.</div>';
      countUnread();
    }
    const c=cur(); if(c && c.loaded && c._lastId && !c.msgs.some(m=>m.id===c._lastId)) pollOpen();
  }
  /* Exact unread numbers for the first few unread chats (their newest 20 messages, kept for when they're opened). */
  async function countUnread(){
    for(const c of CHATS.filter(x=>x.unread && !x.loaded && x.id!==open).slice(0,8)){
      try{
        const r=await CG.listMessages(c.id, MEID, null, 20);
        if(!c.loaded){ c.msgs=r.msgs.map(m=>dress(m,c)); c.next=r.next; c.loaded=true; }
        if(c.id!==open) c.unread=Math.max(1, c.msgs.filter(m=>!m.mine && m.at>c.read).length);
      }catch(_){}
    }
    renderList();
  }
  async function loadChat(c){
    try{
      const r=await CG.listMessages(c.id, MEID);
      c.msgs=r.msgs.map(m=>dress(m,c)).concat(c.msgs.filter(m=>m.pending)); c.next=r.next; c.loaded=true;
      if(open===c.id) renderConv(); renderList();
    }catch(e){
      if(open===c.id){ const ms=el('msgs'); if(ms) ms.innerHTML='<div class="empty">'+esc('Couldn’t load this chat. Microsoft said: '+((e && e.message)||e))+'</div>'; }
    }
  }
  /* The open chat: anything new goes on the bottom. Skipped while one of mine is still sending (no doubles). */
  async function pollOpen(){
    const c=cur(); if(!REALCHAT || !c || !c.loaded || openBusy || c.msgs.some(m=>m.pending)) return;
    openBusy=true;
    try{
      const r=await CG.listMessages(c.id, MEID, null, 20);
      if(open!==c.id || c.msgs.some(m=>m.pending)) return;
      const have={}; c.msgs.forEach(m=>{ if(m.id) have[m.id]=1; });
      const fresh=r.msgs.filter(m=>!have[m.id]).map(m=>dress(m,c));
      if(fresh.length){
        const prev=c.msgs[c.msgs.length-1]; c.msgs=c.msgs.concat(fresh); appendConv(c, fresh, prev);
        if(fresh.some(m=>!m.mine)) readIt(c, true);
        renderList();
      }
    }catch(_){} finally{ openBusy=false; }
  }
  function appendConv(c, list, prev){
    const ms=el('msgs'); if(!ms || open!==c.id){ if(open===c.id) renderConv(); return; }
    const was=stick; let h='';
    list.forEach(m=>{ if(!prev || dayKey(prev.at)!==dayKey(m.at)) h+='<div class="day">'+esc(dayLabel(m.at))+'</div>'; h+=msgHTML(m,c,prev); prev=m; });
    const e=ms.querySelector(':scope > .empty'); if(e) e.remove();
    ms.insertAdjacentHTML('beforeend', h); hydrate(ms);
    if(was) ms.scrollTop=ms.scrollHeight;
  }
  function msgEl(id){ const ms=el('msgs'); if(!ms) return null; const all=ms.querySelectorAll('[data-mid]'); for(let i=0;i<all.length;i++) if(all[i].dataset.mid===id) return all[i]; return null; }
  function replaceEl(c, oldId, m, prev){
    if(open!==c.id) return; const x=msgEl(oldId); if(!x) return;
    x.outerHTML=msgHTML(m, c, prev); hydrate(el('msgs'));
    if(stick){ const ms=el('msgs'); ms.scrollTop=ms.scrollHeight; }
  }
  function readIt(c, force){
    if(!REALCHAT || !c || document.visibilityState!=='visible' || (!force && !c.unread)) return;
    c.unread=0; c.read=Date.now(); renderList();
    CG.markRead(c.id, MEID).catch(()=>{});
  }
  /* Pictures inside messages, and videos/pictures sent as files: filled in with the sign-in. One that can't be
     fetched becomes a link to open it in Teams / SharePoint instead. */
  function hydrate(root){
    if(!REALCHAT || !root) return;
    root.querySelectorAll('img[data-hc]:not([data-done])').forEach(img=>{
      img.dataset.done='1';
      CG.picture(img.dataset.hc).then(u=>{ img.src=u; }, ()=>{ const d=document.createElement('div'); d.className='bub'; d.textContent='(A picture that couldn’t be loaded - open it in Teams)'; (img.closest('.media')||img).replaceWith(d); });
    });
    root.querySelectorAll('[data-ref]:not([data-done])').forEach(x=>{
      x.dataset.done='1';
      CG.fileFor(x.dataset.ref).then(f=>{
        if(!f.url) throw new Error('no address');
        if(x.tagName==='VIDEO'){ if(f.thumb) x.poster=f.thumb; x.src=f.url; const w=x.parentNode && x.parentNode.querySelector('.wait'); if(w) w.remove(); }
        else x.src=f.url;
      }).catch(()=>{
        const a=document.createElement('a'); a.className='file'; a.href=x.dataset.ref; a.target='_blank'; a.rel='noopener';
        a.textContent=(x.tagName==='VIDEO'?'🎥 Open the video':'📷 Open the picture')+' in Teams / SharePoint';
        (x.closest('.media')||x).replaceWith(a);
      });
    });
  }

  /* ---------- sending for real ---------- */
  async function sendReal(m){
    const c=cur(); if(!c) return;
    if(!CG.canSend(c, MEID)){ toast('Test: you can only send to your testers.'); return; }
    const kind=m.blob ? 'video' : m.b64 ? 'photo' : 'text';
    const local={id:'local-'+Date.now(), at:Date.now(), from:ME, mine:true, pending:true, text:kind==='text' ? m.text : '', images:[], files:[],
      localImg:kind==='photo' ? m.photo : '', localVideo:kind==='video' ? m.video : '', progress:kind==='video' ? 0 : null};
    const prev=c.msgs[c.msgs.length-1]; c.msgs.push(local); c.loaded=true; appendConv(c, [local], prev); renderList();
    try{
      let res, warn='';
      if(kind==='text') res=await CG.sendText(c, MEID, m.text);
      else if(kind==='photo') res=await CG.sendPhoto(c, MEID, m.b64, m.w, m.h);
      else {
        const r=await CG.sendVideo(c, MEID, m.blob, m.name, f=>{ local.progress=f; const x=msgEl(local.id), mt=x && x.querySelector('.meta'); if(mt) mt.textContent='Uploading… '+Math.round(f*100)+'%'; });
        res=r.message; if(!r.shared) warn='Sent - but sharing the video with them didn’t work, so they may not be able to open it.';
      }
      const got=CG._t.mapMessage(res, MEID) || {};
      const done=Object.assign({}, local, got, {pending:false, progress:null, mine:true, from:ME, localImg:local.localImg, localVideo:local.localVideo});
      if(kind==='text' && !done.text) done.text=m.text;
      if(!done.at) done.at=local.at;
      const i=c.msgs.indexOf(local); if(i>=0) c.msgs[i]=done;
      replaceEl(c, local.id, done, c.msgs[i-1]);
      c._lastId=done.id; c.lastMsg={id:done.id, at:done.at, text:done.text, mine:true, from:ME, video:kind==='video', photo:kind==='photo'};
      renderList();
      if(warn) toast(warn); else if(kind!=='text') toast((kind==='video'?'Video':'Photo')+' sent ✓');
      chatAlert(c, kind, m.text||'');
    }catch(e){
      local.pending=false; local.failed=(e && e.message)||'error';
      replaceEl(c, local.id, local, c.msgs[c.msgs.indexOf(local)-1]);
      toast('Not sent: '+local.failed);
    }
  }

      url:A.here('chat.html')+'#chat='+encodeURIComponent(c.id), tag:'hb-chat'}).catch(()=>{});

      const ts=CG.testers();
      openDlg(top('New chat')+'<div class="dm-body"><div class="note">Test: you can start a chat with your testers only.</div><div class="pick">'+
        (ts.length ? ts.map(t=>'<button data-act="mkreal" data-v="'+esc(t.email)+'">'+personAv(t.name, t.email)+'<span>'+esc(t.name)+'<small>'+esc(t.email)+'</small></span></button>').join('')+
          (ts.length>1 ? '<button data-act="mkgroup">'+avatar({type:'group', name:'Testers'}, true)+'<span>All your testers<small>A group chat</small></span></button>' : '')
          : '<div class="grp">No testers yet</div>')+
        '</div><div><button class="btn ghost sm" data-act="testers">Add testers</button></div></div>');
      return;
    }
    openDlg(top('New chat')+'<div class="dm-body"><input class="search" id="nqr" placeholder="Search for a person" autocomplete="off"><div class="pick" id="nres" hidden></div></div>');
    setTimeout(()=>{ const i=el('nqr'); if(i) i.focus(); }, 30);
  }
  let psT=null;
  function peopleSearch(inp){
    clearTimeout(psT);
    const box=el(inp.id==='tq' ? 'tres' : 'nres'); if(!box) return;
    const q=inp.value.trim(); if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
    psT=setTimeout(()=>{
      CG.searchPeople(q).then(list=>{
        if(inp.value.trim()!==q) return;
        const act=inp.id==='tq' ? 'tadd' : 'mkreal';
        box.hidden=false;
        box.innerHTML=list.length ? list.map(u=>'<button data-act="'+act+'" data-v="'+esc(u.email)+'" data-email="'+esc(u.email)+'" data-name="'+esc(u.name)+'">'+personAv(u.name, u.email)+
          '<span>'+esc(u.name)+'<small>'+esc(u.title ? u.title+' · '+u.email : u.email)+'</small></span></button>').join('') : '<div class="grp">No one found</div>';
      }, e=>{ box.hidden=false; box.innerHTML='<div class="grp">'+esc('Search didn’t work: '+((e && e.message)||e))+'</div>'; });
    }, 300);
  }
  async function startWith(emails, topic){
    toast('Opening the chat…');
    try{
      const us=[]; for(const e of emails) us.push(await CG.userByEmail(e));
      const ch=await CG.createChat(MEID, us.map(u=>u.id), us.length>1 ? topic : '');
      closeDlg();
      await loadList(false);
      if(!CHATS.some(c=>c.id===ch.id)){
        const people=[{id:MEID, name:ME, email:myEmail()}].concat(us);
        CHATS.unshift({id:ch.id, type:us.length===1 ? 'person' : 'group', name:us.length===1 ? us[0].name : (topic||us.map(u=>u.name).join(', ')),
          people, members:people.map(p=>p.name), msgs:[], loaded:true, next:'', unread:0, read:Date.now(),
          sub:us.length===1 ? us[0].email : '', photo:us.length===1 ? photoOf(us[0].email) : '', lastMsg:{at:Date.now(), text:'', from:'', mine:true}});
      }
      openChat(ch.id);
    }catch(e){ toast('Couldn’t start the chat: '+((e && e.message)||e)); }
  }
  /* The real chat's buttons. false = not one of these. */
  function realAct(act, b, v){
    if(act==='tryreal'){ CG.setSwitch(true); location.reload(); return; }
    if(act==='mock'){ CG.setSwitch(false); location.hash=''; location.reload(); return; }
    if(act==='retry'){ loading(); loadList(true); return; }
    if(act==='askms'){ CG.ask().then(()=>{ loading(); loadList(true); }, e=>problem(e)); return; }
    if(act==='testers') return testersDlg();
    if(act==='tadd'){ CG.setTesters(CG.testers().concat([{email:b.dataset.email, name:b.dataset.name}])); afterTesters(); return; }
    if(act==='tdel'){ CG.setTesters(CG.testers().filter(t=>t.email!==v)); afterTesters(); return; }
    if(act==='mkreal'){ startWith([v]); return; }
    if(act==='mkgroup'){ startWith(CG.testers().map(t=>t.email), 'Home-Brace test'); return; }
    if(act==='more'){
      const c=cur(); if(!c || !c.next) return;
      b.disabled=true;
      CG.listMessages(c.id, MEID, c.next).then(r=>{
        const ms=el('msgs'), h0=ms ? ms.scrollHeight : 0, t0=ms ? ms.scrollTop : 0;
        const have={}; c.msgs.forEach(m=>{ have[m.id]=1; });
        c.msgs=r.msgs.filter(m=>!have[m.id]).map(m=>dress(m,c)).concat(c.msgs); c.next=r.next;
        renderConv(); const ms2=el('msgs'); if(ms2){ stick=false; ms2.scrollTop=ms2.scrollHeight-h0+t0; }
      }, e=>{ b.disabled=false; toast('Couldn’t load more: '+((e && e.message)||e)); });
      return;
    }
    return false;
  }

  /* ---------- clicks, typing ---------- */
  document.addEventListener('click', e=>{
    const n=e.target.closest('#notif'); if(n && n.dataset.chat){ n.classList.remove('on'); openChat(n.dataset.chat); return; }
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.dataset.act, v=b.dataset.v;
    if(act==='open') return openChat(v);
    if(act==='back'){ el('app').classList.remove('open'); open=null; renderList(); fit(); return; }
    if(act==='filter'){ filter=v; renderChips(); renderList(); return; }
    if(act==='send'){ const t=el('txt'); const text=(t.value||'').trim(); if(!text) return; t.value=''; send({text}); return; }
    if(act==='attach'){ el('file').click(); return; }
    if(act==='record') return recordDlg();
    if(act==='recgo') return recGo();
    if(act==='recstop'){ if(recState && recState.rec) recState.rec.stop(); clearInterval(recState && recState.timer); return; }
    if(act==='retake'){ stopCamera(); recordDlg(); return; }
    if(act==='recsend'){ const d=recState && recState.done; closeDlg(); if(d) send({video:d.url, dur:d.dur, blob:d.blob, name:d.name}); if(!REALCHAT) toast('Video sent ✓'); return; }
    if(act==='play'){ const box=b.closest('.media'), vid=box.querySelector('video'); if(REALCHAT && !vid.getAttribute('src')){ toast('The video is still loading - one moment.'); return; }
      box.classList.add('playing'); vid.controls=true; vid.play().catch(()=>{}); return; }
    if(act==='call'){
      if(REALCHAT){ const c=cur(), u=c && CG.callLink(c, MEID); if(u) window.open(u, '_blank', 'noopener'); else toast('No one to call in this chat.'); return; }
      toast('Calls open in Microsoft Teams - free. (Mock-up: nothing opens.)'); return; }
    if(act==='alerts'){ alertTab=DEVICE; return alertsDlg(); }
    if(act==='atab'){ alertTab=v; alertsDlg(); return; }
    if(act==='alertson'){
      if(!REAL){ setAlerts(true); alertsOnDlg(); setTimeout(()=>notify(CHATS[0], {from:'Gabriela Garrison', video:true}), 900); return; }
      b.disabled=true;
      PH_ALERTS.enable().then(()=>{ setAlerts(true); alertsOnDlg(); return PH_ALERTS.send(SAMPLE()); })
        .then(()=>toast('Alerts are on ✓ A test is on its way - about 5 seconds.'))
        .catch(err=>{ b.disabled=false; const m=err && err.message;
          toast(m==='dismissed'?'No answer - tap Turn on alerts again and choose Allow.':m==='blocked'?'Alerts were not allowed on this device.':'Couldn’t turn alerts on: '+m); });
      return;
    }
    if(act==='alertsoff'){ (REAL?PH_ALERTS.disable():Promise.resolve()).then(()=>{ setAlerts(false); closeDlg(); toast('Alerts are off'); }); return; }
    if(act==='hidealerts'){ alertsHidden=true; try{ localStorage.setItem('ph_chat_alerts_hide','1'); }catch(_){} renderAlertbar();
      toast('Closed. The bell next to New chat turns alerts on any time.'); return; }
    if(act==='sample'){
      if(REAL && alertsOn){ PH_ALERTS.send(SAMPLE()).then(()=>toast('Sent ✓ It arrives in about 5 seconds.'), err=>{ if(PH_ALERTS.state()!=='on') setAlerts(false); toast('Couldn’t send: '+(err&&err.message)); }); return; }
      notify(CHATS[0], {from:'Gabriela Garrison', video:true}); return;
    }
    if(act==='new') return REALCHAT ? newChatDlgReal() : newChatDlg();
    if(REALCHAT || act==='tryreal'){ const r=realAct(act, b, v); if(r!==false) return; }
    if(act==='mk'){
      const t=b.dataset.t; let c=CHATS.find(x=>x.name===v);
      if(!c){ c={id:'n'+Date.now(), type:t, name:v, sub:t==='person'?'':'', members:t==='person'?[v,ME]:[ME,'Gabriela Garrison','Quinn Quill','Avery Brooks'], unread:0, msgs:[]};
        CHATS.push(c); c.msgs.push({from:ME, at:Date.now(), text:'👋', seen:false}); }
      closeDlg(); openChat(c.id); return;
    }
    if(act==='close') return closeDlg();
  });
  el('dlg').addEventListener('click', e=>{ if(e.target===el('dlg')) closeDlg(); });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeDlg();
    if(e.key==='Enter' && !e.shiftKey && e.target && e.target.id==='txt'){ e.preventDefault(); const text=(e.target.value||'').trim(); if(text){ e.target.value=''; send({text}); } }
  });
  document.addEventListener('input', e=>{
    if(e.target.id==='q'){ q=e.target.value; renderList(); }
    if(e.target.id==='tq' || e.target.id==='nqr') peopleSearch(e.target);
    if(e.target.id==='nq'){ const qq=e.target.value.trim().toLowerCase(); document.querySelectorAll('#pick button').forEach(x=>{ x.style.display=!qq||x.textContent.toLowerCase().indexOf(qq)>=0?'':'none'; }); }
    if(e.target.id==='txt'){ e.target.style.height='auto'; e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'; }
  });
  el('file').addEventListener('change', e=>{
    const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
    if(REALCHAT){
      if(/^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name||'')){ const u=URL.createObjectURL(f); objectUrls.push(u); send({video:u, blob:f, name:f.name||'video.mp4'}); }
      else CG.photo(f).then(p=>send({photo:p.dataUrl, b64:p.b64, w:p.w, h:p.h}), err=>toast((err && err.message) || 'That file could not be sent.'));
      return;
    }
    const url=URL.createObjectURL(f); objectUrls.push(url);
    if(/^video\//.test(f.type)) send({video:url, dur:'video'}); else send({photo:url});
    toast((/^video\//.test(f.type)?'Video':'Photo')+' sent ✓');
  });
  window.addEventListener('pagehide', ()=>{ stopCamera(); objectUrls.forEach(u=>URL.revokeObjectURL(u)); });

  /* On a computer the newest chat is open beside the list; a phone starts at the list. */
  const DEMO=CHATS;
  const wide=window.matchMedia('(min-width:761px)');
  const firstOpen=()=>{ if(wide.matches && !open && CHATS.length) openChat(CHATS.slice().sort((a,b)=>last(b).at-last(a).at)[0].id, false); };
  /* Someone who switched the real chat on doesn't see the made-up chats flash up first. */
  const WANT_REAL=!!(CG && CG.switchedOn() && !(window.PH && PH.isLive && PH.isLive()));
  let demoShown=!WANT_REAL;
  renderAlertbar(); renderChips();
  if(WANT_REAL){ CHATS=[]; loading(); } else { renderList(); renderConv(); firstOpen(); }
  if(wide.addEventListener) wide.addEventListener('change', firstOpen);
  /* Once signed in we know who this is: the real chat (an Admin who switched it on, sandbox only) or the mock-up. */
  function startMode(){
    if(!CG || !window.PH_AUTH) return;
    if(CG.mode()==='real'){ if(!REALCHAT) startReal(); return; }
    if(REALCHAT) return;
    if(!demoShown){ demoShown=true; CHATS=DEMO; renderChips(); renderList(); renderConv(); firstOpen(); }
    ribbon();
  }
  document.addEventListener('ph-signed-in', ()=>setTimeout(startMode, 0));
  document.addEventListener('ph-identity', ()=>setTimeout(startMode, 0));
  if(window.PH_AUTH) startMode();
  // again once the page is showing (after sign-in), or the window changes
  window.addEventListener('resize', fit); window.addEventListener('load', fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
})();
</script>
<script>PH.nav('chat');PH.dechrome();document.addEventListener('ph-signed-in',function(){PH.mount();PH.dechrome();if(PH.reloadPeople)PH.reloadPeople();if(PH.reloadAccess)PH.reloadAccess();});</script>
</body>
