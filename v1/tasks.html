<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-Brace · Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.png?v=2" type="image/png">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-title" content="Home-Brace">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png?v=3">
<meta name="description" content="The practice’s central hub — schedule, production, documents and team, in one place. Farnsworth · Sunflower · Las Cruces.">
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --bad-ink:#a63a27; --amber:#F2A03D; --amber-soft:#FDF1E1; --amber-ink:#8a5208;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --radius:14px; --maxw:880px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{color:var(--navy);margin:0}
  .ribbon{background:var(--amber);color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark{width:34px;height:34px;flex:none;display:block}
  .mark img{width:34px;height:34px;display:block;border-radius:50%}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:var(--navy-mute,#9fb4d0)}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:var(--navy-mute,#cdd9ea);font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 20px 110px}
  .viewas{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:16px;border-left:5px solid var(--teal)}
  .viewas .lab{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .viewas select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--navy);background:#fff;max-width:100%}
  .page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .page-head h1{font-size:25px}
  .btn{border:0;background:var(--teal);color:#fff;font-weight:700;font-size:14.5px;font-family:inherit;padding:11px 18px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{background:var(--teal-600)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--teal);color:var(--teal-600)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn.danger{background:var(--bad)} .btn.danger:hover{background:#b9402c}
  .lnk{border:0;background:none;color:var(--teal-600);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;padding:3px 6px;border-radius:6px;white-space:nowrap}
  .lnk:hover{background:var(--teal-soft)}
  .lnk.quiet{color:var(--soft);font-weight:600}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
  .tabs{display:flex;gap:4px;background:#e9edf2;border-radius:12px;padding:4px;flex-wrap:wrap}
  .tabs button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;font-family:inherit;line-height:1.2;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(15,42,74,.12);font-weight:700}
  .tabs .n{background:var(--navy);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
  .tabs .n.late{background:var(--bad)}
  .pills{display:flex;gap:6px;margin-left:auto}
  .pills button{border:0;background:none;padding:6px 8px;font-weight:600;font-size:13.5px;line-height:1.2;font-family:inherit;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}
  .pills button.on{color:var(--navy);border-bottom-color:var(--teal)}

  /* the one line that tells a giver what needs them */
  .needs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bad-soft);border:1px solid #f2c9c0;border-radius:12px;padding:11px 14px;margin-top:14px;font-size:14px;color:var(--bad-ink)}
  .needs b{color:var(--bad-ink)}
  .needs .btn{margin-left:auto;background:var(--bad)} .needs .btn:hover{background:#b9402c}
  .calm{display:flex;align-items:center;gap:10px;background:var(--good-soft);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:13.5px;color:#1f6e4a}

  /* groups of rows */
  .grp{margin-top:20px}
  .grp h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin:0 0 8px 2px;display:flex;align-items:center;gap:8px}
  .grp h3 .c{font-weight:700;color:#8a96aa;letter-spacing:0}
  .grp.late h3{color:var(--bad-ink)} .grp.today h3{color:var(--amber-ink)} .grp.fin h3{color:#1f6e4a}
  .grp h3 .lnk{margin-left:auto;text-transform:none;letter-spacing:0}
  .list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .item+.item{border-top:1px solid var(--line)}
  .row{display:flex;gap:12px;align-items:center;padding:12px 14px;transition:background .15s}
  .row:hover{background:#fafcfd}
  .rb{flex:1;min-width:0;cursor:pointer}
  .rt{font-weight:650;color:var(--navy);font-size:15px;line-height:1.35;overflow-wrap:anywhere}
  .rm{font-size:12.5px;color:var(--soft);margin-top:2px;overflow-wrap:anywhere}
  .rm b{color:var(--navy);font-weight:700}
  .rm .late{color:var(--bad-ink);font-weight:700} .rm .today{color:var(--amber-ink);font-weight:700}
  .peek{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .said{font-size:13px;color:var(--ink);font-style:italic;margin-top:2px}
  .chev{flex:none;color:#a6b1c0;font-size:18px;transition:transform .2s;cursor:pointer;width:18px;text-align:center}
  .item.open .chev{transform:rotate(90deg)}
  .item.open>.row{background:#fafcfd}
  .item.done .rt{color:var(--soft);text-decoration:line-through;text-decoration-color:#b9c4d2;font-weight:600}
  .item.leaving{opacity:0;transition:opacity .35s}
  .pbar{height:5px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:7px;max-width:260px}
  .pbar span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .6s ease}
  .pbar.late span{background:var(--bad)}
  /* the tick */
  .chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #b9c4d2;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .15s, background .2s}
  .chk svg{width:15px;height:15px;stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s}
  .chk:hover{border-color:var(--teal)} .chk:hover svg{stroke-dashoffset:11;opacity:.6}
  .chk.on{background:var(--teal);border-color:var(--teal);animation:pop .35s ease}
  .chk.on svg{stroke:#fff;stroke-dashoffset:0;opacity:1}
  @keyframes pop{45%{transform:scale(1.25)}}

  /* opened */
  .xp{padding:2px 14px 14px 54px;display:flex;flex-direction:column;gap:10px;background:#fafcfd}
  .xp.g{padding-left:14px}
  .tn{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .meta{font-size:12.5px;color:var(--soft)}
  .meta b{color:var(--navy)}
  .noteline{display:flex;gap:8px;flex-wrap:wrap}
  .noteline input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:500;font-size:14px;font-family:inherit;background:#fff}
  .noteline input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .ppl{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .pr{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13.5px}
  .pr+.pr{border-top:1px solid var(--line)}
  .pr .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:#9aa8ba;flex:none}
  .pr.done .av{background:var(--good)} .pr.late .av{background:var(--bad)}
  .pr .pn{font-weight:700;color:var(--navy);white-space:nowrap}
  .pr .ps{color:var(--soft);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pr.late .ps{color:var(--bad-ink)}
  .dl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--soft)}
  .dl b{color:var(--navy);margin-right:4px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-weight:600;font-size:12.5px;line-height:1.2;font-family:inherit;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .chip input[type=date]{border:0;font-weight:600;font-size:12.5px;font-family:inherit;color:inherit;background:transparent;padding:0;max-width:122px}
  .chip.on input[type=date]{color:#fff;color-scheme:dark}
  .rmd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
  .rmd input{width:17px;height:17px;accent-color:var(--teal);flex:none}
  .rmd small{color:var(--soft)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .acts .grow{flex:1}
  .acts .q{font-size:13px;font-weight:600;color:var(--ink)}

  .empty{background:#fff;border:1px dashed #cfd8e3;border-radius:var(--radius);padding:30px 20px;text-align:center;color:var(--soft);font-size:14px;margin-top:16px}
  .empty .big{font-size:32px;line-height:1;margin-bottom:8px}
  .empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:4px}

  /* give a task */
  .sheet{position:fixed;inset:0;z-index:7100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 40px;overflow-y:auto}
  .sheet .bg{position:fixed;inset:0;background:rgba(15,42,74,.45);animation:fade .2s}
  .sheet .card{position:relative;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(15,42,74,.3);width:min(620px,100%);padding:20px 22px 18px;animation:rise .25s ease}
  @keyframes fade{from{opacity:0}} @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sh-h h2{margin:0;font-size:19px;color:var(--navy)}
  .sh-h .x{margin-left:auto;border:0;background:#f1f4f7;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--navy)}
  .say{width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 15px;font-weight:600;font-size:16.5px;line-height:1.4;font-family:inherit;color:var(--navy);resize:none;min-height:56px;overflow:hidden;background:#fff;display:block}
  .say:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
  .say::placeholder{color:#9aa6b6;font-weight:500}
  .hint{font-size:12.5px;color:var(--soft);margin:6px 2px 0}
  .ideas{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  .ql{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:6px 2px 2px}
  .idea{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-weight:500;font-size:14px;line-height:1.35;font-family:inherit;color:var(--ink);cursor:pointer}
  .idea:hover{border-color:var(--teal);background:var(--teal-soft)}
  .idea .ic{width:22px;text-align:center;flex:none}
  .u{margin-top:14px;border:1px solid var(--line);border-radius:13px;padding:4px 14px}
  .ur{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
  .ur+.ur{border-top:1px solid var(--line)}
  .ul{flex:none;width:44px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding-top:5px}
  .uv{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .uv.tt{font-weight:700;color:var(--navy);font-size:15px;padding-top:2px}
  .who{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-600);border-radius:999px;padding:5px 6px 5px 11px;font-size:13px;font-weight:700}
  .who.lock{background:var(--good-soft);color:#1f6e4a;padding-right:11px}
  .who .x{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 3px;opacity:.6}
  .who .x:hover{opacity:1}
  .unk{font-size:12.5px;color:var(--amber-ink);background:var(--amber-soft);border-radius:8px;padding:6px 10px;margin:0 0 8px 56px}
  .addbox{padding:0 0 10px 56px}
  .srch{position:relative}
  .fi{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:500;font-size:14px;line-height:1.4;font-family:inherit;color:var(--ink);background:#fff}
  .fi:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  textarea.fi{resize:vertical;min-height:64px}
  .res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,42,74,.16);z-index:5;max-height:260px;overflow-y:auto;padding:4px}
  .res button{display:flex;width:100%;text-align:left;align-items:center;gap:10px;border:0;background:none;border-radius:9px;padding:7px 10px;font-weight:600;font-size:14px;font-family:inherit;color:var(--navy);cursor:pointer}
  .res button:hover,.res button.hi{background:var(--teal-soft)}
  .res small{display:block;font-weight:500;color:var(--soft);font-size:12px}
  .res .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy2);flex:none}
  .groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .count{font-size:12.5px;color:var(--soft);margin:0 0 0 56px;padding-bottom:8px}
  .count b{color:var(--navy)}
  .warn{font-size:12px;color:var(--soft);margin:12px 2px 0}
  .errs{color:var(--bad);font-size:13px;font-weight:600;margin-top:10px}
  .sh-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}
  .sh-f .kbd{margin-right:auto;font-size:12px;color:#8a96aa}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--navy);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(15,42,74,.3);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:7200;display:flex;align-items:center;gap:12px;max-width:min(560px,92vw)}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13px;font-family:inherit;border-radius:8px;padding:6px 10px;cursor:pointer}
  .burst{position:fixed;pointer-events:none;z-index:7300}
  .burst i{position:absolute;width:7px;height:7px;border-radius:2px;left:0;top:0;animation:fly .7s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
  @media (max-width:560px){
    .page-head .btn{width:100%;justify-content:center} .pills{margin-left:0}
    .xp{padding-left:14px} .sheet{padding:12px 10px 90px} .toast{bottom:84px}
    .ur{flex-direction:column;gap:6px} .ul{padding-top:0} .unk,.addbox,.count{margin-left:0;padding-left:0}
    .rmd{flex-wrap:wrap;row-gap:0} .rmd small{flex-basis:100%;margin-left:25px}
  }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important} .burst{display:none} }
</style>

<body>
<div class="ribbon">MOCK-UP for Heather — made-up people. Try it as Jordan to make a task, then as Maya to tick it off.</div>
<header class="hdr">
  <div class="hdr-in">
    <span class="mark" aria-label="Home-Brace"><img src="../assets/logo-mark.png?v=2" alt="" width="34" height="34"></span>
    <span class="brand">Home-<i>Brace</i><small>Tasks</small></span>
    <span class="v1">V1 preview</span>
  </div>
</header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>

<div class="wrap">
  <div class="viewas" id="tryas">
    <span class="lab">👤 Try it as</span>
    <select id="persona" onchange="TASKS.as(this.value)"></select>
  </div>
  <div class="page-head">
    <h1>Tasks</h1>
    <button class="btn" id="giveBtn" hidden onclick="TASKS.give()">＋ New task</button>
  </div>
  <div class="bar"><div class="tabs" id="tabs" role="tablist"></div><div class="pills" id="pills"></div></div>
  <div id="view"><div class="empty">Reading the tasks…</div></div>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  /* TASKS (tasks.js has the rules and the reasons). Cory 19/11: "A little bit cleaner, and easier to use with good use
     cases.. It should be intelligent but not a stupid task system"; "Also easier task management for the people who
     assigned". So: one box you type the task into the way you'd say it; lists grouped by when (Late / Today / This
     week); for the giver one line per task ("2 of 4 done · waiting on Maya and Sam · 1 day late"), a Nudge only when one
     is due, and everything else - move the date, mark someone done, give it again, close - one tap inside the task. */
  const R=window.PH_TASKS, LIVE=!!(window.PH && PH.isLive && PH.isLive());
  const el=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const RANK={none:0,view:1,add:2,edit:3,manage:4};
  /* the practice's day (Central), wherever the device is */
  const today=()=>{ try{ if(window.PH && PH.centralNow) return PH.centralNow().date; }catch(_){} return R.dayOf(new Date()); };
  const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  const first=n=>String(n||'').trim().split(/\s+/)[0]||'';
  const WDN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  let REC=R.cleanRecord(null), OLDREC=null, WHO=null, TAB='mine', FILTER='open', DEMO=null;
  let FORM=null, OPEN={}, ASK={}, SHOWDONE=false;

  /* ---------- who is looking ---------- */
  const PERSONAS=[
    {id:'jordan', n:'Jordan — Leadership (can give tasks)', who:'Jordan Reyes', level:'edit'},

  /* ---------- reading and saving ---------- */
  async function load(){
    let r=null; try{ r=await PH_STORE.get(R.KEY); }catch(_){}
    if(!LIVE){ let v=''; try{ v=localStorage.getItem('ph_tasks_demo'); }catch(_){}
      if(v!=='2' || !r){ DEMO=null; r=demoData().rec; await PH_STORE.set(R.KEY, r); try{ localStorage.setItem('ph_tasks_demo','2'); }catch(_){} } }
    REC=R.cleanRecord(r);
  }
  /* Every change goes through PH_STORE.update: the shared copy is read first and this one change laid on it. */
  async function save(mutate, ok){
    let r=null; try{ r=await PH_STORE.update(R.KEY, cur=>mutate(R.cleanRecord(cur))); }catch(e){ r={error:e}; }
    if(r && r.value) REC=R.cleanRecord(r.value);
    const bad=!r || r.error || r.blocked;
    if(bad) toast('That didn’t save — try again in a moment'); else if(ok) toast(ok);
    render(); return bad ? null : r;
  }
  async function tidy(){
    if(!can('edit')) return; let last=''; try{ last=localStorage.getItem('ph_tasks_tidy')||''; }catch(_){}
    if(last===today()) return; try{ localStorage.setItem('ph_tasks_tidy', today()); }catch(_){}
    const old=R.oldOnes(REC, new Date());
    for(const y of Object.keys(old)){
      const a=await PH_STORE.update(R.OLD+y, cur=>R.toArchive(cur, old[y])).catch(()=>null);
      if(!a || a.error || a.blocked || !a.value) continue;
      await save(cur=>R.dropArchived(cur, R.cleanRecord(a.value)));
    }
  }
  async function loadOld(){
    const out={v:1, t:{}}; let keys=[]; try{ keys=await PH_STORE.keys(R.OLD); }catch(_){}
    for(const k of keys){ try{ Object.assign(out.t, R.cleanRecord(await PH_STORE.get(k)).t); }catch(_){} }
    OLDREC=out; render();
  }

  /* ---------- words ---------- */
  function daysLate(t){ return Math.round((new Date(today()+'T12:00:00')-new Date(t.due+'T12:00:00'))/864e5); }
  function dueShort(t){
    const st=R.dueState(t.due, today());
    if(st==='none') return ''; if(st==='late'){ const n=daysLate(t); return '<span class="late">'+(n===1?'1 day late':n+' days late')+'</span>'; }
    if(st==='today') return '<span class="today">due today</span>'; if(st==='tomorrow') return 'due tomorrow';
    if(st==='week') return 'due '+WDN[new Date(t.due+'T12:00:00').getDay()]; return 'due '+esc(R.shortDay(t.due, today()));
  }
  function dayTime(iso){ const d=new Date(iso); return R.shortDay(R.dayOf(d), today())+', '+d.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'}); }
  const ago=iso=>PH.ago ? PH.ago(iso) : '';
  const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const bucket=t=>{ const st=R.dueState(t.due, today()); return st==='tomorrow' ? 'week' : st; };
  function group(cls, title, n, inner, extra){ return '<section class="grp '+cls+'"><h3>'+title+(n!=null ? ' <span class="c">'+n+'</span>' : '')+(extra||'')+'</h3><div class="list">'+inner+'</div></section>'; }

  /* ---------- my tasks ---------- */
  function mineItem(t){
    const done=!!t.me.d, others=R.people(t).filter(x=>x.id!==t.me.id).map(x=>first(x.n)), open=!!OPEN[t.id];
    const meta=done ? 'Done '+esc(dayTime(t.me.d)) : [esc(first(t.byName)||nameOf(t.by)), dueShort(t)].filter(Boolean).join(' · ');
    let h='<div class="item'+(done?' done':'')+(open?' open':'')+'" data-id="'+esc(t.id)+'"><div class="row">'+
      '<button class="chk'+(done?' on':'')+'" data-act="'+(done?'undo':'done')+'" aria-label="'+(done?'Not done after all':'Mark done')+'" title="'+(done?'Done — tap to undo':'Mark done')+'">'+CHECK+'</button>'+
      '<div class="rb" data-act="open"><div class="rt">'+esc(t.title)+'</div><div class="rm">'+meta+'</div>'+
        (!open && t.notes && !done ? '<div class="peek">'+esc(t.notes.split('\n')[0])+'</div>' : '')+(!open && done && t.me.note ? '<div class="said">“'+esc(t.me.note)+'”</div>' : '')+'</div>'+
      '<span class="chev" data-act="open">›</span></div>';
    if(open){
      h+='<div class="xp">'+(t.notes ? '<div class="tn">'+esc(t.notes)+'</div>' : '')+
        '<div class="meta">From <b>'+esc(t.byName||nameOf(t.by))+'</b> · '+esc(ago(t.at))+(t.due ? ' · '+esc(R.dueText(t.due, today())) : '')+(others.length ? ' · also '+esc(others.slice(0,4).join(', '))+(others.length>4 ? ' and '+(others.length-4)+' more' : '') : '')+'</div>'+
        '<div class="noteline"><input id="note_'+esc(t.id)+'" maxlength="'+R.MAX_NOTE+'" placeholder="A note for '+esc(first(t.byName))+' (optional)" value="'+esc(t.me.note||'')+'" data-enter="'+(done?'note':'donenote')+'">'+
          (done ? '<button class="btn sm ghost" data-act="note">Save note</button>' : '<button class="btn sm" data-act="donenote">✓ Done</button>')+'</div></div>';
    }

  }
  function viewMine(){
    const m=R.mine(REC, WHO.keys, today(), new Date());
    let h='';
    if(!m.open.length) h+='<div class="empty"><div class="big">✨</div><b>You’re all caught up</b>When someone assigns you a task it shows here and on Home.</div>';
    else [['late','Late'],['today','Today'],['week','Coming up'],['later','Later'],['none','No date']].forEach(g=>{
      const l=m.open.filter(t=>bucket(t)===g[0]); if(l.length) h+=group(g[0], g[1], l.length, l.map(mineItem).join(''));
    });
    if(m.done.length) h+='<section class="grp fin"><h3>Done this week <span class="c">'+m.done.length+'</span><button class="lnk" data-act="showdone">'+(SHOWDONE?'Hide':'Show')+'</button></h3>'+(SHOWDONE ? '<div class="list">'+m.done.map(mineItem).join('')+'</div>' : '')+'</section>';
    return h;
  }

  /* ---------- tasks I gave (and everyone's) ---------- */
  function gaveItem(t, all, old){
    const p=R.progress(t), fin=R.finished(t), st=R.dueState(t.due, today()), open=!!OPEN[t.id], late=!fin && st==='late';
    const nudge=!old && R.needsNudge(t, today(), new Date()) && (R.isGiver(t, WHO.keys) || can('manage'));
    const line=fin ? (t.closed ? 'Closed '+esc(R.shortDay(R.dayOf(new Date(t.closed)), today())) : '🎉 Everyone’s done · '+esc(R.shortDay(R.dayOf(new Date(R.finishedAt(t))), today())))
      : '<b>'+p.done+' of '+p.total+' done</b> · '+esc(R.giverLine(t))+(t.due ? ' · '+dueShort(t) : '');
    let h='<div class="item'+(open?' open':'')+'" data-id="'+esc(t.id)+'"><div class="row">'+
      '<div class="rb" data-act="open"><div class="rt">'+esc(t.title)+'</div><div class="rm">'+(all ? esc(first(t.byName))+' · ' : '')+line+'</div>'+
        (fin ? '' : '<div class="pbar'+(late?' late':'')+'"><span style="width:'+(p.total ? Math.round(100*p.done/p.total) : 0)+'%"></span></div>')+'</div>'+
      (nudge ? '<button class="btn sm" data-act="nudge" title="An alert and a bell reminder to the '+p.open+' who haven’t done it">🔔 Nudge</button>' : '')+
      '<span class="chev" data-act="open">›</span></div>';
    if(open) h+=gaveOpen(t, fin, old);
    return h+'</div>';
  }
  function gaveOpen(t, fin, old){
    const mine=!old && (R.isGiver(t, WHO.keys) || can('manage')), st=R.dueState(t.due, today());
    const ppl=R.people(t).sort((a,b)=>(!!a.d===!!b.d) ? a.n.localeCompare(b.n) : (a.d ? 1 : -1));
    const pr=x=>'<div class="pr'+(x.d ? ' done' : (st==='late' && !fin ? ' late' : ''))+'"><span class="av">'+(x.d ? '✓' : esc(ini(x.n)))+'</span><span class="pn">'+esc(x.n)+'</span>'+
      '<span class="ps">'+(x.d ? 'Done '+esc(dayTime(x.d))+(x.mk && x.mk!==x.id ? ' (marked by '+esc(first(nameOf(x.mk)))+')' : '')+(x.note ? ' · “'+esc(x.note)+'”' : '') : (st==='late' && !fin ? 'Not yet — late' : 'Not yet'))+'</span>'+
      (mine && !fin && !x.d ? '<button class="lnk quiet" data-act="markfor" data-k="'+esc(x.id)+'" title="They told you it’s done">Mark done</button>' : '')+'</div>';
    let h='<div class="xp g">'+(t.notes ? '<div class="tn">'+esc(t.notes)+'</div>' : '')+'<div class="ppl">'+ppl.map(pr).join('')+'</div>';
    if(mine && !fin){
      const q=R.quickDues(today()), dd=(d,n)=>'<button class="chip'+(t.due===d?' on':'')+'" data-act="redue" data-d="'+d+'">'+n+'</button>';
      const isQuick=q.some(x=>x.d===t.due);
      h+='<div class="dl"><b>'+(t.due ? esc(R.dueText(t.due, today()).replace('Overdue · was due','Was due')) : 'No due date')+'</b>'+
        q.filter(x=>x.k!=='2w').map(x=>dd(x.d, x.n)).join('')+'<label class="chip'+(t.due && !isQuick ? ' on' : '')+'">📅 <input type="date" data-act="redate" min="'+today()+'" value="'+(t.due && !isQuick ? t.due : '')+'" aria-label="Pick a date"></label>'+(t.due ? dd('', 'No date') : '')+'</div>';
      h+='<label class="rmd"><input type="checkbox" data-act="remind" '+(t.remind?'checked':'')+'> Remind them for me <small>'+(t.due ? (t.rem.due ? '— reminded the morning it was due'+(t.rem.late ? ', and when it went late' : '') : '— the morning it’s due, and the next day if it’s late') : '— needs a due date')+'</small></label>';
    }
    if(mine){
      if(ASK[t.id]) h+='<div class="acts"><span class="q">Close this task? It comes off everyone’s list (nothing is deleted).</span><span class="grow"></span><button class="btn sm ghost" data-act="keep">Keep it</button><button class="btn sm danger" data-act="closeyes">Close it</button></div>';
      else h+='<div class="acts">'+(fin ? '' : '<button class="btn sm ghost" data-act="edit">Change</button>')+'<button class="btn sm ghost" data-act="again">↻ Assign again</button><span class="grow"></span>'+
        (t.closed ? '<button class="btn sm ghost" data-act="reopen">Reopen</button>' : (fin ? '' : '<button class="lnk quiet" data-act="close">Close task</button>'))+'</div>';
    }
    return h+'</div>';
  }
  function viewGave(all){
    const g=R.given(REC, all ? null : WHO.keys, today()), T=today();
    if(FILTER==='done'){
      let h=g.done.length ? group('fin','Finished', g.done.length, g.done.map(t=>gaveItem(t, all)).join('')) : '<div class="empty"><div class="big">🗂️</div><b>Nothing finished yet</b>Tasks land here once everyone has ticked them off, or they are closed.</div>';
      if(!OLDREC) h+='<div style="text-align:center;margin-top:14px"><button class="lnk" data-act="older">Show tasks finished more than 30 days ago</button></div>';
      else { const o=R.given(OLDREC, all ? null : WHO.keys, T).done; h+=o.length ? group('fin','Older', o.length, o.map(t=>gaveItem(t, all, true)).join('')) : '<div class="empty">Nothing older yet.</div>'; }
      return h;
    }
    const late=g.open.filter(t=>R.dueState(t.due,T)==='late'), tod=g.open.filter(t=>R.dueState(t.due,T)==='today'), rest=g.open.filter(t=>['late','today'].indexOf(R.dueState(t.due,T))<0);
    const fresh=g.done.filter(t=>!t.closed && (Date.now()-new Date(R.finishedAt(t)))<3*864e5);
    let h='';
    if(late.length){
      const ppl={}; late.forEach(t=>R.openIds(t).forEach(k=>{ ppl[k]=1; })); const n=Object.keys(ppl).length, canNudge=late.some(t=>R.needsNudge(t, T, new Date()));
      h+='<div class="needs">⏰ <span><b>'+late.length+' task'+(late.length===1?' is':'s are')+' late</b> — '+n+' '+(n===1?'person hasn’t':'people haven’t')+' finished.</span>'+(canNudge ? '<button class="btn sm" data-act="nudgeall">🔔 Nudge them all</button>' : '<span style="margin-left:auto;font-size:12.5px">Nudged in the last hour</span>')+'</div>';
    } else if(g.open.length) h+='<div class="calm">✓ Nothing late. Home-Brace reminds people the morning a task is due.</div>';
    if(!g.open.length && !fresh.length) h+='<div class="empty"><div class="big">📋</div><b>'+(all?'No open tasks in the practice':'Nothing open that you assigned')+'</b>'+(all ? '' : 'Press <b>＋ New task</b> and type it the way you’d say it.')+'</div>';
    if(late.length) h+=group('late','Late', late.length, late.map(t=>gaveItem(t, all)).join(''));
    if(tod.length) h+=group('today','Due today', tod.length, tod.map(t=>gaveItem(t, all)).join(''));
    if(rest.length) h+=group('','Waiting', rest.length, rest.map(t=>gaveItem(t, all)).join(''));
    if(fresh.length) h+=group('fin','Just finished', fresh.length, fresh.map(t=>gaveItem(t, all)).join(''));
    return h;
  }

  function render(){
    if(!WHO) return;
    const T=today(), m=R.mine(REC, WHO.keys, T, new Date()), g=R.given(REC, WHO.keys, T), a=R.given(REC, null, T);
    const late=m.open.filter(t=>R.dueState(t.due,T)==='late').length, glate=g.open.filter(t=>R.dueState(t.due,T)==='late').length;
    if(!can('edit') && TAB!=='mine') TAB='mine';
    if(!can('manage') && TAB==='all') TAB='mine';
    el('giveBtn').hidden=false; el('giveBtn').textContent=can('edit') ? '＋ New task' : '＋ Reminder for me';
    const tab=(k,n,c,cls)=>'<button role="tab" class="'+(TAB===k?'on':'')+'" data-tab="'+k+'">'+n+(c ? '<span class="n'+(cls?' '+cls:'')+'">'+c+'</span>' : '')+'</button>';
    el('tabs').innerHTML=tab('mine','My tasks', m.open.length, late?'late':'')+(can('edit') ? tab('gave','Tasks I assigned', g.open.length, glate?'late':'') : '')+(can('manage') ? tab('all','Everyone’s', a.open.length) : '');
    el('pills').innerHTML=TAB==='mine' ? '' : '<button class="'+(FILTER==='open'?'on':'')+'" data-filter="open">Open</button><button class="'+(FILTER==='done'?'on':'')+'" data-filter="done">Finished</button>';
    el('view').innerHTML=TAB==='mine' ? viewMine() : viewGave(TAB==='all');
  }

  /* ---------- the give box ---------- */
  function blank(){ return {mode:'new', id:'', say:'', notes:'', showNotes:false, due:undefined, picks:{people:[], offices:[], teams:[], all:false}, skip:{}, adding:false, q:'', hi:0, errs:[], drop:{}, remind:true}; }
  /* REMINDER FOR ME (20/11/2026, Cory: "Can you give the ability to assign a task to yourself as a reminder, so you don't
     forget something?"): someone who can't assign tasks gets the same box, for themselves only - no names, no groups. */
  function give(text){ FORM=blank(); FORM.self=!can('edit'); if(FORM.self) FORM.picks.people=[WHO.key]; if(text) FORM.say=text; drawSheet(); }
  function changeTask(id){ const t=REC.t[id]; if(!t) return; FORM=Object.assign(blank(), {mode:'edit', id, say:t.title, notes:t.notes, showNotes:!!t.notes, due:t.due, remind:t.remind}); drawSheet(); }
  function again(id){ const t=REC.t[id] || (OLDREC && OLDREC.t[id]); if(!t) return;
    const whoTxt=t.how.length ? t.how.join(', ') : R.people(t).map(x=>x.n).join(', ');
    give(whoTxt+': '+t.title); if(t.notes){ FORM.notes=t.notes; FORM.showNotes=true; drawParts(); } }
  /* what the box says now: the words, who (understood + picked - taken off), when */
  function plan(){
    const C=ctx(), u=R.understand(FORM.say, C);
    const picks={people:[], offices:[], teams:[], all:false};
    u.who.forEach(w=>{ if(FORM.skip[w.kind+':'+w.v]) return; if(w.kind==='all') picks.all=true; else if(w.kind==='office') picks.offices.push(w.v); else if(w.kind==='team') picks.teams.push(w.v); else picks.people.push(w.v); });
    ['people','offices','teams'].forEach(k=>FORM.picks[k].forEach(v=>{ if(picks[k].indexOf(v)<0) picks[k].push(v); })); if(FORM.picks.all) picks.all=true;
    if(FORM.self){ picks.people=[WHO.key]; picks.offices=[]; picks.teams=[]; picks.all=false; }
    const add=R.expand(picks, C.roster, {wide:PH.officeNames().length, not:WHO.keys});
    if(picks.people.some(isMe) && !add.some(p=>isMe(p.id))) add.push({id:WHO.key, name:WHO.name});   // not on the team list (yet)
    let now=[]; if(FORM.mode==='edit'){ const t=REC.t[FORM.id]; now=t ? R.people(t).filter(x=>!FORM.drop[x.id]) : []; }
    return {u, picks, title:FORM.mode==='edit' ? (u.title||FORM.say) : u.title, due:FORM.due!==undefined ? FORM.due : u.due,
      now, add:add.filter(p=>!now.some(x=>x.id===p.id)), labels:FORM.self ? [] : u.who.filter(w=>!FORM.skip[w.kind+':'+w.v])};
  }
  function drawSheet(){
    const edit=FORM.mode==='edit';
    el('sheet').innerHTML='<div class="bg" data-act="sheetx"></div><div class="card" role="dialog" aria-modal="true" aria-labelledby="shTitle">'+
      '<div class="sh-h"><h2 id="shTitle">'+(edit?'Change this task':FORM.self?'Reminder for me':'New task')+'</h2><button type="button" class="x" data-act="sheetx" aria-label="Close">×</button></div>'+
      '<textarea class="say" id="f_say" rows="1" maxlength="400" placeholder="'+(edit ? 'What needs doing?' : FORM.self ? 'e.g. Call the lab about the retainers tomorrow' : 'e.g. Office managers: count the aligner trays by Friday')+'">'+esc(FORM.say)+'</textarea>'+
      (edit ? '' : '<div class="hint">'+(FORM.self ? 'Say what and when — it goes on your own list, and Home-Brace reminds you.' : 'Say who and when the way you’d say it — or pick them below.')+'</div>')+
      '<div id="f_parts"></div></div>';
    el('sheet').hidden=false; document.body.style.overflow='hidden';
    grow(); drawParts(); setTimeout(()=>{ const i=el('f_say'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 60);
  }
  function grow(){ const i=el('f_say'); if(i){ i.style.height='auto'; i.style.height=Math.min(i.scrollHeight+2, 160)+'px'; } }
  function drawParts(){
    const host=el('f_parts'); if(!host || !FORM) return;
    const edit=FORM.mode==='edit';
    if(!edit && !FORM.say.trim() && FORM.self){ host.innerHTML=''; return; }
    if(!edit && !FORM.say.trim()){
      const C=ctx(), rec=R.recent(REC, WHO.keys, C.roster, 3), ide=R.ideas(C);
      const b=x=>'<button type="button" class="idea" data-idea="'+esc(x.text)+'"><span class="ic">'+x.ic+'</span><span>'+esc(x.text)+'</span></button>';
      host.innerHTML='<div class="ideas">'+(rec.length ? '<div class="ql">Assign again</div>'+rec.map(b).join('') : '')+'<div class="ql">Ideas</div>'+ide.map(b).join('')+'</div>';
      return;
    }
    const P=plan(), total=P.now.length+P.add.length, q=R.quickDues(today()), names=P.now.map(x=>isMe(x.id) ? 'me' : first(x.n)).concat(P.add.map(x=>isMe(x.id) ? 'me' : first(x.name)));
    const meOn=P.now.concat(P.add).some(x=>isMe(x.id)), onlyMe=total>0 && P.now.concat(P.add).every(x=>isMe(x.id));
    const lab=w=>'<span class="who">'+esc(w.label)+'<button type="button" class="x" data-skip="'+esc(w.kind+':'+w.v)+'" aria-label="Take off">×</button></span>';
    const picked=[].concat(FORM.picks.all ? ['<span class="who">Everyone<button type="button" class="x" data-unpick="all" data-v="">×</button></span>'] : [],
      FORM.picks.offices.map(o=>'<span class="who">Everyone at '+esc(o)+'<button type="button" class="x" data-unpick="offices" data-v="'+esc(o)+'">×</button></span>'),
      FORM.picks.teams.map(o=>'<span class="who">All '+esc(o)+'<button type="button" class="x" data-unpick="teams" data-v="'+esc(o)+'">×</button></span>'),
      FORM.picks.people.map(k=>FORM.self ? '<span class="who">Me</span>' : '<span class="who">'+esc(isMe(k) ? 'Me' : nameOf(k))+'<button type="button" class="x" data-unpick="people" data-v="'+esc(k)+'">×</button></span>'));
    const nowChips=P.now.map(x=>x.d ? '<span class="who lock" title="Already done — stays on the task">✓ '+esc(isMe(x.id) ? 'Me' : x.n)+'</span>' : '<span class="who">'+esc(isMe(x.id) ? 'Me' : x.n)+'<button type="button" class="x" data-drop="'+esc(x.id)+'" aria-label="Take off">×</button></span>');
    const res=FORM.adding ? results() : [];
    const dueChip=(d,n)=>'<button type="button" class="chip'+(P.due===d?' on':'')+'" data-due="'+d+'">'+n+'</button>';
    const isQuick=!P.due || q.some(x=>x.d===P.due);
    host.innerHTML='<div class="u">'+
      '<div class="ur"><span class="ul">Task</span><div class="uv tt">'+(P.title ? esc(P.title) : '<span style="color:#9aa6b6;font-weight:500">…</span>')+'</div></div>'+
      '<div class="ur"><span class="ul">For</span><div class="uv">'+nowChips.concat(P.labels.map(lab), picked).join('')+
        (FORM.self ? '' : (meOn ? '' : '<button type="button" class="chip" data-act="addme" title="Put this task on your own list">＋ Me</button>')+
        '<button type="button" class="chip" data-act="adding">'+(FORM.adding ? 'Done' : '＋ Add')+'</button>')+'</div></div>'+
      (P.u.unknown.length ? '<div class="unk">Didn’t find '+esc(P.u.unknown.join(', '))+' — pick them with ＋ Add.</div>' : '')+
      (FORM.adding ? '<div class="addbox"><div class="srch"><input class="fi" id="f_q" autocomplete="off" placeholder="Type a name…" value="'+esc(FORM.q)+'">'+
          (res.length ? '<div class="res">'+res.map((r,i)=>'<button type="button" class="'+(i===FORM.hi?'hi':'')+'" data-person="'+esc(R.personId(r))+'"><span class="av">'+esc(ini(r.name))+'</span><span>'+esc(r.name)+'<small>'+esc([r.role, (Array.isArray(r.offices)?r.offices:[r.loc]).filter(Boolean).join(', ')].filter(Boolean).join(' · '))+'</small></span></button>').join('')+'</div>' : (FORM.q.trim() ? '<div class="res"><div style="padding:10px;color:var(--soft);font-size:13px">Nobody by that name</div></div>' : ''))+'</div>'+
          '<div class="groups">'+grpBtn('all','','Everyone')+officesList().map(o=>grpBtn('offices',o,'Everyone at '+o)).join('')+teamsList().map(t=>grpBtn('teams',t,'All '+t)).join('')+'</div></div>' : '')+
      (total ? '<div class="count"><b>'+total+' '+(total===1?'person':'people')+'</b>'+(edit && P.add.length ? ' ('+P.add.length+' new)' : '')+': '+esc(names.slice(0,8).join(', '))+(names.length>8 ? ' and '+(names.length-8)+' more' : '')+'</div>' : '')+
      '<div class="ur"><span class="ul">Due</span><div class="uv">'+dueChip('','No date')+q.map(x=>dueChip(x.d, x.n)).join('')+
        '<label class="chip'+(!isQuick ? ' on' : '')+'">📅 <input type="date" id="f_date" min="'+today()+'" value="'+(!isQuick ? P.due : '')+'" aria-label="Pick a date"></label></div></div>'+
      '<div class="ur"><span class="ul"></span><div class="uv"><label class="rmd"><input type="checkbox" id="f_remind" '+(FORM.remind?'checked':'')+'> '+(onlyMe ? 'Remind me' : 'Remind them for me')+' <small>'+(P.due ? '— the morning it’s due, and the next day if it’s late' : '— once there’s a due date')+'</small></label></div></div>'+
      '<div class="ur"><span class="ul"></span><div class="uv" style="display:block">'+(FORM.showNotes ? '<textarea class="fi" id="f_notes" maxlength="'+R.MAX_NOTES+'" placeholder="Details that help them get it right">'+esc(FORM.notes)+'</textarea>' : '<button type="button" class="lnk" data-act="shownotes" style="padding-left:0">＋ Details</button>')+'</div></div>'+
      '</div><p class="warn">🔒 No patient details in a task — tasks aren’t kept in a locked folder.</p>'+
      (FORM.errs.length ? '<div class="errs">'+FORM.errs.map(esc).join(' · ')+'</div>' : '')+
      '<div class="sh-f"><span class="kbd">'+(edit ? '' : 'Enter to save it')+'</span><button type="button" class="btn ghost" data-act="sheetx">Cancel</button><button type="button" class="btn" data-act="'+(edit?'savechange':'send')+'">'+
        (edit ? 'Save changes' : (total ? (onlyMe ? 'Add to my tasks' : 'Assign to '+(total===1 ? esc(names[0]) : total+' people')) : 'Save task'))+'</button></div>';
  }
  function grpBtn(kind, v, label){ const on=kind==='all' ? FORM.picks.all : FORM.picks[kind].indexOf(v)>=0; return '<button type="button" class="chip'+(on?' on':'')+'" data-pick="'+kind+'" data-v="'+esc(v)+'">'+esc(label)+'</button>'; }
  function results(){
    const q=R.fold(FORM.q); if(!q) return [];
    const taken=FORM.picks.people;
    return roster().filter(r=>R.fold(r.name).split(' ').some(w=>w.indexOf(q)===0) || R.fold(r.name).indexOf(q)===0).filter(r=>taken.indexOf(R.personId(r))<0).slice(0,7);
  }
  function grabNotes(){ const n=el('f_notes'); if(n && FORM) FORM.notes=n.value; const r=el('f_remind'); if(r && FORM) FORM.remind=r.checked; }
  function closeSheet(){ FORM=null; el('sheet').hidden=true; el('sheet').innerHTML=''; document.body.style.overflow=''; }
  async function send(){
    grabNotes(); const P=plan(), ppl=P.add;
    FORM.errs=R.problems({title:P.title, due:P.due, people:ppl}, today()); if(FORM.errs.length) return drawParts();
    const t=R.create({title:P.title, notes:FORM.notes, due:P.due, by:WHO.key, byName:WHO.name, people:ppl, how:R.howWords(P.picks), remind:FORM.remind, today:today()}, new Date());
    const ids=Object.keys(t.to), n=ids.length; closeSheet();
    const others=ids.filter(k=>WHO.keys.indexOf(k)<0);
    const r=await save(cur=>R.add(cur, t), !others.length ? 'Added to your tasks — on your Home' :
      'Assigned to '+(n===1 ? first(t.to[ids[0]].n) : n+' people')+' — on their Home and in their 🔔'+(LIVE ? ', with an alert' : ''));
    if(!r) return;
    R.tell(others, 'New task: “'+t.title+'”'+(t.due ? ' · '+R.dueText(t.due, today()) : ''), '📋'); R.buzz(others, R.alertNew(t, today()), 'hb-task-'+t.id);
    TAB=others.length ? 'gave' : 'mine'; FILTER='open'; OPEN={}; render();
  }
  async function saveChange(){
    grabNotes(); const id=FORM.id, P=plan(), drop=Object.keys(FORM.drop), how=R.howWords(P.picks), F=FORM;
    if(!String(P.title).trim()){ FORM.errs=['Say what needs doing']; return drawParts(); }
    if(!P.now.length && !P.add.length){ FORM.errs=['A task needs at least one person — or close it instead']; return drawParts(); }
    if(P.due && P.due<today() && P.due!==(REC.t[id]||{}).due){ FORM.errs=['That due date has already passed']; return drawParts(); }
    closeSheet();
    const r=await save(cur=>{ let rec=R.edit(cur, id, {title:P.title, notes:F.notes, due:P.due, remind:F.remind}, new Date());
      drop.forEach(k=>{ rec=R.removePerson(rec, id, k, new Date()); }); if(P.add.length) rec=R.addPeople(rec, id, P.add, new Date(), how); return rec; }, 'Saved'+(P.add.length ? ' — '+P.add.length+' new '+(P.add.length===1?'person':'people')+' told' : ''));
    if(r && P.add.length){ const t=REC.t[id], ids=P.add.map(p=>p.id).filter(k=>WHO.keys.indexOf(k)<0);
      R.tell(ids, 'New task: “'+t.title+'”'+(t.due ? ' · '+R.dueText(t.due, today()) : ''), '📋'); R.buzz(ids, R.alertNew(t, today()), 'hb-task-'+id); }
  }

  /* ---------- ticking, nudging, managing ---------- */
  function burst(btn){
    try{ const b=btn.getBoundingClientRect(), w=document.createElement('div'); w.className='burst'; w.style.left=(b.left+b.width/2)+'px'; w.style.top=(b.top+b.height/2)+'px';
      const cs=getComputedStyle(document.documentElement), cols=[cs.getPropertyValue('--teal').trim()||'#149B96', '#F2A03D', '#2E9E6B', cs.getPropertyValue('--navy2').trim()||'#25456e'];
      for(let i=0;i<14;i++){ const a=Math.PI*2*i/14+Math.random()*.4, d=26+Math.random()*26, s=document.createElement('i');
        s.style.cssText='--x:'+(Math.cos(a)*d).toFixed(0)+'px;--y:'+(Math.sin(a)*d).toFixed(0)+'px;--r:'+(Math.random()*360|0)+'deg;background:'+cols[i%cols.length]; w.appendChild(s); }
      document.body.appendChild(w); setTimeout(()=>w.remove(), 800); }catch(_){}
  }
  async function done(id, btn, note){
    const t=REC.t[id], k=t && R.slotFor(t, WHO.keys); if(!k) return;
    const item=btn && btn.closest('.item'), chk=item && item.querySelector('.chk');
    if(chk){ chk.classList.add('on'); burst(chk); setTimeout(()=>item.classList.add('leaving'), 260); }
    const left=R.mine(REC, WHO.keys, today(), new Date()).open.length-1;
    await new Promise(r=>setTimeout(r, 520));
    const r=await R.finish(id, k, WHO.name, note==null ? null : note);
    if(r && r.value) REC=R.cleanRecord(r.value);
    delete OPEN[id]; render();
    if(!r || r.error || r.blocked) return toast('That didn’t save — try again in a moment');
    toast(left<=0 ? '🎉 All caught up!' : (R.isGiver(t, WHO.keys) ? 'Done ✓' : 'Done ✓ '+first(t.byName)+' can see it'), id);
  }
  function nudgeOne(t){
    const ids=R.openIds(t).filter(k=>WHO.keys.indexOf(k)<0); if(!ids.length) return 0;
    R.tell(ids, 'Reminder: “'+t.title+'”'+(t.due ? ' · '+R.dueText(t.due, today()) : ''), '🔔'); R.buzz(ids, R.alertNudge(t, today()), 'hb-task-'+t.id); return ids.length;
  }
  async function act(a, id, b){
    const t=id && (REC.t[id] || (OLDREC && OLDREC.t[id]));
    switch(a){
      case 'open': OPEN[id]=!OPEN[id]; ASK={}; return render();
      case 'done': return done(id, b);
      case 'donenote': { const i=el('note_'+id); return done(id, b, i ? i.value : ''); }
      case 'undo': { const k=R.slotFor(t, WHO.keys); return save(cur=>R.undo(cur, id, k), 'Back on your list'); }
      case 'note': { const i=el('note_'+id), k=R.slotFor(t, WHO.keys); return save(cur=>R.setNote(cur, id, k, i ? i.value : ''), 'Note saved — '+first(t.byName)+' sees it'); }
      case 'showdone': SHOWDONE=!SHOWDONE; return render();
      case 'older': return loadOld();
      case 'edit': return changeTask(id);
      case 'again': return again(id);
      case 'close': ASK={}; ASK[id]=1; return render();
      case 'keep': ASK={}; return render();
      case 'closeyes': ASK={}; return save(cur=>R.close(cur, id, new Date()), 'Closed — it’s off everyone’s list');
      case 'reopen': return save(cur=>R.reopen(cur, id), 'Reopened');
      case 'markfor': { const k=b.dataset.k; return save(cur=>R.markDone(cur, id, k, null, new Date(), WHO.key), first(nameOf(k))+' marked done'); }
      case 'redue': return redue(t, b.dataset.d);
      case 'nudge': { if(!t || R.nudgeWait(t, new Date())) return; const r=await save(cur=>R.nudged(cur, id, new Date())); if(r){ const n=nudgeOne(REC.t[id]); toast('Nudged '+(n===1 ? first(nameOf(R.openIds(REC.t[id])[0])) : n+' people')+' — a reminder in their 🔔'+(LIVE?' and an alert':'')); } return; }
      case 'nudgeall': {
        const late=R.given(REC, TAB==='all' ? null : WHO.keys, today()).open.filter(x=>R.dueState(x.due,today())==='late' && R.needsNudge(x, today(), new Date()));
        if(!late.length) return; const r=await save(cur=>{ let rec=cur; late.forEach(x=>{ rec=R.nudged(rec, x.id, new Date()); }); return rec; });
        if(r){ const ppl={}; late.forEach(x=>{ nudgeOne(REC.t[x.id]); R.openIds(x).forEach(k=>{ ppl[k]=1; }); }); toast('Nudged '+Object.keys(ppl).length+' people on '+late.length+' late task'+(late.length===1?'':'s')); }
        return;
      }
      case 'adding': grabNotes(); FORM.adding=!FORM.adding; FORM.q=''; drawParts(); if(FORM.adding){ const q=el('f_q'); if(q) q.focus(); } return;
      case 'shownotes': grabNotes(); FORM.showNotes=true; drawParts(); { const n=el('f_notes'); if(n) n.focus(); } return;
      case 'addme': grabNotes(); if(FORM.picks.people.indexOf(WHO.key)<0) FORM.picks.people.push(WHO.key); delete FORM.drop[WHO.key]; FORM.errs=[]; drawParts(); return;
      case 'sheetx': return closeSheet();
      case 'send': return send();
      case 'savechange': return saveChange();
    }
  }
  async function redue(t, d){
    if(!t) return; const ids=R.openIds(t).filter(k=>WHO.keys.indexOf(k)<0);
    const r=await save(cur=>R.edit(cur, t.id, {due:d}, new Date()), d ? 'Moved to '+R.shortDay(d, today())+(t.remind ? ' — they’ll be reminded that morning' : '') : 'No due date now');
    if(r && ids.length) R.tell(ids, '📅 New date for “'+t.title+'”'+(d ? ' · '+R.dueText(d, today()) : ' · no due date'), '📅');
  }
  let TT=0, UNDO='';
  function toast(msg, undoId){
    const x=el('toast'); UNDO=undoId||''; x.innerHTML='<span>'+esc(msg)+'</span>'+(undoId ? '<button type="button" data-toast="undo">Undo</button>' : '');
    x.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>x.classList.remove('on'), undoId ? 6000 : 3600);
  }

  /* ---------- wiring ---------- */
  document.addEventListener('click', e=>{
    const tb=e.target.closest('[data-tab]'); if(tb){ TAB=tb.dataset.tab; try{ localStorage.setItem('ph_tasks_tab', TAB); }catch(_){} OLDREC=null; OPEN={}; return render(); }
    const fl=e.target.closest('[data-filter]'); if(fl){ FILTER=fl.dataset.filter; OPEN={}; return render(); }
    const tu=e.target.closest('[data-toast]'); if(tu && UNDO){ const id=UNDO; UNDO=''; el('toast').classList.remove('on'); const t=REC.t[id]; return save(cur=>R.undo(cur, id, R.slotFor(t, WHO.keys)), 'Back on your list'); }
    if(FORM){
      const idea=e.target.closest('[data-idea]'); if(idea){ FORM.say=idea.dataset.idea; const i=el('f_say'); i.value=FORM.say; grow(); drawParts(); i.focus(); i.setSelectionRange(i.value.length, i.value.length); return; }
      const du=e.target.closest('[data-due]'); if(du){ grabNotes(); FORM.due=du.dataset.due; FORM.errs=[]; return drawParts(); }
      const sk=e.target.closest('[data-skip]'); if(sk){ grabNotes(); FORM.skip[sk.dataset.skip]=1; return drawParts(); }
      const dr=e.target.closest('[data-drop]'); if(dr){ grabNotes(); FORM.drop[dr.dataset.drop]=1; return drawParts(); }
      const pk=e.target.closest('[data-pick]'); if(pk){ grabNotes(); const k=pk.dataset.pick, v=pk.dataset.v;
        if(k==='all') FORM.picks.all=!FORM.picks.all; else { const a=FORM.picks[k], i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); } FORM.errs=[]; return drawParts(); }
      const up=e.target.closest('[data-unpick]'); if(up){ grabNotes(); const k=up.dataset.unpick, v=up.dataset.v; if(k==='all') FORM.picks.all=false; else FORM.picks[k]=FORM.picks[k].filter(x=>x!==v); return drawParts(); }
      const pp=e.target.closest('[data-person]'); if(pp){ grabNotes(); FORM.picks.people.push(pp.dataset.person); delete FORM.drop[pp.dataset.person]; FORM.q=''; FORM.hi=0; FORM.errs=[]; drawParts(); const q=el('f_q'); if(q) q.focus(); return; }
    }
    const b=e.target.closest('[data-act]'); if(!b || b.tagName==='INPUT') return;
    const item=b.closest('[data-id]'); act(b.dataset.act, item ? item.dataset.id : '', b);
  });
  document.addEventListener('change', e=>{
    const a=e.target.dataset && e.target.dataset.act, item=e.target.closest && e.target.closest('[data-id]');
    if(a==='remind' && item){ const on=e.target.checked; return save(cur=>R.edit(cur, item.dataset.id, {remind:on}, new Date()), on ? 'Home-Brace will remind them' : 'No automatic reminders on this one'); }
    if(a==='redate' && item && e.target.value) return redue(REC.t[item.dataset.id], e.target.value);
    if(FORM && e.target.id==='f_remind') FORM.remind=e.target.checked;
    if(FORM && e.target.id==='f_date'){ grabNotes(); FORM.due=e.target.value || ''; FORM.errs=[]; drawParts(); }
  });
  document.addEventListener('input', e=>{
    if(!FORM) return;
    if(e.target.id==='f_say'){ FORM.say=e.target.value; FORM.errs=[]; grow(); grabNotes(); drawParts(); }
    else if(e.target.id==='f_notes') FORM.notes=e.target.value;
    else if(e.target.id==='f_q'){ FORM.q=e.target.value; FORM.hi=0; const pos=e.target.selectionStart; grabNotes(); drawParts(); const q=el('f_q'); if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} } }
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && FORM) return closeSheet();
    if(FORM && e.target.id==='f_say' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); return FORM.mode==='edit' ? saveChange() : send(); }
    if(FORM && e.target.id==='f_q'){
      const res=results();
      if(e.key==='ArrowDown' && res.length){ e.preventDefault(); FORM.hi=(FORM.hi+1)%res.length; drawParts(); el('f_q').focus(); }
      else if(e.key==='ArrowUp' && res.length){ e.preventDefault(); FORM.hi=(FORM.hi-1+res.length)%res.length; drawParts(); el('f_q').focus(); }
      else if(e.key==='Enter' && res.length){ e.preventDefault(); grabNotes(); FORM.picks.people.push(R.personId(res[FORM.hi]||res[0])); FORM.q=''; FORM.hi=0; drawParts(); el('f_q').focus(); }
      return;
    }
    if(e.key==='Enter' && e.target.dataset && /note$/.test(e.target.dataset.enter||'')){ const item=e.target.closest('[data-id]'); if(item) act(e.target.dataset.enter, item.dataset.id, e.target); }
  });
  function persona(){ const s=el('persona'); if(!s) return;
    s.innerHTML=PERSONAS.map(p=>'<option value="'+p.id+'" '+(p.id===WHO.id?'selected':'')+'>'+esc(p.n)+'</option>').join(''); }
  window.TASKS={
    as(id){ try{ localStorage.setItem('ph_tasks_as', id); }catch(_){} if(location.hash) history.replaceState(null, '', location.pathname+location.search);
      WHO=who(); persona(); TAB='mine'; FILTER='open'; ASK={}; OPEN={}; OLDREC=null; closeSheet(); render(); },
    give, reset(){ try{ localStorage.removeItem('ph_tasks_demo'); }catch(_){} location.reload(); }
  };

  async function boot(){
    WHO=who();
    if(LIVE){ const t=el('tryas'); if(t) t.remove(); } else persona();
    try{ const t=localStorage.getItem('ph_tasks_tab'); if(t) TAB=t; }catch(_){}
    if(/gave\b/.test(location.hash||'') && can('edit')) TAB='gave';
    await load(); render();
    if(window.PH && PH.loadDone) PH.loadDone('page');
    tidy().catch(()=>{}); R.remindTick();
  }
  if(window.PH && PH.loadHold && LIVE) PH.loadHold('page', 'Reading the tasks…');
  if(!LIVE || window.PH_AUTH) boot();
  else document.addEventListener('ph-signed-in', boot, {once:true});
  document.addEventListener('ph-identity', ()=>{ if(LIVE){ WHO=who(); render(); } });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && WHO && !FORM) load().then(render).catch(()=>{}); });
})();
</script>
<script>PH.nav('tasks');PH.dechrome();document.addEventListener('ph-signed-in',function(){PH.mount();PH.dechrome();if(PH.reloadPeople)PH.reloadPeople();if(PH.reloadAccess)PH.reloadAccess();});</script>
</body>
