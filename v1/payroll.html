<!-- PAYROLL - A MOCK-UP for Heather (21/10/2026), sandbox only (user.js NAV: the tab and the page
     are off on the live site). Heather: every other week each office manager sends her a payroll
     sheet; she copies them into one main Excel sheet, and wants Home-Brace to keep the records "kind
     of like the production sheet does" so she can go back to past weeks and months. Same columns as
     her office form and her main sheet, with her written rules built into the form. Made-up people
     and amounts; nothing is saved anywhere but this browser. Not the real design yet.
     22/10/2026, her answers and asks: rates and the due day, who sends each office's sheet, what Team B
     (now "Goal"), TC/OM, Phone, DIBS, POG, Sick and Extra are; "Wk 1"/"Wk 2" headings, overtime in its
     own columns by week, wrapped headings, headings repeated for every office, people by last name,
     adding people, partial bonus as % or $, doctors paid by the day. -->
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber:#F2A03D; --amber-soft:#FFF4E2;
    --blue-soft:#E3F0FA; --plum-soft:#F0EAFB;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.12); --radius:14px; --maxw:1480px;   /* a spreadsheet page: wider than the others */
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{color:var(--navy);margin:0}
  button{font-family:inherit}
  .ribbon{background:var(--amber);color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark{width:34px;height:34px;flex:none;display:block}
  .mark img{width:34px;height:34px;display:block;border-radius:50%}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:var(--navy-mute,#9fb4d0)}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:var(--navy-mute,#cdd9ea);font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 20px 90px}
  .viewas{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:16px;border-left:5px solid var(--teal)}
  .viewas .lab{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .viewas select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--navy);background:#fff;max-width:100%;min-width:0}
  .viewas .demo{margin-left:auto}
  .page-head h1{font-size:25px}
  .page-head p{margin:4px 0 0;color:var(--soft);font-size:14.5px;max-width:66ch}
  .tabs{display:flex;gap:4px;margin:16px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:11px 14px;font-size:14.5px;font-weight:700;color:var(--soft);cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--navy);border-bottom-color:var(--teal)}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h2{margin:0 0 3px;font-size:16px;color:var(--navy)}
  .card .sub{font-size:12.5px;color:var(--soft);margin:0 0 12px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .muted{color:var(--soft)}
  .small{font-size:12.5px}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .btn:hover{background:var(--teal-600)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600}
  .btn.ghost:hover{border-color:var(--teal);background:var(--teal-soft)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .link{background:none;border:none;color:var(--teal-600);font-weight:700;cursor:pointer;padding:0;font-size:inherit}
  .note{border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5}
  .note.info{background:var(--blue-soft);border:1px solid #c3ddf2;color:#14496c}
  .note.good{background:var(--good-soft);border:1px solid #bfe3cf;color:#1d6b47}
  .note.warn{background:var(--amber-soft);border:1px solid #f3d7a6;color:#7a4b00}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .p-done{background:var(--good-soft);color:#1d6b47}
  .p-go{background:var(--amber-soft);color:#7a4b00}
  .p-new{background:#EEF1F5;color:#46546b}
  .p-late{background:var(--bad-soft);color:#9a2f1e}
  .p-lock{background:var(--plum-soft);color:#4b2a9a}
  .tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  table.t th{background:#F7F9FB;color:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  table.t tr:last-child td{border-bottom:none}
  table.t td.n, table.t th.n{text-align:right}
  .dm{position:fixed;inset:0;background:rgba(15,42,74,.45);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:60;overflow-y:auto}
  .dm.open{display:flex}
  .dmc{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px}
  .dmc.wide{max-width:1040px}
  .dm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dm-top h3{margin:0;font-size:17px;color:var(--navy)}
  .dm-top .x{background:none;border:none;font-size:24px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px}
  .dm-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
  .dm-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:calc(100% - 32px)}
  .toast.on{opacity:1}

  /* ---- the office manager's sheet ---- */
  .perhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .perhead .when{font-size:20px;font-weight:800;color:var(--navy);line-height:1.2}
  .perhead select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--navy);background:#fff}
  details.rules{border:1px solid var(--line);border-radius:12px;background:#FBFCFD;padding:10px 14px;font-size:13.5px}
  details.rules summary{cursor:pointer;font-weight:700;color:var(--navy)}
  details.rules ul{margin:8px 0 2px;padding-left:18px}
  details.rules li{margin:4px 0}
  table.sheet th.grp{background:#EEF3F8;color:var(--navy);text-align:center;font-size:11px;border-left:1px solid var(--line)}
  table.sheet th.grp:first-child{border-left:none}
  table.sheet td, table.sheet th{padding:7px 8px}
  table.sheet .nm{position:sticky;left:0;background:#fff;z-index:1;font-weight:700;color:var(--navy);min-width:150px;box-shadow:1px 0 0 var(--line)}
  table.sheet th.nm{background:#F7F9FB}
  table.sheet .gl{border-left:1px solid var(--line)}
  /* Headings wrap, so the columns sit closer together (Heather, 22/10) */
  table.sheet th{white-space:normal;vertical-align:bottom;line-height:1.25}
  table.sheet th.wr{max-width:78px;min-width:50px}
  /* No up/down arrows in the number boxes: they hid part of "41.33" in a narrow box */
  .in[type=number]{-moz-appearance:textfield;appearance:textfield}
  .in[type=number]::-webkit-inner-spin-button, .in[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  table.sheet th.grp{vertical-align:middle;white-space:nowrap}
  table.sheet td.nm{white-space:normal}
  .otwrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .otv{font-weight:800;color:#9a2f1e}
  .otv.ok{color:#1d6b47}
  .otwrap .otb{margin-left:0}
  .cut{margin-top:5px;font-size:12px;color:var(--soft);display:flex;align-items:center;gap:5px}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--soft)}
  label.fld .in{font-weight:400;font-size:14px;padding:8px 10px;width:100%}
  tr.gone td{color:#9AA5B5}
  .in{font:inherit;font-size:13.5px;padding:6px 7px;border:1px solid #D5DCE5;border-radius:8px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
  .in:focus{outline:2px solid var(--teal2);outline-offset:0;border-color:var(--teal)}
  input.in[type=number]{text-align:right}
  .in.bad{border-color:var(--bad);background:#FFF7F5}
  .tot{font-weight:800;color:var(--navy)}
  .otb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
  .otb.need{background:var(--bad-soft);color:#9a2f1e}
  .otb.ok{background:var(--good-soft);color:#1d6b47}
  .otb input{margin:0;accent-color:var(--teal)}
  .ro{color:var(--ink)}
  .ro.dim{color:#9AA5B5}
  .checks{display:flex;flex-direction:column;gap:6px}
  .check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;background:var(--amber-soft);border:1px solid #f3d7a6;color:#7a4b00;border-radius:10px;padding:8px 12px}
  .check b{color:#5c3800}
  .sendbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

  /* ---- Heather's side ---- */
  .offs{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
  .off{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .off .on{font-weight:800;color:var(--navy)}
  .off .co{font-size:11.5px;color:var(--soft);line-height:1.35}
  .flags{display:flex;flex-direction:column;gap:12px}
  .fgrp h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
  .fl{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .fl:last-child{border-bottom:none}
  .fl .who{font-weight:700;color:var(--navy)}
  table.comb td.co{background:#F2F6FA;color:var(--navy);font-weight:800;font-size:13px;white-space:normal}
  table.comb tr.subt td{background:#FAFBFC;font-weight:700;color:var(--soft)}
  table.comb tr.grand td{background:var(--navy);color:#fff;font-weight:800}
  table.comb td.miss{color:#9a2f1e;font-style:italic}
  /* The column headings again at the top of every office (Heather, 22/10) */
  table.comb tr.hd th{background:#F7F9FB;color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:right;white-space:normal;vertical-align:bottom;line-height:1.25;padding:7px 8px;border-bottom:1px solid var(--line)}
  table.comb tr.hd th.nm, table.comb tr.hd th:last-child{text-align:left}
  table.comb td, table.comb th{padding:7px 8px}
  table.comb .nm{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line);min-width:150px;white-space:normal}
  table.comb tr.hd .nm{background:#F7F9FB}
  table.comb tr.subt .nm{background:#FAFBFC}
  table.comb tr.grand .nm{background:var(--navy)}
  table.comb tr.docr td{background:#FBFCFD;font-size:12.5px;color:var(--soft);white-space:normal}
  table.comb tr.docr .nm{background:#FBFCFD;color:var(--navy);font-weight:700}
  .hin{width:64px;padding:4px 6px;font-size:13px}
  .nt{cursor:help;border-bottom:1px dotted var(--soft)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
  .kpi .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--soft)}
  .look{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;width:100%;max-width:360px}
  .log{font-size:12.5px;color:var(--soft);display:flex;flex-direction:column;gap:3px}
  @media(max-width:640px){
    .wrap{padding:16px 14px 90px}
    .dm{padding:0} .dmc{border-radius:0;min-height:100%}
    .perhead .when{font-size:17px}
  }
</style>

<script>
(function(){
  'use strict';
  const el=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=v=>{ const n=parseFloat(v); return isFinite(n)?n:0; };
  const r2=n=>Math.round(n*100)/100;
  const money=n=>n ? '$'+r2(n).toLocaleString('en-US',{minimumFractionDigits:(r2(n)%1?2:0), maximumFractionDigits:2}) : '—';
  const hrs=n=>n ? r2(n).toFixed(2) : '—';
  const pad=n=>String(n).padStart(2,'0');

  /* ---------- settings. Heather's answers (22/10/2026): holiday pay $100, on call $50 a weekend, mileage at the
     IRS rate ($0.76 now - it changes), sheets due Tuesday by 2 pm Central (Monday when that week has a holiday).
     The people and the doctors are made up. ---------- */
  const RATE={onCall:50, holiday:100, holidayHrs:8, mile:0.76};
  const HOLIDAYS=[{d:'2026-01-01',n:'New Year’s Day'},{d:'2026-05-25',n:'Memorial Day'},{d:'2026-07-03',n:'Independence Day'},
                  {d:'2026-09-07',n:'Labor Day'},{d:'2026-11-26',n:'Thanksgiving'},{d:'2026-12-25',n:'Christmas'},{d:'2027-01-01',n:'New Year’s Day'}];
  /* In the order of Heather's main sheet, one company each. by = who sends the sheet: the TC in Carlsbad and
     Las Cruces ("FOLC"), the clinic lead in Lubbock, the office manager everywhere else. own = the office's own
     columns on her main sheet: Phone (Lubbock), DIBS and POG (San Angelo), Sick (one Clovis person's
     grandfathered hours). */
  const OFFICES=[
    {k:'carlsbad',  n:'Carlsbad',   co:'Farnsworth Orthodontics, PLLC (Carlsbad)', by:'TC'},
    {k:'hobbs',     n:'Hobbs',      co:'Farnsworth Orthodontics Hobbs, PLLC', by:'office manager'},
    {k:'lubbock',   n:'Lubbock',    co:'Farnsworth Family Orthodontics, PLLC (Lubbock)', by:'clinic lead', own:[{k:'phone',n:'Phone'}]},
    {k:'clovis',    n:'Clovis',     co:'Farnsworth Orthodontics, P.C. (Clovis)', by:'office manager', own:[{k:'sick',n:'Sick hrs',hrs:true}]},
    {k:'sanangelo', n:'San Angelo', co:'Farnsworth Orthodontics San Angelo, PLLC', by:'office manager', own:[{k:'dibs',n:'DIBS'},{k:'pog',n:'POG'}]},
    {k:'mansfield', n:'Mansfield',  co:'Sunflower Orthodontics PLLC', by:'office manager'},
    {k:'crucesffo', n:'Cruces FFO', co:'Farnsworth Legacy – Farnsworth Orthodontics Las Cruces LLC', by:'TC'},
    {k:'cruceslco', n:'Cruces LCO', co:'Las Cruces Orthodontics – Farnsworth Orthodontics LLC', by:'office manager'}
  ];
  const OFF=Object.fromEntries(OFFICES.map(o=>[o.k,o]));
  const sender=o=>'the '+OFF[o].n+' '+OFF[o].by;
  /* Two columns of the combined sheet carry each office's own, their heading changing office by office - the
     way column J does on Heather's sheet. */
  const ownCols=o=>{ const a=(OFF[o].own||[]).slice(0,2); while(a.length<2) a.push(null); return a; };
  /* Made-up people: [offices, name, pay-period bonus, start date]. Harper is new (holiday pay comes after the
     90-day review); Elena works at both Las Cruces offices. */
  const PEOPLE=[
    [['carlsbad'],'Sofia Navarro',150,'2022-03-14'], [['carlsbad'],'Avery Brooks',125,'2023-06-05'], [['carlsbad'],'Jordan Ellis',125,'2021-09-20'],
    [['carlsbad'],'Marisol Rios',100,'2024-01-08'], [['carlsbad'],'Harper Quinn',75,'2026-08-31'], [['carlsbad'],'Daniela Ortiz',150,'2020-02-03'],
    [['hobbs'],'Gabriela Cruz',150,'2019-05-13'], [['hobbs'],'Riley Chen',125,'2022-08-01'], [['hobbs'],'Paola Mendez',75,'2025-02-10'],
    [['hobbs'],'Morgan Hale',150,'2021-11-15'], [['hobbs'],'Lucia Ramos',100,'2023-03-27'],
    [['lubbock'],'Casey Webb',150,'2020-07-06'], [['lubbock'],'Natalia Delgado',150,'2021-01-11'], [['lubbock'],'Reese Lowe',125,'2023-09-05'],
    [['lubbock'],'Adriana Silva',50,'2025-06-16'], [['lubbock'],'Peyton Shaw',150,'2019-10-21'],
    [['clovis'],'Valeria Castillo',150,'2020-04-20'], [['clovis'],'Jamie Foster',75,'2024-05-06'], [['clovis'],'Ximena Lara',75,'2025-01-13'],
    [['clovis'],'Kendall Price',125,'2022-02-28'], [['clovis'],'Rowan Pierce',75,'2024-11-04'],

  /* ---------- Heather: this pay period ---------- */
  function flags(n){
    const pr=P(n), F={ot:[], two:[], green:[], pay:[], miles:[], add:[]};
    OFFICES.forEach(o=>{ const s=get(n,o.k); if(s.status!=='sent') return;
      rowPeople(n,o.k).forEach(p=>{ const x=s.rows[p.id]; if(!x) return;
        [1,2].forEach(w=>{ const hh=num(x['w'+w]); if(hh>40) F.ot.push({p,o,t:r2(hh-40)+' h of overtime in week '+w+(otOK(x,w)?' — marked approved':' — <b>not</b> marked approved'), bad:!otOK(x,w)}); });
        if(x.mg==='Y'){ const c=calc(p,x,pr); F.green.push({p,o,t:'Missed a green day → '+(x.bonus==='none'?'no bonus':x.bonus==='partial'?esc(cutText(x))+' off ('+money(c.ppb)+' of '+money(bonusOf(p))+')':'kept the full bonus')+(x.notes?' · “'+esc(x.notes)+'”':'')}); }
        if(num(x.exc)>0) F.pay.push({p,o,t:'Exception commuter pay '+money(num(x.exc))+(x.notes?' · “'+esc(x.notes)+'”':'')});
        if(num(x.mkt)+num(x.oth)>0) F.miles.push({p,o,t:(num(x.mkt)?num(x.mkt)+' marketing mi':'')+(num(x.mkt)&&num(x.oth)?' + ':'')+(num(x.oth)?num(x.oth)+' other mi':'')+' → '+money(r2((num(x.mkt)+num(x.oth))*RATE.mile))+' reimbursement'+(num(x.oth)&&x.notes?' · “'+esc(x.notes)+'”':'')});
      }); });
    everyone().filter(p=>p.offices.length>1).forEach(p=>{
      const parts=p.offices.map(k=>{ const s=get(n,k), x=s.status==='sent'&&s.rows[p.id]; return x?{k, w1:num(x.w1), w2:num(x.w2)}:null; }).filter(Boolean);
      if(parts.length>1){ const w1=parts.reduce((a,q)=>a+q.w1,0), w2=parts.reduce((a,q)=>a+q.w2,0);
        F.two.push({p, o:OFF[parts[0].k], t:'Worked at '+parts.map(q=>OFF[q.k].n+' ('+hrs(q.w1+q.w2)+' h)').join(' and ')+' → <b>'+hrs(w1+w2)+' h combined</b>'+(w1>40||w2>40?' — over 40 in a week once combined':' — no overtime once combined'), bad:w1>40||w2>40}); }
    });
    if(n===CUR) S.added.filter(p=>p.byKind==='om' && S.bonus[p.id]===undefined && !num(p.bonus) && !S.removed[p.id]).forEach(p=>{
      const o=OFF[p.offices[0]];
      F.add.push({p, o, t:'Added by '+esc(sender(o.k))+', started '+esc(fmt(p.start))+'. Set their pay-period bonus in Settings.', bad:true}); });
    return F;
  }

      const pr=P(n), e=enteredOf(n); let hours=0,total=0,sent=0;
      OFFICES.forEach(o=>{ const s=get(n,o.k); if(s.status!=='sent') return; sent++; rowPeople(n,o.k).forEach(p=>{ const x=s.rows[p.id]; if(x){ const c=calc(p,x,pr); hours+=c.hours; total+=c.total; } }); });
      h+='<tr><td><b>#'+n+'</b></td><td>'+esc(span(pr.start,pr.end))+(pr.hol?' <span class="pill p-new">'+esc(pr.hol.n)+'</span>':'')+'</td><td>'+esc(fmt(pr.pay))+'</td><td>'+sent+' of '+OFFICES.length+'</td><td>'+(e?'<span class="pill p-lock">🔒 Entered '+esc(fmt(e.at))+'</span>':'<span class="pill p-go">In progress</span>')+'</td><td class="n">'+hrs(hours)+'</td><td class="n">'+money(total)+'</td><td class="n"><button class="btn ghost sm" data-act="open" data-v="'+n+'">Open</button></td></tr>';
    }
    return h+'</tbody></table></div></div></div>';
  }
  function lookHTML(){
    const q=String(look).trim().toLowerCase();
    const p=everyone().find(x=>x.n.toLowerCase()===q || disp(x).toLowerCase()===q);
    if(!p) return '<div class="small muted">Pick a name from the list.</div>';
    let h='<div class="tblwrap"><table class="t"><thead><tr><th>Pay period</th><th>Office</th><th class="n">Regular</th><th class="n">OT</th><th class="n">PTO</th><th class="n">Sick</th><th class="n">PP bonus</th><th class="n">On call</th><th>Notes</th></tr></thead><tbody>';
    for(let n=CUR;n>=CUR-9;n--){ const pr=P(n);
      p.offices.forEach(k=>{ const s=get(n,k), x=s.status==='sent'&&s.rows[p.id]; if(!x) return; const c=calc(p,x,pr);
        h+='<tr><td>#'+n+' · '+esc(span(pr.start,pr.end))+'</td><td>'+esc(OFF[k].n)+'</td><td class="n">'+hrs(c.reg)+'</td><td class="n">'+hrs(c.ot1+c.ot2)+'</td><td class="n">'+hrs(c.pto)+'</td><td class="n">'+hrs(c.sick)+'</td><td class="n">'+money(c.ppb)+'</td><td class="n">'+money(c.oc)+'</td><td style="white-space:normal">'+esc(x.notes||'')+'</td></tr>'; }); }
    return h+'</tbody></table></div>';
  }

      '<div class="tblwrap"><table class="t"><thead><tr><th>Name</th><th>Office</th><th class="n">PP bonus</th><th>Started</th><th>Holiday pay from</th><th></th><th></th></tr></thead><tbody>'+
      act.map(p=>'<tr><td><b>'+esc(disp(p))+'</b></td><td>'+esc(p.offices.map(k=>OFF[k].n).join(' + '))+'</td>'+
        '<td class="n">$ <input class="in" style="width:76px" type="number" min="0" step="5" inputmode="decimal" data-sb="'+p.id+'" value="'+(bonusOf(p)||'')+'" aria-label="Pay-period bonus for '+esc(disp(p))+'"></td>'+
        '<td>'+esc(fmt(p.start,{year:'numeric'}))+'</td><td>'+esc(fmt(eligibleOn(p),{year:'numeric'}))+(eligibleOn(p)>TODAY?' <span class="pill p-go">soon</span>':'')+'</td>'+
        '<td class="small">'+(p.sick?'<span class="pill p-new">Sick hours from before · holiday hours</span>':'')+(p.byKind==='om'&&S.bonus[p.id]===undefined&&!num(p.bonus)?' <span class="pill p-go">New — set the bonus</span>':'')+'</td>'+
        '<td class="n"><button class="link small" data-act="rmp" data-v="'+p.id+'">Take off</button></td></tr>').join('')+
      gone.map(p=>'<tr class="gone"><td>'+esc(disp(p))+'</td><td>'+esc(p.offices.map(k=>OFF[k].n).join(' + '))+'</td><td colspan="4" class="small muted">Taken off '+esc(fmt(S.removed[p.id]))+' — their past sheets are kept</td><td class="n"><button class="link small" data-act="backp" data-v="'+p.id+'">Bring back</button></td></tr>').join('')+
      '</tbody></table></div></div>';
    const docs=everyDoc().slice().sort((a,b)=>(OFF[a.office].n+a.n).localeCompare(OFF[b.office].n+b.n));
    h+='<div class="card"><div class="row" style="margin-bottom:8px"><div class="grow"><h2>Doctors paid by the day</h2><p class="sub" style="margin:0">Not on salary: their office enters their days worked each week. Doctors on salary aren’t listed.</p></div><button class="btn ghost sm" data-act="adddoc" data-v="">＋ Add a doctor</button></div>'+
      (docs.length?'<div class="tblwrap"><table class="t"><thead><tr><th>Doctor</th><th>Office</th><th></th></tr></thead><tbody>'+
        docs.map(d=>S.docGone[d.id]
          ? '<tr class="gone"><td>'+esc(d.n)+'</td><td>'+esc(OFF[d.office].n)+' <span class="small muted">· taken off '+esc(fmt(S.docGone[d.id]))+'</span></td><td class="n"><button class="link small" data-act="backdoc" data-v="'+d.id+'">Bring back</button></td></tr>'
          : '<tr><td><b>'+esc(d.n)+'</b></td><td>'+esc(OFF[d.office].n)+'</td><td class="n"><button class="link small" data-act="deldoc" data-v="'+d.id+'">Take off</button></td></tr>').join('')+'</tbody></table></div>'
        :'<div class="small muted">None yet.</div>')+'</div>';

  }

  /* ---------- dialogs, download, toast ---------- */
  function openDlg(html, wide){ el('dlgcard').className='dmc'+(wide?' wide':''); el('dlgcard').innerHTML=html; el('dlg').classList.add('open'); }
  function closeDlg(){ el('dlg').classList.remove('open'); }
  let tt=null; function toast(m){ const t=el('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600); }
  const top=t=>'<div class="dm-top"><h3>'+t+'</h3><button class="x" data-act="close" aria-label="Close">×</button></div>';
  function addPersonDlg(o){
    openDlg(top(o?'Add someone to '+esc(OFF[o].n)+'’s sheet':'Add a person')+'<div class="dm-body">'+
      '<div class="row"><label class="fld grow">First name<input class="in" id="nf" autocomplete="off"></label><label class="fld grow">Last name<input class="in" id="nl" autocomplete="off"></label></div>'+
      '<div class="row"><label class="fld grow">Start date<input class="in" id="ns" type="date" value="'+TODAY+'"></label>'+
      (o?'':'<label class="fld grow">Office<select class="in" id="no">'+OFFICES.map(q=>'<option value="'+q.k+'">'+esc(q.n)+'</option>').join('')+'</select></label><label class="fld grow">Pay-period bonus ($)<input class="in" id="nb" type="number" min="0" step="5" inputmode="decimal"></label>')+'</div>'+
      '<div class="note info">They go in alphabetically by last name, like the payroll software.'+(o?' Heather sets their pay-period bonus.':'')+' Holiday pay starts 90 days after the start date.</div>'+
      '<div id="nerr" class="small" style="color:#9a2f1e;font-weight:700"></div></div>'+
      '<div class="dm-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="addok" data-v="'+(o||'')+'">Add</button></div>');
    setTimeout(()=>{ const f=el('nf'); if(f) f.focus(); },30);
  }
  function addDocDlg(o){
    openDlg(top('Add a doctor paid by the day')+'<div class="dm-body">'+
      '<label class="fld">Name<input class="in" id="dn" autocomplete="off" placeholder="Dr. …"></label>'+
      (o?'<div class="small muted">At '+esc(OFF[o].n)+'.</div>':'<label class="fld">Office<select class="in" id="do">'+OFFICES.map(q=>'<option value="'+q.k+'">'+esc(q.n)+'</option>').join('')+'</select></label>')+
      '<div id="derr" class="small" style="color:#9a2f1e;font-weight:700"></div></div>'+
      '<div class="dm-foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="adddocok" data-v="'+(o||'')+'">Add</button></div>');
    setTimeout(()=>{ const f=el('dn'); if(f) f.focus(); },30);
  }
  function csv(n){
    const pr=P(n), q=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const lines=[['Pay period #'+n+' - '+span(pr.start,pr.end)+', paid '+fmt(pr.pay,{year:'numeric'})], ['Week 1: '+span(pr.start,pr.w1end)+'   Week 2: '+span(pr.w2start,pr.end)], []];
    OFFICES.forEach(o=>{ const s=get(n,o.k), own=ownCols(o.k).filter(Boolean);
      lines.push([o.co]);
      lines.push(['Employee Name','Regular Hours','OT Wk 1','OT Wk 2','PPBonus','PTO','Goal','TC/OM','Holiday','Reimburse','On Call'].concat(own.map(c=>c.n),['Extra','Total','Notes']));
      if(s.status!=='sent'){ lines.push(['(not sent yet)']); lines.push([]); return; }
      rowPeople(n,o.k).forEach(p=>{ const x=s.rows[p.id]; if(!x) return; const c=calc(p,x,pr);
        lines.push([disp(p), c.reg, c.ot1||'', c.ot2||'', c.ppb||'', c.pto||'', c.goal||'', c.tcom||'', c.holH?c.holH+' hrs':(c.hol||''), c.reimb||'', c.oc||'']
          .concat(own.map(col=>col.hrs?(c.sick||''):(num(x[col.k])||'')), [c.extra||'', c.total, x.notes||''])); });
      const ds=docRows(n,o.k);
      if(ds.length){ lines.push(['Doctor (paid by the day)','Days Wk 1','Days Wk 2','Total days']);
        ds.forEach(d=>{ const v=(s.docs||{})[d.id]||{}; lines.push([d.n, daySet(v.w1)?num(v.w1):'', daySet(v.w2)?num(v.w2):'', num(v.w1)+num(v.w2)]); }); }
      lines.push([]); });
    // The BOM tells Excel it is UTF-8, so the dashes in the dates (and any accents in names) come out right
    const blob=new Blob(['\ufeff'+lines.map(l=>l.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Payroll #'+n+' ('+span(pr.start,pr.end).replace(/\s/g,' ')+').csv';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  }

  /* ---------- typing in the sheet: save, re-add, re-check - without redrawing what you're typing in ---------- */
  function onField(t, redraw){
    const o=R().office, n=per, s=mine(n,o), pid=t.dataset.p, f=t.dataset.f, x=s.rows[pid]=s.rows[pid]||blank();
    if(f==='ot1'||f==='ot2') x[f]=t.checked;
    else if(['notes','comTo','mg','bonus','cutBy'].indexOf(f)>=0) x[f]=t.value;
    else x[f]=t.value===''?'':num(t.value);
    if(f==='mg' && t.value==='Y' && x.bonus==='full'){ x.bonus='none'; toast('Missed a green day — bonus set to None. Change it if one of your exceptions applies.'); }
    if(s.status==='sent') s.changed=true;
    save();
    if(redraw){ render(); return; }
    const p=who(pid), c=calc(p,x,P(n));
    const g=el('reg-'+pid); if(g) g.innerHTML=regHTML(c);
    [1,2].forEach(w=>{ const C=el('ot'+w+'-'+pid); if(C) C.innerHTML=otHTML(p,x,c,w,true); });
    const k=el('checks'); if(k) k.innerHTML=checksHTML(n,o);
  }
  function onDoc(t){
    const o=R().office, s=mine(per,o), d=t.dataset.d, f=t.dataset.f;
    s.docs=s.docs||{}; const v=s.docs[d]=s.docs[d]||{};
    v[f]=t.value===''?'':num(t.value);
    if(s.status==='sent') s.changed=true;
    save();
    const c=el('dt-'+d); if(c) c.innerHTML='<span class="tot">'+daysText(v)+'</span>';
    const k=el('checks'); if(k) k.innerHTML=checksHTML(per,o);
  }
  function onHeather(t){
    const s=mine(per,t.dataset.o), pid=t.dataset.p, x=s.rows[pid]=s.rows[pid]||blank();
    x[t.dataset.hf]=t.value===''?'':num(t.value);
    save(); combTotals(per);
  }
  document.addEventListener('input', e=>{ const t=e.target; if(!t.dataset) return;
    if(t.dataset.d){ onDoc(t); return; }
    if(t.dataset.hf){ onHeather(t); return; }
    if(t.dataset.sb){ if(t.value==='') delete S.bonus[t.dataset.sb]; else S.bonus[t.dataset.sb]=num(t.value); save(); return; }
    if(t.dataset.f && t.tagName==='INPUT' && t.type!=='checkbox') onField(t,false);
    if(t.id==='look'){ look=t.value; const r=el('lookres'); if(r) r.innerHTML=lookHTML(); } });
  document.addEventListener('change', e=>{ const t=e.target;
    if(t.id==='persona'){ as=t.value; try{ localStorage.setItem('ph_pay_as', as); }catch(_){} tab='sheet'; per=CUR; render(); return; }
    if(t.id==='perpick'){ per=+t.value; render(); return; }
    if(t.dataset && t.dataset.f && !t.dataset.d && (t.tagName==='SELECT' || t.type==='checkbox')) onField(t, true); });
  document.addEventListener('click', e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.dataset.act, v=b.dataset.v;
    if(act==='tab'){ tab=v; per=CUR; render(); return; }
    if(act==='open'){ tab='sheet'; per=+v; render(); window.scrollTo({top:0}); return; }
    if(act==='omopen'){ tab='sheet'; per=+v; render(); window.scrollTo({top:0}); return; }
    if(act==='send'){
      const o=R().office, list=issues(per,o);
      if(list.length){ toast('Fix the '+list.length+' thing'+(list.length>1?'s':'')+' in yellow first'); const c=el('checks'); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); return; }
      const pr=P(per), s=get(per,o), ppl=rowPeople(per,o);
      openDlg(top('Send to Heather?')+'<div class="dm-body"><p style="margin:0">'+esc(OFF[o].n)+'’s payroll for <b>'+esc(span(pr.start,pr.end))+'</b> — '+ppl.length+' people, '+hrs(ppl.reduce((a,p)=>a+num((s.rows[p.id]||{}).w1)+num((s.rows[p.id]||{}).w2),0))+' hours.</p><div class="note info">Heather sees it straight away. You can still change it until she enters payroll — she’ll see what changed.</div></div><div class="dm-foot"><button class="btn ghost" data-act="close">Not yet</button><button class="btn" data-act="sendok">Send</button></div>');
      return;
    }
    if(act==='sendok'){
      const o=R().office, s=mine(per,o), at=nowISO(), again=s.status==='sent';
      s.status='sent'; s.at=s.at||at; s.log=s.log||[]; s.log.push({at, t:(again?'Changes sent by ':'Sent by ')+sender(o)}); delete s.changed;
      save(); closeDlg(); render(); toast(again?'Changes sent to Heather':'Sent to Heather ✓'); return;
    }
    if(act==='view'){
      const n=per, s=get(n,v), e=enteredOf(n);
      openDlg(top(esc(OFF[v].n)+' · pay period #'+n+' — as sent')+'<div class="dm-body">'+sheetTable(n,v,false)+docsHTML(n,v,false)+
        '<div class="log">'+(s.log||[]).map(l=>'<div>• '+esc(fmtT(l.at))+' — '+esc(l.t)+'</div>').join('')+(e?'<div>• '+esc(fmtT(e.at))+' — Entered in payroll by '+esc(e.by)+'</div>':'')+'</div></div>', true);
      return;
    }
    if(act==='remind'){ toast('Reminder to '+sender(v)+' — mock-up, nothing is sent'); return; }
    if(act==='csv'){ csv(per); toast('Downloaded — opens in Excel'); return; }
    if(act==='enter'){ S.entered[per]={at:nowISO(), by:'Heather'}; save(); render(); toast('Entered — office sheets for #'+per+' are locked'); return; }
    if(act==='reopen'){ S.entered[per]=null; save(); render(); toast('Reopened — office sheets can be changed again'); return; }
    if(act==='close'){ closeDlg(); return; }
    if(act==='reset'){ S={v:2}; fresh(); save(); per=CUR; tab='sheet'; render(); toast('Sample data reset'); return; }
    if(act==='addp'){ addPersonDlg(v); return; }
    if(act==='addok'){
      const first=(el('nf').value||'').trim(), last=(el('nl').value||'').trim(), start=el('ns').value, o=v||(el('no')&&el('no').value);
      if(!first || !last){ el('nerr').textContent='Their first and last name, please.'; return; }
      if(!start){ el('nerr').textContent='Their start date, please — holiday pay counts from it.'; return; }
      const heather=!v, p={id:'n'+Date.now().toString(36), offices:[o], first, last, n:first+' '+last, start,
        bonus:heather?num(el('nb').value):0, byKind:heather?'coo':'om', at:nowISO(), period:CUR};
      S.added.push(p);
      if(!heather){ const s=mine(CUR,o); s.rows[p.id]=blank(); if(s.status==='sent') s.changed=true; }
      save(); closeDlg(); render(); toast(disp(p)+' added'+(heather?'':' — Heather sets their bonus')); return;
    }
    if(act==='unadd'){
      const p=who(v); if(!p) return;
      S.added=S.added.filter(q=>q.id!==v);
      p.offices.forEach(o=>{ const s=S.subs[CUR]&&S.subs[CUR][o]; if(s && s.rows) delete s.rows[v]; });
      save(); render(); toast(disp(p)+' taken off'); return;
    }
    if(act==='rmp'){
      const p=who(v); if(!p) return;
      openDlg(top('Take '+esc(disp(p))+' off the sheets?')+'<div class="dm-body"><p style="margin:0">From now on they won’t be on '+esc(p.offices.map(k=>OFF[k].n).join(' or '))+'’s sheet. Every sheet they’re already on stays exactly as it is, and you can bring them back.</p></div>'+
        '<div class="dm-foot"><button class="btn ghost" data-act="close">Keep them</button><button class="btn" data-act="rmpok" data-v="'+esc(v)+'">Take them off</button></div>');
      return;
    }
    if(act==='rmpok'){ S.removed[v]=TODAY; save(); closeDlg(); render(); toast('Taken off — past sheets kept'); return; }
    if(act==='backp'){ delete S.removed[v]; save(); render(); toast('Back on the sheets'); return; }
    if(act==='adddoc'){ addDocDlg(v); return; }
    if(act==='adddocok'){
      let name=(el('dn').value||'').trim(); const o=v||(el('do')&&el('do').value);
      if(!name){ el('derr').textContent='Their name, please.'; return; }
      if(!/^dr\.?\s/i.test(name)) name='Dr. '+name;
      S.docAdd.push({id:'dn'+Date.now().toString(36), office:o, n:name});
      save(); closeDlg(); render(); toast(name+' added'); return;
    }
    if(act==='deldoc'){
      const d=everyDoc().find(x=>x.id===v); if(!d) return;
      openDlg(top('Take '+esc(d.n)+' off?')+'<div class="dm-body"><p style="margin:0">They won’t be on '+esc(OFF[d.office].n)+'’s sheet from now on. Days already sent stay as they are, and they can be brought back.</p></div>'+
        '<div class="dm-foot"><button class="btn ghost" data-act="close">Keep them</button><button class="btn" data-act="deldocok" data-v="'+esc(v)+'">Take them off</button></div>');
      return;
    }
    if(act==='deldocok'){ S.docGone[v]=TODAY; save(); closeDlg(); render(); toast('Taken off — days already sent are kept'); return; }
    if(act==='backdoc'){ delete S.docGone[v]; save(); render(); toast('Back on the sheet'); return; }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDlg(); });
  el('dlg').addEventListener('click', e=>{ if(e.target===el('dlg')) closeDlg(); });
  el('persona').innerHTML=Object.keys(ROLES).map(k=>'<option value="'+k+'"'+(k===as?' selected':'')+'>'+esc(ROLES[k].label)+'</option>').join('');
  render();
})();
