<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home-Brace · Alerts test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="alerts-test.webmanifest">
<link rel="icon" href="../assets/favicon.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HB Alerts">
<meta name="theme-color" content="#0F2A4A">
<meta name="robots" content="noindex">
<!-- PHONE ALERTS - THE TEST PAGE (22/10/2026, Cory: "go", sandbox first). Proves the whole path on a real phone before
     anything else uses it: turn alerts on for this device, then Home-Brace's alert sender (its test slot) sends a real
     alert to it. No sign-in and no data here - only this device's own alert address, kept on this device. Sandbox only:
     the production deploy leaves this page out. -->
<style>
  :root{ --navy:#0F2A4A; --teal:#149B96; --teal2:#2BC0B8; --teal-600:#0F827E; --teal-soft:#E5F4F3; --ink:#1F2D3D; --soft:#56627A;
         --line:#E4E8EE; --canvas:#F4F6F8; --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber-soft:#FFF4E2; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .ribbon{background:#F2A03D;color:#3a2400;text-align:center;font-size:12.5px;font-weight:600;padding:6px 14px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .hdr{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:11px}
  .hdr img{width:34px;height:34px;border-radius:50%}
  .hdr b{font-size:18px}.hdr i{font-style:normal;color:var(--teal2)}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:24px;color:var(--navy)}
  .lede{margin:0;color:var(--soft);font-size:15px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);display:flex;flex-direction:column;gap:12px}
  .state{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:16px}
  .dot{width:12px;height:12px;border-radius:50%;background:#B8C2CF;flex:none}
  .dot.on{background:var(--good)}.dot.bad{background:var(--bad)}.dot.wait{background:#F2A03D}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer;width:100%}
  .btn:hover{background:var(--teal-600)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600}
  .btn:disabled{opacity:.55;cursor:wait}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding-left:36px;font-size:15px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .ui{display:inline-block;border:1px solid #cbd5e1;border-radius:7px;padding:0 7px;font-size:14px;font-weight:700;background:#fff;white-space:nowrap}
  .ui svg{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .msg{border-radius:12px;padding:11px 14px;font-size:14.5px}
  .msg.ok{background:var(--good-soft);color:#1d6b47}.msg.err{background:var(--bad-soft);color:#9a2f1e}.msg.info{background:var(--teal-soft);color:#0c5b57}
  .msg[hidden]{display:none}
  .small{font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
<div class="ribbon">TEST — phone alerts for Home-Brace. No sign-in, no real data.</div>
<div class="hdr"><img src="../assets/logo-mark.png?v=2" alt=""><b>Home-<i>Brace</i></b></div>
<div class="wrap">
  <div><h1>Phone alerts — test</h1><p class="lede">Turn alerts on for this phone or computer, then send yourself one. It's the same alert a payroll reminder or a chat message would be.</p></div>
  <div class="card">
    <div class="state"><span class="dot" id="dot"></span><span id="stateText">Checking…</span></div>
    <div id="main"></div>
    <div class="msg" id="msg" hidden></div>
  </div>
  <div class="small" id="details"></div>
</div>

<script src="alerts.js?v=hc114"></script>
<script>
(function(){
  'use strict';
  const A=window.PH_ALERTS, el=id=>document.getElementById(id);
  const SHARE='<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 11H5v10h14V11h-2"/></svg>';
  const SAMPLES={
    test:{title:'Home-Brace alerts work ✓', body:'This is how a payroll reminder or a chat message arrives on this device.', url:A.here('alerts-test.html'), tag:'hb-test'},
    payroll:{title:'Payroll sheet due today by 2 pm', body:'Carlsbad · pay period #22 - tap to open it', url:A.here('payroll.html'), tag:'hb-payroll'},
    chat:{title:'Gabriela Garrison · Carlsbad office', body:'🎥 Sent a video', url:A.here('chat.html'), tag:'hb-chat'}
  };
  function say(t, kind){ const m=el('msg'); m.hidden=!t; m.className='msg '+(kind||'info'); m.textContent=t||''; }
  function render(){
    const st=A.state(), main=el('main');
    const label={install:'Add Home-Brace to your home screen first', unsupported:'This browser can’t get alerts', blocked:'Alerts are blocked on this device', off:'Alerts are off on this device', on:'Alerts are on for this device'}[st];
    el('stateText').textContent=label;
    el('dot').className='dot'+(st==='on'?' on':st==='blocked'||st==='unsupported'?' bad':st==='install'?' wait':'');
    if(st==='install') main.innerHTML='<ol class="steps">'+
      '<li>Tap the Share button <span class="ui">'+SHARE+'</span> at the bottom of Safari.</li>'+
      '<li>Tap <span class="ui">Add to Home Screen</span>, then <span class="ui">Add</span>.</li>'+
      '<li>Open <b>HB Alerts</b> from your home screen. This page opens - tap <b>Turn on alerts</b> there.</li></ol>'+
      '<div class="small">Apple only lets web apps send alerts once they’re on the home screen (iOS 16.4 or newer).</div>';
    else if(st==='unsupported') main.innerHTML='<div class="small">Try Safari on an iPhone (after adding it to the home screen), or Chrome, Edge, Safari or Firefox on Android or a computer.</div>';
    else if(st==='blocked') main.innerHTML='<div class="small">This device said no to alerts before. '+(A.IOS?'iPhone: <b>Settings → Notifications → HB Alerts → Allow Notifications</b>, then come back.':'Click the icon left of the web address → <b>Notifications → Allow</b>, then reload.')+'</div>';
    else if(st==='off') main.innerHTML='<button class="btn" id="on">Turn on alerts</button><div class="small">Your '+(A.IOS?'iPhone':'browser')+' asks “Allow notifications?” - tap <b>Allow</b>.</div>';
    else main.innerHTML='<button class="btn" data-s="test">Send me a test alert</button>'+
      '<div class="small">It arrives in about 5 seconds - '+(A.IOS||/Android/.test(navigator.userAgent)?'lock your phone or go to the home screen now.':'switch to another window to see it pop up.')+'</div>'+
      '<div class="row"><button class="btn ghost" data-s="payroll">Sample payroll reminder</button><button class="btn ghost" data-s="chat">Sample chat message</button></div>'+
      '<button class="btn ghost" id="off">Turn alerts off</button>';
    const s=A.saved(), host=s && s.endpoint ? new URL(s.endpoint).hostname : '';
    el('details').textContent='This device: '+(A.IOS?'iPhone / iPad':/Android/.test(navigator.userAgent)?'Android':'computer')+(A.INSTALLED?' (home-screen app)':'')+
      ' · permission: '+('Notification' in window?Notification.permission:'n/a')+(host?' · alert service: '+(/apple/.test(host)?'Apple':/google/.test(host)?'Google':/windows/.test(host)?'Microsoft':/mozilla/.test(host)?'Mozilla':host):'');
  }
  document.addEventListener('click', async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.id==='on'){
      b.disabled=true; say('');
      try{ await A.enable(); render(); say('Alerts are on ✓ Sending your first one now…','ok');
        await A.send(Object.assign({delay:5}, SAMPLES.test)); say('Sent ✓ It arrives in about 5 seconds.','ok'); }
      catch(err){ render(); say(err.message==='dismissed'?'No answer - tap Turn on alerts again and choose Allow.':err.message==='blocked'?'Alerts were not allowed on this device.':'Couldn’t turn alerts on: '+err.message,'err'); }
      return;
    }
    if(b.id==='off'){ await A.disable(); render(); say('Alerts are off on this device.','info'); return; }
    if(b.dataset.s){
      b.disabled=true; say('Sending…','info');
      try{ await A.send(Object.assign({delay:5}, SAMPLES[b.dataset.s])); say('Sent ✓ It arrives in about 5 seconds.','ok'); }
      catch(err){ render(); say(err.message==='off'?'Alerts are off on this device - turn them on first.':'Couldn’t send: '+err.message,'err'); }
      b.disabled=false;
    }
  });
  if(navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.type==='ph-alert') say('Arrived ✓ '+new Date().toLocaleTimeString()+' - “'+(e.data.message.title||'')+'”','ok');
  });
  render();
})();
</script>
</body>
</html>
