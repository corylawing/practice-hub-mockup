<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin (V1) — Home-Brace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.png" type="image/png">
<meta name="theme-color" content="#0F2A4A">
<meta name="description" content="Home-Brace V1 — admin console: people, teams, section files and who can access what.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Home-Brace">
<meta property="og:title" content="Admin (V1) · Home-Brace">
<meta property="og:description" content="Manage people, teams, files, and control who can access which sections.">
<meta property="og:image" content="https://corylawing.github.io/practice-hub-mockup/assets/og-image.png">
<meta property="og:url" content="https://corylawing.github.io/practice-hub-mockup/v1/admin.html">
<style>
  :root{
    --navy:#0F2A4A; --navy2:#25456e; --teal:#149B96; --teal2:#2BC0B8; --teal-soft:#E5F4F3; --teal-600:#0F827E;
    --ink:#1F2D3D; --ink-soft:#56627A; --soft:#56627A; --line:#E4E8EE; --canvas:#F4F6F8; --white:#fff;
    --good:#2E9E6B; --good-soft:#E7F4EE; --bad:#D7503A; --bad-soft:#FBEAE7; --amber:#F2A03D;
    --blue:#1f6f9e; --blue-soft:#E3F0FA;
    --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.06);
    --shadow-lg:0 10px 30px rgba(15,42,74,.12); --radius:14px; --maxw:1080px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{color:var(--navy);margin:0}
  .ribbon{background:var(--amber);color:#3a2400;text-align:center;font-size:13px;font-weight:600;padding:6px 14px}
  .hdr{background:var(--navy);color:#fff}
  .hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:13px 20px}
  .mark{width:34px;height:34px;flex:none;display:block}
  .mark img{width:34px;height:34px;display:block;border-radius:9px}
  .brand{font-weight:700;font-size:18px;color:#fff;line-height:1.1}
  .brand i{font-style:normal;color:var(--teal2)}
  .brand small{display:block;font-weight:500;font-size:12px;color:#9fb4d0}
  .v1{background:rgba(255,255,255,.15);color:#eaf1fb;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-left:6px}
  .v1nav{background:var(--navy2)}
  .v1nav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .v1nav a{color:#cdd9ea;font-size:14px;font-weight:600;padding:13px 15px;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .v1nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .v1nav a.active{color:#fff;border-bottom-color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:26px 20px 90px}
  .page-head h1{font-size:26px}
  .page-head p{margin:4px 0 0;color:var(--soft);font-size:15px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 22px;flex-wrap:wrap}
  .tab{background:none;border:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--soft);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--navy)}
  .tab.active{color:var(--navy);border-bottom-color:var(--teal)}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .toolrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{flex:1;min-width:200px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;box-shadow:var(--shadow)}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:9px;padding:10px 15px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn:hover{background:var(--teal-600)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--teal);color:var(--teal-600)}
  .intro{background:var(--teal-soft);border:1px solid #c4e6e3;border-radius:12px;padding:13px 16px;font-size:14px;color:#0c5b57;margin-bottom:18px}
  .intro b{color:#0a4d49}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  table.u{width:100%;border-collapse:collapse;background:#fff;min-width:720px}
  table.u th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:700;text-align:left;padding:12px 14px;background:#fafbfc;border-bottom:1px solid var(--line)}
  table.u td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  table.u tbody tr{cursor:pointer}
  table.u tbody tr:hover td{background:#f2fbfa}
  table.u tr:last-child td{border-bottom:none}
  .who{display:flex;align-items:center;gap:10px}
  .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
  .uname{font-weight:600;color:var(--navy)}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:12px;font-weight:600;background:var(--canvas);color:var(--ink);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.active{background:var(--good-soft);color:var(--good)}
  .pill.inactive{background:#eef1f5;color:#8a94a6}
  .pill.paused{background:#FFF6E9;color:#946011}
  /* access matrix */
  .mx-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  table.mx{border-collapse:collapse;background:#fff;min-width:960px;width:100%}
  table.mx th{font-size:11px;font-weight:700;color:var(--navy);background:#fafbfc;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  table.mx th.corner{text-align:left;position:sticky;left:0;z-index:2;min-width:170px}
  table.mx th.team{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:170px;font-size:13px;color:var(--ink);border-bottom:1px solid var(--line);white-space:nowrap}
  table.mx td{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;text-align:center}
  .lvl{width:100%;border:none;border-radius:7px;padding:7px 4px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
  .lvl.none{background:#f4f6f8;color:#b4bdc9}
  .lvl.view{background:var(--blue-soft);color:var(--blue)}
  .lvl.add{background:var(--good-soft);color:var(--good)}
  .lvl.edit{background:var(--teal-soft);color:var(--teal-600)}
  .lvl.manage{background:var(--navy);color:#fff}
  table.mx th.grp{background:#f2f5f9;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-size:10px;text-align:center}
  .tedit{border:none;background:none;color:var(--soft);cursor:pointer;font-size:12px;margin-left:6px;opacity:.45;font-family:inherit}
  table.mx tr:hover .tedit{opacity:.9}
  .tedit:hover{color:var(--teal-600)}
  .secwho{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .mini-btn{padding:5px 11px;font-size:12.5px}
  .segrow{display:flex;gap:7px;flex-wrap:wrap}
  .segb{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit}
  .segb.on{border-color:var(--teal);color:var(--teal-600);background:var(--teal-soft)}
  .iconrow{display:flex;gap:6px;flex-wrap:wrap}
  .icb{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer;line-height:1}
  .icb.on{border-color:var(--teal);background:var(--teal-soft)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
  /* files / sections */
  .secacc{display:flex;flex-direction:column;gap:10px}
  .sec{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .sec-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .sec-h:hover{background:#fafbfc}
  .sec-h .car{transition:transform .2s;color:var(--soft);font-size:13px}
  .sec.open .sec-h .car{transform:rotate(90deg)}
  .sec-h .sn{font-weight:700;color:var(--navy);font-size:15px}
  .sec-b{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
  .sec.open .sec-b{display:block}
  .folder{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fafbfc}
  .folder-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);font-size:13.5px;flex-wrap:wrap}
  .file{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .file:last-child{border-bottom:none}
  .file .fn{flex:1;color:var(--ink)}
  .file .fic{color:var(--soft)}
  .aud{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;cursor:pointer;border:1px solid transparent;white-space:nowrap;font-family:inherit}
  .aud.everyone{background:var(--blue-soft);color:var(--blue)}
  .aud.location{background:var(--teal-soft);color:var(--teal-600)}
  .aud.team{background:#efe9fb;color:#6b3fd0}
  .aud.locked{cursor:default;opacity:.92}
  .addfile{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mini{font-size:12px;color:var(--soft)}
  /* tap-to-pick menu (replaces click-to-cycle) */
  .pk{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:200px}
  .pk button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;font-family:inherit;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left}
  .pk button:hover{background:var(--canvas)}
  .pk button.cur{background:var(--teal-soft)}
  .pk .sw{width:15px;height:15px;border-radius:4px;flex:none;border:1px solid rgba(15,42,74,.08)}
  .pk small{display:block;color:var(--soft);font-size:11px;font-weight:500;line-height:1.3}
  .pk .ck{margin-left:auto;color:var(--teal-600);font-weight:800}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(15,42,74,.5);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
  .ov.open{display:flex}
  .modal{background:#fff;width:100%;max-width:880px;border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;margin:auto}
  .m-top{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
  .m-top .x{margin-left:auto;border:none;background:none;font-size:24px;color:var(--soft);cursor:pointer;line-height:1}
  .m-body{padding:20px;max-height:70vh;overflow:auto}
  .m-foot{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfc}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  /* Team and office chips need the FULL modal width — squeezed into a half-width column
     they wrapped one or two per line and the panel read as cramped. */
  .fullband{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .fullband .fld{margin-bottom:16px}
  .m-body textarea.tall{min-height:190px;resize:vertical}
  .minigrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){ .minigrid{grid-template-columns:1fr} }
  .panel-lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .msbadge{background:#eef3fb;color:#2b5f9e;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
  .selfbadge{background:var(--good-soft);color:var(--good);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:3px}
  .fld .val{font-size:14.5px;color:var(--ink);font-weight:500}
  .fld select{width:100%}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .fld textarea{resize:vertical;min-height:60px}
  .fld.ro .val{background:#fafbfc;border:1px dashed var(--line);border-radius:8px;padding:8px 11px}
  .accessbox{background:var(--teal-soft);border:1px solid #c4e6e3;border-radius:12px;padding:14px 16px;margin-top:4px}
  .accessbox h4{margin:0 0 8px;font-size:13px;color:#0a4d49;text-transform:uppercase;letter-spacing:.04em}
  .acc-line{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--ink)}
  .acc-line b{font-weight:700}
  .teampick{display:flex;flex-wrap:wrap;gap:8px}
  .tp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit;line-height:1.2}
  .tp.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  @media(max-width:640px){ .grid2{grid-template-columns:1fr} }
</style>
<script src="user.js?v=hb36"></script>

<body>
<div class="ribbon">PROTOTYPE — admin console concept for validation. Real build: people sync from Microsoft 365; access is managed here.</div>
<header class="hdr">
  <div class="hdr-in">
    <span class="mark" aria-label="Home-Brace"><img src="../assets/logo-mark.png" alt="" width="34" height="34"></span>
    <span class="brand">Home-<i>Brace</i><small>Admin Console</small></span>
    <span class="v1">V1 preview</span>
  </div>
</header>
<nav class="v1nav"><div class="v1nav-in" id="nav"></div></nav>

<div class="wrap">
  <div class="page-head">
    <h1>Admin Console</h1>
    <p>One simple rule: a person's <b>team</b> decides what they can do; their <b>location</b> decides which offices' stuff they see.</p>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-t="users" onclick="AD.tab('users')">People</button>
    <button class="tab" data-t="access" onclick="AD.tab('access')">Teams &amp; Access</button>
    <button class="tab" data-t="files" onclick="AD.tab('files')">Document Sections</button>
    <button class="tab" data-t="locs" onclick="AD.tab('locs')">Locations</button>
  </div>

  <div id="view"></div>
</div>

<div id="modal" class="ov"><div class="modal" id="modalCard"></div></div>

<script>
(function(){
  const PAL=['#149B96','#25456e','#946011','#6b3fd0','#b03a63','#2E7D52','#1f6f9e','#b0442f'];
  const DEFAULT_LOCS=[
    {n:'Carlsbad',brand:'FFO',state:'New Mexico',tz:'Mountain Time'},{n:'Clovis',brand:'FFO',state:'New Mexico',tz:'Mountain Time'},
    {n:'Hobbs',brand:'FFO',state:'New Mexico',tz:'Mountain Time'},{n:'Cruces LCO',brand:'LCO',state:'New Mexico',tz:'Mountain Time'},
    {n:'Cruces FFO',brand:'FFO',state:'New Mexico',tz:'Mountain Time'},{n:'Lubbock',brand:'FFO',state:'Texas',tz:'Central Time'},
    {n:'San Angelo',brand:'FFO',state:'Texas',tz:'Central Time'},{n:'Mansfield',brand:'SUN',state:'Texas',tz:'Central Time'}
  ];
  // Locations live in user.js so Admin and Schedule are the SAME list.
  function loadLocs(){ return PH.locations(); }
  function saveLocs(){ PH.saveLocations(LOCS); }
  let LOCS=loadLocs();
  const LOCATIONS_OF=()=>LOCS.map(l=>l.n);
  const STATES=['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware',
    'District of Columbia','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky',
    'Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana',
    'Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota',
    'Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas',
    'Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'];
  const TZS=['Eastern Time','Central Time','Mountain Time','Mountain Time (Arizona, no DST)','Pacific Time','Alaska Time','Hawaii Time'];
  const BRANDS_OF=()=>[...new Set(LOCS.map(l=>l.brand))];
  /* TWO KINDS OF THINGS — this is the whole mental model:
     TOOLS   = real app features (Dashboard, Schedule, Marketing). Fixed. You only choose WHO gets them.
     DOCSECS = document sections that live inside Documents (HR, Vendors, ...). Admin can CREATE these. */
  const TOOLS=[
    {k:'dashboard',n:'Dashboard (Goals Tracker)',s:'Dashboard',ic:'📊'},
    {k:'schedule',n:'Schedule',s:'Schedule',ic:'📅'},
    {k:'production',n:'Enter Production (type the numbers)',s:'Enter Prod',ic:'📝'},
    {k:'marketing',n:'Marketing board',s:'Marketing',ic:'📣'},
    {k:'team',n:'Team (who\u2019s who)',s:'Directory',ic:'👥'},
    {k:'admin',n:'Admin Console',s:'Admin',ic:'⚙️'}
  ];
  const DEFAULT_DOCSECS=[
    {k:'hr',n:'HR',ic:'👥',structure:'plain',locMode:'all',locs:[],teamMode:'all',teams:[],items:[
      {n:'Employee & Family Tx',aud:'everyone'},{n:'Dental Professionals Discount',aud:'everyone'},
      {n:'Uniform Policy',aud:'everyone'},{n:'Commitment to my Co-Workers',aud:'everyone'},
      {n:'New Hire Packet — Texas',aud:'location',scope:'Texas offices'},{n:'PTO — Texas',aud:'location',scope:'Texas offices'},
      {n:'New Hire Packet — New Mexico',aud:'location',scope:'New Mexico offices'},{n:'PTO — New Mexico',aud:'location',scope:'New Mexico offices'},
      {n:'Payroll Tracking Sheet',aud:'team',scope:'HR, Managers'},{n:'Employee Dismissal Checklist',aud:'team',scope:'Managers'}]},
    {k:'officedocs',n:'Office Docs',ic:'🏢',structure:'byLocation',locMode:'all',locs:[],teamMode:'some',teams:['Office Managers','Clinic Managers'],
      locItems:['Office Contracts','Equipment Invoices','Dental Licenses']},
    {k:'forms',n:'Office Forms',ic:'📝',structure:'byBrand',locMode:'all',locs:[],teamMode:'all',teams:[],
      brandItems:['DDS Referral','Medical History','Invisalign / Vivera Scan Sheet']},
    {k:'vendors',n:'Vendors',ic:'🚚',structure:'plain',locMode:'all',locs:[],teamMode:'some',teams:['Office Managers'],items:[
      {n:'Approved Vendor List',aud:'team',scope:'Managers'},{n:'Vendor Tracking Sheet',aud:'team',scope:'Managers'}]},
    {k:'filing',n:'Insurance / W-9',ic:'🗂️',structure:'plain',locMode:'all',locs:[],teamMode:'some',teams:['Financial Coordinator Team','Office Managers'],items:[
      {n:'W-9s',aud:'team',scope:'Financial, Managers'},{n:'Type 2 NPI Letter',aud:'team',scope:'Financial, Managers'}]},
    {k:'eom',n:'End-of-Month Reporting',ic:'📆',structure:'plain',locMode:'all',locs:[],teamMode:'some',teams:['Leadership Team','Financial Coordinator Team'],items:[
      {n:'Monthly Monitor Report',aud:'team',scope:'Leadership'},{n:'RIP Tracker',aud:'team',scope:'Leadership, Financial'},{n:'Medicaid Tracker',aud:'team',scope:'Financial'}]}
  ];
  function loadSecs(){ try{ const st=JSON.parse(localStorage.getItem('ph_docsecs')); if(Array.isArray(st)&&st.length)return st; }catch(_){} return JSON.parse(JSON.stringify(DEFAULT_DOCSECS)); }
  function saveSecs(){ try{ localStorage.setItem('ph_docsecs',JSON.stringify(DOCSECS)); }catch(_){} }
  let DOCSECS=loadSecs();
  const allSections=()=>TOOLS.concat(DOCSECS);

  const DEFAULT_TEAMS=['Executive Team','Leadership Team','Office Managers','Clinic Managers','TCs','Doctors','Marketing Team','Financial Coordinator Team','Staff','Admin'];
  function loadTeams(){ try{ const st=JSON.parse(localStorage.getItem('ph_teams')); if(Array.isArray(st)&&st.length)return st; }catch(_){} return DEFAULT_TEAMS.slice(); }
  function saveTeams(){ try{ localStorage.setItem('ph_teams',JSON.stringify(TEAMS)); }catch(_){} }
  let TEAMS=loadTeams();
  // THE WHOLE MODEL: team = what you can do; location = which offices' stuff you see.
  const LEVELS=['none','view','add','edit','manage'];
  // Only offer choices that mean something. A square with five options where three do
  // nothing is the same trap the old "Roles" tab was.
  const SEC_LEVELS={
    dashboard:['none','view'],
    production:['none','edit','manage'],
    schedule:['none','view','edit'],
    marketing:['none','view','edit'],
    team:['none','view'],
    admin:['none','manage']
  };
  const levelsFor=k=>SEC_LEVELS[k]||LEVELS;   // document sections use the full ladder
  // short text in the grid square
  const SEC_SHORT={production:{edit:'Enter',manage:'Enter + goals'},admin:{manage:'Full control'}};
  const shortFor=(k,l)=>((SEC_SHORT[k]||{})[l])||LVLNAME[l];
  // plain-English explanation in the picker
  const SEC_DESC={
    dashboard:{view:'Can see the numbers for their offices'},
    production:{edit:'Can type the monthly actuals',manage:'Can type actuals AND set the goals'},

      TEAMS=TEAMS.map(t=>t===d.old?nm:t);

      users.forEach(u=>{ u.teams=u.teams.map(t=>t===d.old?nm:t); });

  function saveLoc(){
    const nm=(el('locName')?el('locName').value:locDraft.n).trim(); if(!nm)return;
    // Keep whatever the Schedule owns on this record — colour, lunch and opening days —
    // otherwise saving a brand or timezone here would silently wipe the rota.
    const keep = locDraft.i<0 ? {} : LOCS[locDraft.i];
    const rec=Object.assign({},keep,{n:nm,brand:locDraft.brand,state:locDraft.state,tz:locDraft.tz});
    if(locDraft.i<0) LOCS.push(rec); else LOCS[locDraft.i]=rec;
    saveLocs(); closeModal(); renderLocs();
  }
  function delLoc(){ if(locDraft.i>=0){LOCS.splice(locDraft.i,1); saveLocs();} closeModal(); renderLocs(); }
  function resetLocs(){ try{localStorage.removeItem('ph_locations');}catch(_){} LOCS=PH.locations(); renderLocs(); }

  /* ---------- DOCUMENT SECTIONS (admin can create these) ---------- */
  const ICONS=['📁','👥','🏢','📝','🚚','🗂️','📆','🎓','🦷','💡','🧾','🔧','⭐','🔒'];
  function audChip(aud,scope,onclick){ return '<span class="aud '+aud+(onclick?'':' locked')+'"'+(onclick?' onclick="'+onclick+'"':'')+'>'+AUDLBL[aud]+(scope?' · '+scope:'')+'</span>'; }
  function fileRow(name,chip){ return '<div class="file"><span class="fic">📄</span><span class="fn">'+name+'</span>'+chip+'</div>'; }
  function whoLine(sec){
    const team = sec.teamMode==='all' ? 'Everyone' : ((sec.teams||[]).join(', ')||'no teams yet');
    const loc  = sec.locMode==='all' ? 'All offices' : ((sec.locs||[]).join(', ')||'no locations yet');
    return '<span class="aud team">👥 '+team+'</span><span class="aud location">📍 '+loc+'</span>';
  }
  function renderFiles(){
    const secHtml=DOCSECS.map(sec=>{
      const open=openSecs.has(sec.k); let body='';
      if(sec.structure==='byLocation'){
        body='<p class="mini" style="margin:8px 0 2px">Automatically has <b>one folder per office</b> — each office only sees its own.</p>'+
          LOCATIONS_OF().map(loc=>'<div class="folder"><div class="folder-h">📁 '+loc+' '+audChip('location',loc+' team')+'</div>'+
            (sec.locItems||[]).map(it=>fileRow(it,audChip('location',null))).join('')+'</div>').join('');
      } else if(sec.structure==='byBrand'){
        body='<p class="mini" style="margin:8px 0 2px">Automatically has <b>one folder per brand</b>.</p>'+
          BRANDS_OF().map(b=>'<div class="folder"><div class="folder-h">📁 '+b+' '+audChip('everyone',null)+'</div>'+
            (sec.brandItems||[]).map(it=>fileRow(it,audChip('everyone',null))).join('')+'</div>').join('');
      } else {
        const items=sec.items||[];
        body= items.length ? '<div class="folder">'+items.map((it,idx)=>fileRow(it.n,audChip(it.aud||'everyone',it.scope,'AD.pickAud(event,\''+sec.k+'\','+idx+')'))).join('')+'</div>'
                           : '<p class="mini" style="margin:8px 0 0">No files yet — add the first one below.</p>';
      }
      const addf='<div class="addfile"><button class="btn ghost" onclick="event.stopPropagation();AD.addFile(\''+sec.k+'\')">+ Add file</button><span class="mini">New files inherit this section\'s audience — no extra setup.</span></div>';
      return '<div class="sec'+(open?' open':'')+'"><div class="sec-h" onclick="AD.tog(\''+sec.k+'\')">'+
          '<span class="car">▶</span><span style="font-size:19px">'+(sec.ic||'📁')+'</span>'+
          '<div style="flex:1"><div class="sn">'+sec.n+'</div><div class="secwho">'+whoLine(sec)+'</div></div>'+
          '<button class="btn ghost mini-btn" onclick="event.stopPropagation();AD.editSec(\''+sec.k+'\')">Edit</button></div>'+
        '<div class="sec-b">'+body+addf+'</div></div>';
    }).join('');
    el('view').innerHTML=
      '<div class="intro"><b>Two different things:</b> <b>App tools</b> (Dashboard, Schedule, Marketing) are built-in features — you only choose who gets them. <b>Document sections</b> below are the folders inside <b>Documents</b>, and you can <b>add as many as you want</b>.</div>'+
      '<div class="card" style="padding:14px 16px;margin-bottom:18px"><div class="panel-lab" style="margin-bottom:8px">App tools — built in, can\'t be added or removed</div>'+
        '<div class="chips">'+TOOLS.map(t=>'<span class="chip">'+t.ic+' '+t.n+'</span>').join('')+'</div>'+
        '<p class="mini" style="margin:9px 0 0">Choose who gets each one in <b>Teams &amp; Access</b>.</p></div>'+
      '<div class="toolrow"><div class="panel-lab" style="margin:0">Document sections — '+DOCSECS.length+' right now</div><span style="flex:1"></span>'+
        '<button class="btn ghost" onclick="AD.resetSecs()">Reset to defaults</button><button class="btn" onclick="AD.newSec()">+ New section</button></div>'+
      '<div class="secacc">'+secHtml+'</div>';
  }
  function tog(k){ if(openSecs.has(k))openSecs.delete(k); else openSecs.add(k); renderFiles(); }
  /* Adding a file ALWAYS asks who it's for — nothing gets shared by accident. */
  let fileDraft=null;
  function addFile(k){ const sec=DOCSECS.find(x=>x.k===k); if(!sec)return;
    fileDraft={k:k,n:'',locMode:'inherit',locs:[],teamMode:'inherit',teams:[]}; renderFileModal(); }
  function renderFileModal(){
    const d=fileDraft, sec=DOCSECS.find(x=>x.k===d.k);
    const seg=(cur,v,lab,fn)=>'<button class="segb'+(cur===v?' on':'')+'" onclick="AD.'+fn+'(\''+v+'\')">'+lab+'</button>';
    const locPick = d.locMode==='some' ? '<div class="teampick" style="margin-top:8px">'+LOCATIONS_OF().map(l=>'<button class="tp'+(d.locs.includes(l)?' on':'')+'" onclick="AD.togFileLoc(\''+l+'\')">'+l+'</button>').join('')+'</div>' : '';
    const teamPick = d.teamMode==='some' ? '<div class="teampick" style="margin-top:8px">'+TEAMS.filter(t=>t!=='Admin').map(t=>'<button class="tp'+(d.teams.includes(t)?' on':'')+'" onclick="AD.togFileTeam(\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>').join('')+'</div>' : '';
    const inheritTeam = sec.teamMode==='all'?'Everyone':((sec.teams||[]).join(', ')||'the section\u2019s teams');
    const inheritLoc  = sec.locMode==='all'?'All offices':((sec.locs||[]).join(', ')||'the section\u2019s locations');
    openModal(
      '<div class="m-top"><h3 style="margin:0;font-size:17px;color:var(--navy)">\u2795 Add a file to '+sec.n+'</h3><button class="x" onclick="AD.close()">\u00d7</button></div>'+
      '<div class="dm-banner" style="background:var(--teal-soft);border-bottom:1px solid #c4e6e3;color:#0c5b57;font-size:12.5px;padding:10px 20px;line-height:1.5">Pick the file, then confirm <b>who can see it</b>. By default it matches the rest of the folder \u2014 change it only if this one file is an exception.</div>'+
      '<div class="m-body">'+
        '<div class="fld"><label>Which document?</label>'+PH.drivePicker({ns:'AD',path:drivePath,name:d.n,path2:d.path})+'</div>'+
        '<div class="fld"><label>\ud83d\udc65 Which teams can open it?</label><div class="segrow">'+
          seg(d.teamMode,'inherit','Same as folder','setFileTeamMode')+seg(d.teamMode,'all','Everyone','setFileTeamMode')+seg(d.teamMode,'some','Specific teams','setFileTeamMode')+'</div>'+teamPick+'</div>'+
        '<div class="fld"><label>\ud83d\udccd Which locations?</label><div class="segrow">'+
          seg(d.locMode,'inherit','Same as folder','setFileLocMode')+seg(d.locMode,'all','All offices','setFileLocMode')+seg(d.locMode,'some','Specific locations','setFileLocMode')+'</div>'+locPick+'</div>'+
        '<div class="accessbox"><h4>Who will see this file</h4><div id="fWho"></div></div>'+
      '</div>'+
      '<div class="m-foot"><span style="flex:1"></span><button class="btn ghost" onclick="AD.close()">Cancel</button><button class="btn" onclick="AD.saveFile()">Add file</button></div>');
    updFileWho(inheritTeam,inheritLoc);
  }
  function updFileWho(it,il){
    const d=fileDraft, box=el('fWho'); if(!box)return;
    const sec=DOCSECS.find(x=>x.k===d.k);
    it=it||(sec.teamMode==='all'?'Everyone':((sec.teams||[]).join(', ')||'the section\u2019s teams'));
    il=il||(sec.locMode==='all'?'All offices':((sec.locs||[]).join(', ')||'the section\u2019s locations'));
    const team = d.teamMode==='inherit'? it : d.teamMode==='all'? 'Everyone' : ((d.teams||[]).join(', ')||'(pick teams)');
    const loc  = d.locMode==='inherit' ? il : d.locMode==='all' ? 'All offices' : ((d.locs||[]).join(', ')||'(pick locations)');
    box.innerHTML='\ud83d\udc41 <b>'+team+'</b> at <b>'+loc+'</b> will see <b>'+(d.n||'this file')+'</b> \u2014 a person must match <b>both</b>.'+
      (d.teamMode==='inherit'&&d.locMode==='inherit'?' <span style="color:var(--soft)">(inherited from the folder)</span>':' <span style="color:var(--bad);font-weight:700">(exception \u2014 different from the folder)</span>');
  }
  // Same shared picker as Documents (PH.drivePicker) — the hub LINKS the live file on
  // their Microsoft drive, it never keeps a copy.
  let drivePath='';
  function cd(p){ drivePath=p; renderFileModal(); }
  function useFile(n){ fileDraft.n=n;
    fileDraft.path='Microsoft drive \u203a '+(drivePath?drivePath.split('/').join(' \u203a '):'root'); renderFileModal(); }
  function clearFile(){ fileDraft.n=''; fileDraft.path=''; renderFileModal(); }
  function uploadFile(){ fileDraft.n='New document.pdf';
    fileDraft.path='Uploaded to Microsoft drive \u203a '+(drivePath||'Home-Brace')+' \u2014 then linked'; renderFileModal(); }
  function setFileTeamMode(m){ fileDraft.teamMode=m; if(m!=='some')fileDraft.teams=[]; renderFileModal(); }
  function setFileLocMode(m){ fileDraft.locMode=m; if(m!=='some')fileDraft.locs=[]; renderFileModal(); }
  function togFileLoc(l){ const a=fileDraft.locs, i=a.indexOf(l); if(i>=0)a.splice(i,1); else a.push(l); renderFileModal(); }
  function togFileTeam(t){ const a=fileDraft.teams, i=a.indexOf(t); if(i>=0)a.splice(i,1); else a.push(t); renderFileModal(); }
  function saveFile(){
    const d=fileDraft, sec=DOCSECS.find(x=>x.k===d.k); if(!sec)return;
    const nm=d.n||'New document.pdf';
    if(sec.structure==='byLocation'){ sec.locItems=sec.locItems||[]; sec.locItems.push(nm); }
    else if(sec.structure==='byBrand'){ sec.brandItems=sec.brandItems||[]; sec.brandItems.push(nm); }
    else {
      sec.items=sec.items||[];
      let aud='everyone',scope;
      if(d.teamMode==='some'&&d.teams.length){ aud='team'; scope=d.teams.join(', '); }
      else if(d.locMode==='some'&&d.locs.length){ aud='location'; scope=d.locs.join(', '); }
      else if(d.teamMode==='inherit'||d.locMode==='inherit'){
        if(sec.teamMode==='some'&&(sec.teams||[]).length){ aud='team'; scope=sec.teams.join(', '); }
        else if(sec.locMode==='some'&&(sec.locs||[]).length){ aud='location'; scope=sec.locs.join(', '); }
      }
      sec.items.push({n:nm,aud:aud,scope:scope});
    }
    saveSecs(); closeModal(); openSecs.add(d.k); renderFiles();
  }
  function noop(){}

  /* ----- create / edit a section ----- */
  let secDraft=null;
  function newSec(){ secDraft={k:'',n:'',ic:'📁',structure:'plain',locMode:'all',locs:[],teamMode:'all',teams:[],isNew:true}; renderSecModal(); }
  function editSec(k){ const sec=DOCSECS.find(x=>x.k===k); if(!sec)return;
    secDraft=Object.assign({},sec,{locs:(sec.locs||[]).slice(),teams:(sec.teams||[]).slice(),isNew:false}); renderSecModal(); }
  function renderSecModal(){
    const d=secDraft;
    const seg=(cur,v,lab,fn)=>'<button class="segb'+(cur===v?' on':'')+'" onclick="AD.'+fn+'(\''+v+'\')">'+lab+'</button>';
    const icons=ICONS.map(i=>'<button class="icb'+(d.ic===i?' on':'')+'" onclick="AD.setSecIcon(\''+i+'\')">'+i+'</button>').join('');
    const locPick = d.locMode==='some' ? '<div class="teampick" style="margin-top:8px">'+LOCATIONS_OF().map(l=>'<button class="tp'+(d.locs.includes(l)?' on':'')+'" onclick="AD.togSecLoc(\''+l+'\')">'+l+'</button>').join('')+'</div>' : '';
    const teamPick = d.teamMode==='some' ? '<div class="teampick" style="margin-top:8px">'+TEAMS.filter(t=>t!=='Admin').map(t=>'<button class="tp'+(d.teams.includes(t)?' on':'')+'" onclick="AD.togSecTeam(\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>').join('')+'</div>' : '';
    openModal(
      '<div class="m-top"><h3 style="margin:0;font-size:17px;color:var(--navy)">'+(d.isNew?'➕ New document section':'Edit section')+'</h3><button class="x" onclick="AD.close()">×</button></div>'+
      '<div class="m-body">'+
        '<div class="fld"><label>Section name</label><input id="secName" value="'+(d.n||'').replace(/"/g,'&quot;')+'" placeholder="e.g. Training, Compliance, Onboarding" oninput="AD.setSecName(this.value)"></div>'+
        '<div class="fld"><label>Icon</label><div class="iconrow">'+icons+'</div></div>'+
        '<div class="fld"><label>How is it organized?</label><div class="segrow">'+
          seg(d.structure,'plain','Just files','setSecStruct')+seg(d.structure,'byLocation','A folder for each office','setSecStruct')+seg(d.structure,'byBrand','A folder for each brand','setSecStruct')+'</div></div>'+
        '<div class="fld"><label>👥 Which teams can see it?</label><div class="segrow">'+seg(d.teamMode,'all','Everyone','setSecTeamMode')+seg(d.teamMode,'some','Specific teams','setSecTeamMode')+'</div>'+teamPick+'</div>'+
        '<div class="fld"><label>📍 Which locations?</label><div class="segrow">'+seg(d.locMode,'all','All offices','setSecLocMode')+seg(d.locMode,'some','Specific locations','setSecLocMode')+'</div>'+locPick+'</div>'+
        '<div class="accessbox"><h4>What will happen</h4><div id="secWho"></div></div>'+
      '</div>'+
      '<div class="m-foot">'+(d.isNew?'':'<button class="btn ghost" onclick="AD.delSec(\''+d.k+'\')">Delete section</button>')+
        '<span style="flex:1"></span><button class="btn ghost" onclick="AD.close()">Cancel</button>'+
        '<button class="btn" onclick="AD.saveSec()">'+(d.isNew?'Create section':'Save')+'</button></div>');
    updSecWho();
  }
  function updSecWho(){
    const d=secDraft, box=el('secWho'); if(!box)return;
    const nm=d.n||'This section';
    const team = d.teamMode==='all' ? 'everyone' : ((d.teams||[]).join(', ')||'(pick teams)');
    const loc  = d.locMode==='all' ? 'all offices' : ((d.locs||[]).join(', ')||'(pick locations)');
    const struct = d.structure==='byLocation' ? ' It will start with <b>one folder per office</b>.' : d.structure==='byBrand' ? ' It will start with <b>one folder per brand</b>.' : '';
    box.innerHTML='<b>'+nm+'</b> will appear under <b>Documents</b> for <b>'+team+'</b> at <b>'+loc+'</b>.'+struct+' They get <b>View</b> to start — change any team to Add/Edit in <b>Teams &amp; Access</b>.';
  }
  function setSecName(v){ secDraft.n=v; updSecWho(); }
  function setSecIcon(v){ secDraft.ic=v; renderSecModal(); }
  function setSecStruct(v){ secDraft.structure=v; renderSecModal(); }
  function setSecLocMode(m){ secDraft.locMode=m; if(m==='all')secDraft.locs=[]; renderSecModal(); }
  function setSecTeamMode(m){ secDraft.teamMode=m; if(m==='all')secDraft.teams=[]; renderSecModal(); }
  function togSecLoc(l){ const i=secDraft.locs.indexOf(l); if(i>=0)secDraft.locs.splice(i,1); else secDraft.locs.push(l); renderSecModal(); }
  function togSecTeam(t){ const i=secDraft.teams.indexOf(t); if(i>=0)secDraft.teams.splice(i,1); else secDraft.teams.push(t); renderSecModal(); }
  function saveSec(){
    const d=secDraft; const nameEl=el('secName');
    const typed=(nameEl?nameEl.value:'').trim(); d.n=(typed||d.n||'').trim()||'New section';
    if(d.isNew){
      d.k='sec_'+Math.abs(d.n.split('').reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)).toString(36)+DOCSECS.length;
      const sec={k:d.k,n:d.n,ic:d.ic,structure:d.structure,locMode:d.locMode,locs:d.locs.slice(),teamMode:d.teamMode,teams:d.teams.slice()};
      if(d.structure==='byLocation')sec.locItems=[]; else if(d.structure==='byBrand')sec.brandItems=[]; else sec.items=[];
      DOCSECS.push(sec); ensureAccess(); applySecAudience(sec); openSecs.add(sec.k);
    } else {
      const sec=DOCSECS.find(x=>x.k===d.k);
      Object.assign(sec,{n:d.n,ic:d.ic,structure:d.structure,locMode:d.locMode,locs:d.locs.slice(),teamMode:d.teamMode,teams:d.teams.slice()});
      if(sec.structure==='byLocation'&&!sec.locItems)sec.locItems=[];
      if(sec.structure==='byBrand'&&!sec.brandItems)sec.brandItems=[];
      if(sec.structure==='plain'&&!sec.items)sec.items=[];
      ensureAccess(); applySecAudience(sec);
    }
    saveSecs(); closeModal(); renderFiles();
  }
  function delSec(k){ DOCSECS=DOCSECS.filter(x=>x.k!==k); saveSecs(); closeModal(); renderFiles(); }
  function resetSecs(){ DOCSECS=JSON.parse(JSON.stringify(DEFAULT_DOCSECS)); saveSecs(); ensureAccess(); renderFiles(); }

  /* ---------- TAP-TO-PICK MENU (one tap opens choices; one tap picks) ---------- */
  let pk=null;
  function closePk(){ if(pk){pk.remove();pk=null;} }
  function openPk(anchor,items,onPick){
    closePk();
    pk=document.createElement('div'); pk.className='pk';
    items.forEach(it=>{
      const b=document.createElement('button'); if(it.cur)b.classList.add('cur');
      b.innerHTML=(it.swatch?'<span class="sw" style="background:'+it.swatch+'"></span>':'')+
        '<span>'+it.label+(it.desc?'<small>'+it.desc+'</small>':'')+'</span>'+(it.cur?'<span class="ck">✓</span>':'');
      b.onclick=e=>{e.stopPropagation(); closePk(); onPick(it.value);};
      pk.appendChild(b);
    });
    document.body.appendChild(pk);
    const r=anchor.getBoundingClientRect(), pr=pk.getBoundingClientRect();
    let top=r.bottom+6; if(top+pr.height>window.innerHeight-8) top=Math.max(8,r.top-pr.height-6);
    let left=Math.min(Math.max(8,r.left),window.innerWidth-pr.width-8);
    pk.style.top=top+'px'; pk.style.left=left+'px';
  }
  document.addEventListener('click',e=>{ if(pk&&!pk.contains(e.target))closePk(); });
  window.addEventListener('scroll',closePk,true);
  window.addEventListener('resize',closePk);

  const LVLSW={none:'#f4f6f8',view:'#E3F0FA',add:'#E7F4EE',edit:'#E5F4F3',manage:'#0F2A4A'};
  const LVLDESC={none:"Can't see this section",view:'Can look, nothing else',add:'Can view + upload files',edit:'Can view, add & change',manage:'Full control'};
  function pickLevel(ev,t,k){
    ev.stopPropagation();
    openPk(ev.currentTarget, levelsFor(k).map(l=>({value:l,label:(l==='none'?'None':shortFor(k,l)),desc:descFor(k,l),swatch:LVLSW[l],cur:(access[t][k]||'none')===l})),
      v=>{ access[t][k]=v; renderAccess(); });
  }
  function pickAud(ev,k,idx){
    ev.stopPropagation(); const sec=DOCSECS.find(x=>x.k===k); if(!sec)return; const it=sec.items[idx];
    openPk(ev.currentTarget,[
      {value:'everyone',label:'🌐 Everyone',desc:'The whole practice',cur:(it.aud||'everyone')==='everyone'},
      {value:'location',label:'📍 By location / state',desc:'Only certain offices',cur:it.aud==='location'},
      {value:'team',label:'👥 By team',desc:'Only certain teams',cur:it.aud==='team'}
    ], v=>{ it.aud=v; if(v==='everyone')delete it.scope; else if(!it.scope)it.scope=(v==='location'?'Choose location':'Choose team'); saveSecs(); renderFiles(); });
  }

  function openModal(h){ el('modalCard').innerHTML=h; el('modal').classList.add('open'); }
  function closeModal(){ el('modal').classList.remove('open'); }

  window.AD={tab:tabSet,newTeam,editTeam,saveTeam,delTeam,resetTeams,profile,whyNoAdd,togTeam,togLoc,setStatus,saveUser,pickLevel,pickAud,tog,addFile,noop,newSec,editSec,saveSec,delSec,resetSecs,setSecName,setSecIcon,setSecStruct,setSecLocMode,setSecTeamMode,togSecLoc,togSecTeam,saveFile,cd,useFile,clearFile,uploadFile,setFileTeamMode,setFileLocMode,togFileLoc,togFileTeam,renderLocs,newLoc,editLoc,saveLoc,delLoc,resetLocs,setLocBrand,setLocState,setLocTZ,close:closeModal};
  el('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  render();
})();
</script>
<script>PH.nav('admin');</script>
<script src="tour.js?v=hb36"></script>
<script>
Tour.init([
  {sel:'#tabs', title:'This is your control room', body:'Four tabs and you can run the whole hub: <b>People</b>, <b>Teams &amp; Access</b>, <b>Document Sections</b> and <b>Locations</b>. No developer, no consultant.', pre:()=>AD.tab('users')},
  {sel:'.intro', title:'People come from Microsoft', body:'Everyone on your Microsoft 365 account appears here automatically \u2014 names, emails and photos included. You never retype staff details.', pre:()=>AD.tab('users')},
  {sel:'table.u tbody tr', title:'Setting one person up', body:'Tap anyone. You set just three things: their <b>team(s)</b>, their <b>location(s)</b> and their <b>status</b>. That is the entire job of adding a new hire.', pre:()=>AD.tab('users')},
  {sel:'.intro', title:'The one rule to remember', body:'A person\u2019s <b>team</b> decides <b>what they can do</b>. Their <b>location</b> decides <b>whose offices they see</b>. Someone on two teams gets the more generous of the two.', pre:()=>AD.tab('access')},
  {sel:'table.mx', title:'Who can do what', body:'Teams down the side, sections across the top. <b>Tap any square</b> and pick: None, View, Add files, Edit or Manage. Changing one square changes it for everyone on that team, instantly.', pre:()=>AD.tab('access')},
  {sel:'.card', title:'Tools vs documents', body:'<b>App tools</b> (Dashboard, Schedule, Marketing) are built in \u2014 you only choose who gets them. Everything below is <b>document sections</b>, and those are yours to create.', pre:()=>AD.tab('files')},
